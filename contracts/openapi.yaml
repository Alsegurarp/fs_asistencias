  /week-closure-runs:
    get:
      tags: [jornada]
      operationId: listWeekClosureRuns
      summary: Lista las corridas de cierre
      description: |
        De la más antigua a la más reciente. Incluye las que abrió el cierre
        programado, con `origin` en `scheduled`.
      x-roles: [admin_empresa, rh, supervisor, auditor]
      parameters:
        - name: week
          in: query
          description: Cualquier fecha de la semana. Sin ella, las de todas las semanas.
          schema:
            type: string
            format: date
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Página de corridas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeekClosureRunList"
              example:
                items:
                  - id: 4d6f8a0c-2e4a-4c6e-8a0c-4e6a8c0e2a4c
                    weekStart: "2026-10-05"
                    siteId: null
                    origin: requested
                    status: done
                    total: 640
                    closed: 628
                    blocked:
                      openIncidents: 9
                      openSegment: 3
                    requestedBy: a3c5e7b9-1d3f-4b5a-9c7e-1b3d5f7a9c1e
                    failure: null
                    createdAt: "2026-10-12T16:00:00Z"
                    startedAt: "2026-10-12T16:00:02Z"
                    finishedAt: "2026-10-12T16:00:41Z"
                nextCursor: null
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [jornada]
      operationId: requestWeekClosureRun
      summary: Pide cerrar la semana de toda la empresa o de una sede, como trabajo
      description: |
        Hace lo mismo que `closeWeek`, sin tope de personas y sin esperar la
        respuesta: la corrida queda en `queued`, la atiende un trabajo y hay
        que consultar `getWeekClosureRun` hasta verla en `done` o en `failed`.

        Entran las personas activas y las que marcaron esa semana, de toda la
        empresa o de la sede de `siteId`. `weekStart` admite cualquier fecha
        de la semana. Cada persona se cierra por separado: lo que ya se cerró
        sigue cerrado aunque la corrida se interrumpa, y pedirla otra vez
        retoma lo que faltó. Quien tiene incidencias abiertas o un tramo sin
        cerrar no se cierra y se cuenta en `blocked`; se le encuentra con
        `listIncidents`, pidiendo las abiertas de esa semana.

        Mientras una corrida de esa semana y ese alcance no termina, pedirla
        otra vez devuelve la misma.

        Cierre programado: si la empresa tiene `autoCloseAfterHours`, el
        sistema abre por su cuenta una corrida de toda la empresa cuando pasa
        ese plazo desde el fin de la semana, una sola vez por semana. Sus
        cierres llevan `closedBy` en nulo. A quien deje bloqueado lo cierra
        después una persona.

        Responde 422 con el error `week_not_finished` si la semana todavía no
        termina en la zona horaria de la empresa, o con `no_rules_for_date`
        si no hay reglas laborales registradas para esa semana.
      x-roles: [admin_empresa, rh]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WeekClosureRunCreate"
            example:
              weekStart: "2026-10-05"
      responses:
        "202":
          description: Corrida encolada, o la que ya estaba en curso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeekClosureRun"
              example:
                id: 4d6f8a0c-2e4a-4c6e-8a0c-4e6a8c0e2a4c
                weekStart: "2026-10-05"
                siteId: null
                origin: requested
                status: queued
                total: null
                closed: 0
                blocked:
                  openIncidents: 0
                  openSegment: 0
                requestedBy: a3c5e7b9-1d3f-4b5a-9c7e-1b3d5f7a9c1e
                failure: null
                createdAt: "2026-10-12T16:00:00Z"
                startedAt: null
                finishedAt: null
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /week-closure-runs/{runId}:
    parameters:
      - $ref: "#/components/parameters/RunId"
    get:
      tags: [jornada]
      operationId: getWeekClosureRun
      summary: Devuelve el avance y el resultado de una corrida de cierre
      description: |
        `total` es nulo hasta que la corrida empieza. `closed` cuenta a
        quienes quedaron con un cierre vigente, incluidos los que ya lo
        tenían. Mientras corre, las cuentas avanzan por tandas.

        `failed` quiere decir que la corrida no terminó, y `failure` dice por
        qué: `job_abandoned` si agotó sus intentos, o `tenant_not_active` si
        la empresa se suspendió antes. Lo que alcanzó a cerrar sigue cerrado.
      x-roles: [admin_empresa, rh, supervisor, auditor]
      responses:
        "200":
          description: Corrida de cierre
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeekClosureRun"
              example:
                id: 4d6f8a0c-2e4a-4c6e-8a0c-4e6a8c0e2a4c
                weekStart: "2026-10-05"
                siteId: null
                origin: requested
                status: done
                total: 640
                closed: 628
                blocked:
                  openIncidents: 9
                  openSegment: 3
                requestedBy: a3c5e7b9-1d3f-4b5a-9c7e-1b3d5f7a9c1e
                failure: null
                createdAt: "2026-10-12T16:00:00Z"
                startedAt: "2026-10-12T16:00:02Z"
                finishedAt: "2026-10-12T16:00:41Z"
