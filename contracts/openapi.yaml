              schema:
                $ref: "#/components/schemas/DeviceActivation"
              example:
                deviceId: 1c3e5a7b-9d0f-4a2c-8e4b-6d8f0a2c4e6b
                mode: personal
                tenant:
                  name: Panificadora Ejemplo
