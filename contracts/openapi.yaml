  /device-cards/credentials:
    post:
      tags: [captura]
      operationId: issuePilotCardCredential
      summary: Firma un código nuevo para una tarjeta del piloto
      description: |
        Sólo una terminal activa, en un ambiente que acepta las tarjetas del
        piloto. El servidor genera un código aleatorio y lo firma junto con
        el identificador de la tarjeta (`uid`) y la versión de la clave. La
        terminal lo escribe en la tarjeta, lo relee y después lo da de alta
        con `registerPilotCard`. No se guarda nada hasta ese alta. La tarjeta
        no lleva datos de la persona.

        Lo firmado son los bytes ASCII `zenit-classic-v1`, la longitud del
        identificador (un byte), el identificador, la versión de la clave (un
        byte) y el código. La firma es ECDSA P-256 con SHA-256, de 64 bytes
        (`r` seguido de `s`).

        Responde 409 con `code` `pilot_cards_disabled` si el ambiente no las
        acepta, y 403 si quien llama no es una terminal.
      security:
        - deviceToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PilotCardIssue"
            example:
              uid: a9c6cc10
      responses:
        "200":
          description: Código firmado, listo para escribirse
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PilotCardCredential"
              example:
                uid: a9c6cc10
                keyVersion: 1
                token: 3f1c9a0b7d2e4f6a8b0c1d2e3f405162
                signature: 3q2-7wAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /device-cards:
    post:
      tags: [captura]
      operationId: registerPilotCard
      summary: Da de alta en inventario una tarjeta del piloto ya escrita
      description: |
        La terminal manda lo que escribió y comprobó en la tarjeta. El servidor
        verifica la firma y la registra en inventario, con una etiqueta
        `ZC-` para encontrarla en el portal, donde se asigna a una persona.
        La huella guardada liga el código a su identificador; ni uno ni otro
        se guardan solos. Repetir el alta de la misma tarjeta devuelve la que
        ya existe con 200. Una firma que no corresponde responde 422 con
        `invalid_signature`.
      security:
        - deviceToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PilotCardRegistration"
            example:
              uid: a9c6cc10
              keyVersion: 1
              token: 3f1c9a0b7d2e4f6a8b0c1d2e3f405162
              signature: 3q2-7wAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
      responses:
        "201":
          description: Tarjeta registrada en inventario
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Card"
              example:
                id: 7b9d1f3a-5c7e-4a9b-8d0f-2a4c6e8a0b1d
                label: ZC-3F1C9A0B
                status: inventory
                keyVersion: 1
                technology: mifare_classic_signed
                assignment: null
                latestAssignment: null
                createdAt: "2026-11-10T16:20:00Z"
                updatedAt: "2026-11-10T16:20:00Z"
        "200":
          description: La tarjeta ya estaba registrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Card"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /attendance-events:
    get:
      tags: [jornada]
      operationId: listAttendanceEvents
      summary: Lista los marcajes con su evidencia minimizada
      description: Devuelve el veredicto de ubicación, no la coordenada.
      x-roles: [admin_empresa, rh, supervisor, auditor]
      parameters:
