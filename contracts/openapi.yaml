      operationId: listWeekClosures
      summary: Lista los cierres semanales
      description: |
        Todas las versiones de esa semana, de la más antigua a la más
        reciente: las reabiertas siguen en la lista con su estado. Los filtros
        se aplican en el servidor, antes de paginar: `siteId` es la sede de la
        persona, `status` el estado del cierre y `acknowledgement` su acuse,
        donde `none` es sin acuse.
