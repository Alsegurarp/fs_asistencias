      tags: [empresa]
      operationId: scheduleBreakPolicyChange
      summary: Programa el cambio de la política de comida de la empresa
      description: |
        La política de comida no cambia al instante: cambiarla a mitad de
        semana reinterpretaría las marcas ya hechas. Se programa, y entra el
        primer día de semana de la empresa dentro de la siguiente quincena
        (del 1 al 15 o del 16 al fin de mes), con al menos siete días de aviso
        contados hasta ese día; si no alcanzan, pasa a la quincena que sigue.
        La fecha la calcula el servicio en la zona horaria de la empresa y no
        se elige. Por ejemplo, con semana desde el lunes, programado el
        viernes 30 de octubre de 2026 entra el lunes 16 de noviembre, y
        programado el martes 10 de noviembre, el lunes 7 de diciembre.

        Desde ese día la captura, el cálculo de la semana, la app y el portal
        usan la política nueva; las semanas anteriores conservan la suya. Una
        marca que llega después sin red se interpreta con la política del día
        en que se hizo. Mientras no entra, `getTenant`, `getCurrentUser` y la
        sesión del dispositivo lo muestran para avisar a las personas.

        Responde 409 con `code` `break_policy_change_pending` si ya hay un
        cambio programado; hay que cancelarlo para programar otro. Responde
        422 con el error de `breakPolicy` en `same_break_policy` si la
        empresa ya tiene esa política.
      x-roles: [admin_empresa]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BreakPolicyChangeCreate"
            example:
              breakPolicy: marked
              reason: Desde noviembre el personal toma la comida en horario fijo y se registrará.
      responses:
        "201":
          description: Cambio programado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BreakPolicyChange"
              example:
                id: 5b7d9f1a-3c5e-4a7b-9d1f-3a5c7e9b1d3f
                breakPolicy: marked
                effectiveOn: "2026-11-16"
                effectiveAt: "2026-11-16T06:00:00Z"
                reason: Desde noviembre el personal toma la comida en horario fijo y se registrará.
                scheduledAt: "2026-10-30T17:00:00Z"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/BreakPolicyChangePending"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /tenant/break-policy-changes/{changeId}/cancellation:
    parameters:
      - $ref: "#/components/parameters/BreakPolicyChangeId"
    post:
      tags: [empresa]
      operationId: cancelBreakPolicyChange
      summary: Cancela el cambio de la política de comida que todavía no entra
      description: |
        Sólo se cancela un cambio que no ha entrado; uno que ya entró se
        corrige programando otro. Queda en la bitácora de la empresa.

        Responde 404 si el cambio no existe o es de otra empresa. Responde
        409 con `code` `break_policy_change_not_pending` si ya entró o ya
        estaba cancelado.
      x-roles: [admin_empresa]
      responses:
        "204":
          description: Cambio cancelado
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/BreakPolicyChangeNotPending"

  /tenants/{tenantId}/break-policy-changes:
    parameters:
