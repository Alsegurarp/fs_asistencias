        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Unprocessable"
    post:
      tags: [captura]
      operationId: submitAttendanceEvent
      summary: Registra un marcaje
      description: |
        El cuerpo lleva el sobre firmado por el dispositivo. La empresa, el
        dispositivo y la modalidad salen de la credencial, no del sobre.

        Responde 201 cuando el marcaje queda guardado y 200 cuando se repite
        una clave de idempotencia ya procesada o cuando la credencial se
        rechaza. Un rechazo viene con recibo y no se reintenta: no es un fallo
        de transporte.

        La cabecera `Idempotency-Key` debe ser la misma clave que va firmada
        en el sobre; si no coinciden responde 422. La misma clave con otro
        sobre responde 409 con `code` `idempotency_conflict`.

        Tipo de marcaje, mientras el equipo no decida otra cosa: sin
        `declaredType`, el servidor lo deduce de la marca anterior de la
        persona; un `declaredType` válido lo corrige. Una marca que no cuadra
        con la anterior se guarda con incidencia `missing_pair`, y dos
        lecturas de la misma persona en menos de un minuto son una sola, con
        incidencia `duplicate`. Pasadas 16 horas sin marcar, la siguiente
        abre una jornada nueva.

        Ubicación: una terminal se evalúa contra su sede y un teléfono
        personal contra la sede de su titular. Fuera de la geocerca abre
        `foreign_site`; una muestra menos precisa que el radio, simulada o
        ausente abre `location_inconclusive`. Quien marca en una terminal de
        otra sede abre `foreign_site`. Un marcaje que llega más de 24 horas
        después abre `late_sync`, y más de 72 horas después se rechaza con
        `too_old`. También abre `late_sync` el que llega cuando la semana de
        esa persona ya está cerrada: se guarda, pero el cierre no cambia solo.
        `card_revoked` cubre también a la persona dada de baja.
      security:
        - deviceToken: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttendanceEventSubmission"
            example:
              envelope: eyJhbGciOiJFUzI1NiIsImtpZCI6IjFjM2U1YTdiIn0.eyJpZGVtcG90ZW5jeUtleSI6ImVqZW1wbG8ifQ.ZmlybWEtZGUtZWplbXBsby1uby12YWxpZGE
      responses:
        "200":
          description: Marcaje repetido o rechazado, con su recibo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceReceipt"
              example:
                eventId: null
                idempotencyKey: 2d4f6a8c-0e2b-4d6f-8a0c-2e4b6d8f0a2c
                outcome: rejected
                type: null
                observedAt: "2026-10-05T13:00:00Z"
                receivedAt: "2026-10-05T13:00:01Z"
                employee: null
                site: null
                locationVerdict: not_evaluated
                incident: null
                rejection:
                  code: card_not_owner
                  message: La tarjeta no pertenece a quien tiene este dispositivo.
        "201":
          description: Marcaje guardado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceReceipt"
              example:
                eventId: 8b0d2f4a-6c8e-4a0c-9e2b-4d6f8a0c2e4b
                idempotencyKey: 2d4f6a8c-0e2b-4d6f-8a0c-2e4b6d8f0a2c
                outcome: accepted
                type: clock_in
                observedAt: "2026-10-05T13:00:00Z"
                receivedAt: "2026-10-05T13:00:01Z"
                employee:
                  displayName: Persona de Ejemplo Uno
                site:
                  id: 3b1f9a52-6c0d-4e7a-8f21-9d4c5b6a7e80
                  name: Sucursal Centro
                locationVerdict: inside
                incident: null
                rejection: null
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/TooManyRequests"

