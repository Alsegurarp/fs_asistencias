              example: attachment; filename="zenit-panificadora-2026-10-05.csv"
          content:
            text/csv:
              schema:
                type: string
              example: |
                tenant_slug,week_start,time_zone,rule_set_jurisdiction,rule_set_version,external_id,display_name,site_name,closure_version,worked_minutes,break_minutes,ordinary_minutes,overtime_minutes,acknowledgement,closed_at,closure_hash
                "panificadora",2026-10-05,"America/Mexico_City","MX-LFT",1,"E-001","Persona Uno","Sucursal Centro",1,2400,150,2400,0,agreed,2026-10-12T16:00:00Z,1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a6b7c8d9e0f1a2b
        "401":
