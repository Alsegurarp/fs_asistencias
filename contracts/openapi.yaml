      summary: Envía los marcajes guardados sin conexión
      description: |
        Cada sobre se procesa por separado y devuelve su propio recibo, en el
        mismo orden. El servidor conserva la hora observada y agrega la de
        recepción; nunca mueve un marcaje en silencio.

