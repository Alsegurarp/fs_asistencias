          type: [string, "null"]
          format: uuid
        activeCardId:
          type: [string, "null"]
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    EmployeeCreate:
      type: object
      additionalProperties: false
      required: [externalId, displayName, employmentStart]
      properties:
        externalId:
          type: string
          minLength: 1
          maxLength: 64
        displayName:
          type: string
          minLength: 1
          maxLength: 160
        siteId:
          type: [string, "null"]
          format: uuid
        employmentStart:
          type: string
          format: date
    EmployeeUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 160
        siteId:
          type: [string, "null"]
          format: uuid
        status:
          $ref: "#/components/schemas/EmployeeStatus"
        employmentEnd:
          type: [string, "null"]
          format: date
    EmployeeList:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Employee"
        nextCursor:
          $ref: "#/components/schemas/NextCursor"

    Import:
      type: object
      required: [id, status, dryRun, templateVersion, counts, errors, manifestHash, createdAt]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [validating, ready, applied, failed]
        dryRun:
          type: boolean
        templateVersion:
          type: integer
        counts:
          type: object
          required: [total, accepted, rejected]
          properties:
            total:
              type: integer
            accepted:
              type: integer
            rejected:
              type: integer
        errors:
          type: array
          description: Filas rechazadas, con su causa.
          items:
            $ref: "#/components/schemas/ImportRowError"
        manifestHash:
          oneOf:
            - $ref: "#/components/schemas/Sha256Hex"
            - type: "null"
        createdAt:
          type: string
          format: date-time
    ImportRowError:
      type: object
      required: [row, externalId, code, message]
      properties:
        row:
          type: integer
          minimum: 1
        externalId:
          type: [string, "null"]
        code:
          type: string
        message:
          type: string

    CardStatus:
      type: string
      enum: [inventory, assigned, active, revoked, lost, damaged, replaced]
    Card:
      type: object
      required: [id, label, status, keyVersion, assignment, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        label:
          type: string
          description: Número impreso en la tarjeta.
        status:
          $ref: "#/components/schemas/CardStatus"
        keyVersion:
          type: [integer, "null"]
        assignment:
          oneOf:
            - type: object
              required: [employeeId, since]
              properties:
                employeeId:
                  type: string
                  format: uuid
                since:
                  type: string
                  format: date-time
            - type: "null"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CardCreate:
      type: object
      additionalProperties: false
      required: [label, fingerprint]
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 40
        fingerprint:
          type: string
          minLength: 16
          maxLength: 128
          description: Huella criptográfica de la tarjeta. El UID público no basta como identidad.
    CardList:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Card"
        nextCursor:
          $ref: "#/components/schemas/NextCursor"
    CardAssignment:
      type: object
      required: [id, cardId, employeeId, since, until, replacedCardId]
      properties:
        id:
          type: string
          format: uuid
        cardId:
          type: string
          format: uuid
        employeeId:
          type: string
          format: uuid
        since:
          type: string
          format: date-time
        until:
          type: [string, "null"]
          format: date-time
        replacedCardId:
          type: [string, "null"]
          format: uuid
    CardAssignmentCreate:
      type: object
      additionalProperties: false
      required: [employeeId]
      properties:
        employeeId:
          type: string
          format: uuid
    CardRevocation:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          enum: [revoked, lost, damaged]
        note:
          type: string
          maxLength: 280

    DeviceMode:
      type: string
      enum: [personal, terminal]
      description: |
        `personal` es el teléfono de un trabajador y sólo acepta su tarjeta.
        `terminal` es un equipo compartido de una sede y acepta cualquier
        tarjeta activa de la empresa.
    DeviceStatus:
      type: string
      enum: [active, revoked, replaced]
    DeviceEnrollment:
      type: object
      required: [id, mode, employeeId, siteId, label, code, status, expiresAt, createdAt]
      properties:
        id:
          type: string
          format: uuid
        mode:
          $ref: "#/components/schemas/DeviceMode"
        employeeId:
          type: [string, "null"]
          format: uuid
        siteId:
          type: [string, "null"]
          format: uuid
        label:
          type: [string, "null"]
        code:
          type: string
          description: Código de un solo uso. Se muestra una vez.
        status:
          type: string
          enum: [pending, used, expired]
        expiresAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
    DeviceEnrollmentCreate:
      type: object
      additionalProperties: false
      required: [mode]
      properties:
        mode:
          $ref: "#/components/schemas/DeviceMode"
        employeeId:
          type: string
          format: uuid
          description: Obligatorio en `personal`.
        siteId:
          type: string
          format: uuid
          description: Obligatorio en `terminal`.
        label:
          type: string
          maxLength: 60
          description: Nombre para reconocer una terminal, por ejemplo «Recepción».
    PublicJwk:
      type: object
      additionalProperties: false
      required: [kty, crv, x, y]
      description: Clave pública del dispositivo en formato JWK, curva P-256.
      properties:
        kty:
          type: string
          const: EC
        crv:
          type: string
          const: P-256
        x:
          type: string
        y:
          type: string
    DeviceActivationRequest:
      type: object
      additionalProperties: false
      required: [enrollmentCode, publicKey, proof, device, screenLock]
      properties:
        enrollmentCode:
          type: string
          minLength: 6
          maxLength: 32
        publicKey:
          $ref: "#/components/schemas/PublicJwk"
        proof:
          $ref: "#/components/schemas/CompactJws"
          description: Firmado con la clave que se registra; su carga lleva `enrollmentCode`.
        device:
          type: object
          additionalProperties: false
          required: [manufacturer, model, androidSdk, appVersion]
          properties:
            manufacturer:
              type: string
              maxLength: 60
            model:
              type: string
              maxLength: 60
            androidSdk:
              type: integer
              minimum: 28
            appVersion:
              type: string
              maxLength: 20
        screenLock:
          type: boolean
          description: Si el dispositivo tiene bloqueo de pantalla. Es condición para enrolar.
        integrityToken:
          type: string
          description: Señal de integridad de la plataforma, cuando exista.
    DeviceActivation:
      type: object
      required: [deviceId, mode, tenant, employee, site, audience, session]
      properties:
        deviceId:
          type: string
          format: uuid
        mode:
          $ref: "#/components/schemas/DeviceMode"
        tenant:
          type: object
          required: [name, timeZone]
          properties:
            name:
              type: string
            timeZone:
              type: string
        employee:
          oneOf:
            - type: object
              required: [id, displayName]
              properties:
                id:
                  type: string
                  format: uuid
                displayName:
                  type: string
            - type: "null"
          description: Presente en `personal`.
        site:
          oneOf:
            - $ref: "#/components/schemas/SiteSummary"
            - type: "null"
          description: Presente en `terminal`.
        audience:
          type: string
          description: Valor que el dispositivo pone en `aud` de sus aserciones.
        session:
          $ref: "#/components/schemas/DeviceSession"
    SiteSummary:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    DeviceSessionCreate:
      type: object
      additionalProperties: false
      required: [appVersion]
      properties:
        appVersion:
          type: string
          maxLength: 20
    DeviceSession:
      type: object
      required: [sessionId, startedAt, serverTime, tokenMaxAgeSeconds, locationReuseSeconds, breakPolicy, offlinePolicy]
      properties:
        sessionId:
          type: string
          format: uuid
        startedAt:
          type: string
          format: date-time
        serverTime:
          type: string
          format: date-time
        breakPolicy:
          $ref: "#/components/schemas/BreakPolicy"
          description: Le dice a la app si debe ofrecer el marcaje de descanso.
        tokenMaxAgeSeconds:
          type: integer
          description: Vida máxima de una aserción del dispositivo.
        locationReuseSeconds:
          type: integer
          description: |
            Tiempo durante el que una terminal puede reutilizar una muestra de
            ubicación para lecturas seguidas. En `personal` vale 0.
        offlinePolicy:
          type: object
          required: [maxAgeHours, maxEvents]
          properties:
            maxAgeHours:
              type: integer
            maxEvents:
              type: integer
    Device:
      type: object
      required:
        - id
        - mode
        - status
        - employeeId
        - siteId
        - label
        - model
        - appVersion
        - enrolledAt
        - lastSeenAt
        - revokedAt
      properties:
        id:
          type: string
          format: uuid
        mode:
          $ref: "#/components/schemas/DeviceMode"
        status:
          $ref: "#/components/schemas/DeviceStatus"
        employeeId:
          type: [string, "null"]
          format: uuid
        siteId:
          type: [string, "null"]
          format: uuid
        label:
          type: [string, "null"]
        model:
          type: string
        appVersion:
          type: string
        enrolledAt:
          type: string
          format: date-time
        lastSeenAt:
          type: [string, "null"]
          format: date-time
        revokedAt:
          type: [string, "null"]
          format: date-time
    DeviceList:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Device"
        nextCursor:
          $ref: "#/components/schemas/NextCursor"
    DeviceRevocation:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 5
          maxLength: 280

    EventType:
      type: string
      enum: [clock_in, clock_out, break_start, break_end]
      description: |
        `break_start` y `break_end` sólo existen en empresas que marcan el
        descanso. En las demás el servidor fija siempre entrada o salida.
    LocationVerdict:
      type: string
      enum: [inside, outside, inconclusive, not_evaluated]
      description: |
        `inconclusive` cuando la precisión declarada es mayor que el radio de
        la sede. No se interpreta como fuera: abre una incidencia.
    AttendanceEventSubmission:
      type: object
      additionalProperties: false
      required: [envelope]
      properties:
        envelope:
          $ref: "#/components/schemas/CompactJws"
          description: |
            Sobre firmado por el dispositivo con ES256. Su encabezado lleva en
            `kid` el identificador del dispositivo y su carga es un
            `AttendanceEventPayload`.
          contentMediaType: application/jose
          contentSchema:
            $ref: "#/components/schemas/AttendanceEventPayload"
    AttendanceBatchSubmission:
      type: object
      additionalProperties: false
      required: [envelopes]
      properties:
        envelopes:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: "#/components/schemas/CompactJws"
    AttendanceEventPayload:
      type: object
      description: |
        Carga del sobre firmado. No viaja como JSON suelto: va dentro del JWS,
        de modo que el servidor conserva la evidencia tal como la firmó el
        dispositivo y puede volver a verificarla.
      additionalProperties: false
      required: [envelopeVersion, idempotencyKey, sessionId, sequence, observedAt, timeZone, card, location, app]
      properties:
        envelopeVersion:
          type: integer
          const: 1
        idempotencyKey:
          type: string
          format: uuid
          description: Igual al encabezado `Idempotency-Key` cuando se envía un solo marcaje.
        sessionId:
          type: string
          format: uuid
        sequence:
          type: integer
          minimum: 1
          description: Consecutivo dentro de la sesión.
        observedAt:
          type: string
          format: date-time
          description: Hora del dispositivo al leer la tarjeta.
        timeZone:
          type: string
          description: Zona IANA del dispositivo.
        elapsedRealtimeMs:
          type: integer
          description: Reloj monotónico del dispositivo, para detectar cambios de hora.
        declaredType:
          $ref: "#/components/schemas/EventType"
          description: Lo que la persona dijo estar marcando, si la app lo pregunta. El servidor decide el tipo final.
        card:
          type: object
          additionalProperties: false
          required: [scheme, proof]
          properties:
            scheme:
              type: string
              enum: [desfire_ev3_aes, uid_sha256]
              description: |
                `uid_sha256` es la señal no autenticada del prototipo y nunca
                basta para aceptar un marcaje con datos reales.
                El servidor sólo la acepta en un ambiente que la enciende a
                propósito, con datos ficticios; ahí `proof` es la huella con
                la que se registró la tarjeta. `desfire_ev3_aes` todavía no
                se verifica: se rechaza con `card_unknown`.
            proof:
              type: string
              description: Resultado de la autenticación de la tarjeta, en base64url.
            keyVersion:
              type: integer
        location:
          oneOf:
            - type: object
              additionalProperties: false
              required: [latitude, longitude, accuracyMeters, capturedAt]
              properties:
                latitude:
                  type: number
                longitude:
                  type: number
                accuracyMeters:
                  type: number
                capturedAt:
                  type: string
                  format: date-time
                provider:
                  type: string
                mock:
                  type: [boolean, "null"]
            - type: "null"
          description: Muestra tomada al marcar. Nula si no se pudo obtener.
        locationUnavailableReason:
          type: string
          enum: [permission_denied, disabled, timeout]
        integrityToken:
          type: string
        app:
          type: object
          additionalProperties: false
          required: [version]
          properties:
            version:
              type: string
    AttendanceReceipt:
      type: object
      required:
        - eventId
        - idempotencyKey
        - outcome
        - type
        - observedAt
        - receivedAt
        - employee
        - site
        - locationVerdict
        - incident
        - rejection
      properties:
        eventId:
          type: [string, "null"]
          format: uuid
          description: Nulo cuando el marcaje se rechaza y no se crea.
        idempotencyKey:
          type: string
          format: uuid
        outcome:
          type: string
          enum: [accepted, accepted_with_incident, rejected]
        type:
          oneOf:
            - $ref: "#/components/schemas/EventType"
            - type: "null"
        observedAt:
          type: string
          format: date-time
        receivedAt:
          type: string
          format: date-time
        employee:
          oneOf:
            - type: object
              required: [displayName]
              properties:
                displayName:
                  type: string
            - type: "null"
          description: Para que una terminal muestre a quién registró.
        site:
          oneOf:
            - $ref: "#/components/schemas/SiteSummary"
            - type: "null"
        locationVerdict:
          $ref: "#/components/schemas/LocationVerdict"
        incident:
          oneOf:
            - type: object
              required: [id, type]
              properties:
                id:
                  type: string
                  format: uuid
                type:
                  $ref: "#/components/schemas/IncidentType"
            - type: "null"
        rejection:
          oneOf:
            - type: object
              required: [code, message]
              properties:
                code:
                  type: string
                  enum:
                    - card_unknown
                    - card_revoked
                    - card_not_owner
                    - signature_invalid
                    - session_invalid
                    - payload_invalid
                    - too_old
                message:
                  type: string
            - type: "null"
    AttendanceBatchResult:
      type: object
      required: [receipts]
      properties:
        receipts:
          type: array
          items:
            $ref: "#/components/schemas/AttendanceReceipt"
    AttendanceEvent:
      type: object
      required:
        - id
        - employeeId
        - siteId
        - deviceId
        - deviceMode
        - type
        - outcome
        - observedAt
        - receivedAt
        - delaySeconds
        - locationVerdict
        - accuracyMeters
        - incidentIds
        - payloadHash
      properties:
        id:
          type: string
          format: uuid
        employeeId:
          type: string
          format: uuid
        siteId:
          type: [string, "null"]
          format: uuid
        deviceId:
          type: string
          format: uuid
        deviceMode:
          $ref: "#/components/schemas/DeviceMode"
        type:
          $ref: "#/components/schemas/EventType"
        outcome:
          type: string
          enum: [accepted, accepted_with_incident]
        observedAt:
          type: string
          format: date-time
        receivedAt:
          type: string
          format: date-time
        delaySeconds:
          type: integer
          description: Diferencia entre la hora observada y la de recepción.
        locationVerdict:
          $ref: "#/components/schemas/LocationVerdict"
        accuracyMeters:
          type: [number, "null"]
        incidentIds:
          type: array
          items:
            type: string
            format: uuid
        payloadHash:
          $ref: "#/components/schemas/Sha256Hex"
    AttendanceEventList:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AttendanceEvent"
        nextCursor:
          $ref: "#/components/schemas/NextCursor"

    RuleSetRef:
      type: object
      required: [id, version]
      properties:
        id:
          type: string
          format: uuid
        version:
          type: integer
    WeekTotals:
      type: object
      required: [workedMinutes, breakMinutes, ordinaryMinutes, overtimeMinutes]
      properties:
        workedMinutes:
          type: integer
        breakMinutes:
          type: integer
        ordinaryMinutes:
          type: integer
        overtimeMinutes:
          type: integer
    WorkSegment:
      type: object
      required: [id, kind, startAt, endAt, minutes, startEventId, endEventId, version]
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [work, break]
        startAt:
          type: string
          format: date-time
        endAt:
          type: [string, "null"]
          format: date-time
          description: Nulo mientras falte el marcaje que lo cierra.
        minutes:
          type: integer
          description: Cero mientras el tramo esté abierto.
        startEventId:
          type: string
          format: uuid
          description: >-
            Marcaje que abre el tramo. Si lo agregó un ajuste, es el
            identificador de ese ajuste y no existe en la lista de marcajes.
        endEventId:
          type: [string, "null"]
          format: uuid
          description: Marcaje que lo cierra, con la misma salvedad.
        version:
          type: integer
          description: Uno más el número de ajustes aplicados a la semana.
    AttendanceAlert:
      type: object
      required: [code, severity, message]
      properties:
        code:
          type: string
          description: >-
            `open_segment`, `daily_combined_limit_exceeded`, `weekly_overtime`
            o `weekly_overtime_limit_exceeded`. Pueden agregarse más: un
            cliente debe tolerar un código que no conoce.
        severity:
          type: string
          enum: [info, warning, critical]
        message:
          type: string
    WeekAttendance:
      type: object
      required: [employeeId, weekStart, timeZone, ruleSet, segments, totals, alerts, openIncidentIds, closure]
      properties:
        employeeId:
          type: string
          format: uuid
        weekStart:
          type: string
          format: date
        timeZone:
          type: string
        ruleSet:
          $ref: "#/components/schemas/RuleSetRef"
        segments:
          type: array
          items:
            $ref: "#/components/schemas/WorkSegment"
        totals:
          $ref: "#/components/schemas/WeekTotals"
        alerts:
          type: array
          items:
            $ref: "#/components/schemas/AttendanceAlert"
        openIncidentIds:
          type: array
          items:
            type: string
            format: uuid
        acknowledgement:
          description: Acuse del cierre vigente, incluso si se emitió desde otro dispositivo. Nulo si no existe o el cierre está reabierto.
          oneOf:
            - $ref: "#/components/schemas/Acknowledgement"
            - type: "null"
        closure:
          oneOf:
            - type: object
              required: [id, version, status]
              properties:
                id:
                  type: string
                  format: uuid
                version:
                  type: integer
                status:
                  $ref: "#/components/schemas/WeekClosureStatus"
            - type: "null"

    IncidentType:
      type: string
      enum:
        - duplicate
        - missing_pair
        - outside_window
        - location_inconclusive
        - clock_anomaly
        - foreign_site
        - late_sync
    IncidentStatus:
      type: string
      enum: [open, resolved]
    Adjustment:
      type: object
      additionalProperties: false
      required: [kind]
      description: Intención de corrección. No reemplaza el marcaje original.
      properties:
        kind:
          type: string
          enum: [add_event, exclude_event, retype_event]
        eventId:
          type: string
          format: uuid
          description: Marcaje afectado, en `exclude_event` y `retype_event`.
        eventType:
          $ref: "#/components/schemas/EventType"
        occurredAt:
          type: string
          format: date-time
          description: Hora del marcaje que se agrega, en `add_event`.
    IncidentResolutionInput:
      type: object
      additionalProperties: false
      required: [decision, reason]
      properties:
        decision:
          type: string
          enum: [justified, confirmed, adjusted]
        reason:
          type: string
          minLength: 10
          maxLength: 500
        adjustment:
          $ref: "#/components/schemas/Adjustment"
    IncidentResolution:
      type: object
      required: [decision, reason, adjustment, resolvedBy, resolvedAt]
      properties:
        decision:
          type: string
          enum: [justified, confirmed, adjusted]
        reason:
          type: string
        adjustment:
          oneOf:
            - $ref: "#/components/schemas/Adjustment"
            - type: "null"
        resolvedBy:
          type: string
          format: uuid
        resolvedAt:
          type: string
          format: date-time
    IncidentUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        assigneeUserId:
          type: [string, "null"]
          format: uuid
        resolution:
          $ref: "#/components/schemas/IncidentResolutionInput"
    Incident:
      type: object
      required:
        - id
        - type
        - severity
        - status
        - employeeId
        - siteId
        - eventIds
        - openedAt
        - assigneeUserId
        - resolution
      properties:
        id:
          type: string
          format: uuid
        type:
          $ref: "#/components/schemas/IncidentType"
        severity:
          type: string
          enum: [low, medium, high]
        status:
          $ref: "#/components/schemas/IncidentStatus"
        employeeId:
          type: [string, "null"]
          format: uuid
        siteId:
          type: [string, "null"]
          format: uuid
        eventIds:
          type: array
          items:
            type: string
            format: uuid
        openedAt:
          type: string
          format: date-time
        assigneeUserId:
          type: [string, "null"]
          format: uuid
        resolution:
          oneOf:
            - $ref: "#/components/schemas/IncidentResolution"
            - type: "null"
    IncidentList:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Incident"
        nextCursor:
          $ref: "#/components/schemas/NextCursor"

    WeekClosureStatus:
      type: string
      enum: [closed, reopened]
    WeekClosure:
      type: object
      required:
        - id
        - employeeId
        - weekStart
        - version
        - status
        - ruleSet
        - totals
        - hash
        - closedAt
        - closedBy
        - acknowledgement
      properties:
        id:
          type: string
          format: uuid
        employeeId:
          type: string
          format: uuid
        weekStart:
          type: string
          format: date
        version:
          type: integer
        status:
          $ref: "#/components/schemas/WeekClosureStatus"
        ruleSet:
          $ref: "#/components/schemas/RuleSetRef"
        totals:
          $ref: "#/components/schemas/WeekTotals"
        hash:
          $ref: "#/components/schemas/Sha256Hex"
        closedAt:
          type: string
          format: date-time
        closedBy:
          type: [string, "null"]
          format: uuid
          description: Quien lo cerró; nulo si lo cerró el cierre programado.
        acknowledgement:
          oneOf:
            - $ref: "#/components/schemas/Acknowledgement"
            - type: "null"
    WeekClosureCreate:
      type: object
      additionalProperties: false
      required: [weekStart]
      properties:
        weekStart:
          type: string
          format: date
        siteId:
          type: string
          format: uuid
          description: Limita el cierre a una sede.
        employeeIds:
          type: array
          maxItems: 500
          items:
            type: string
            format: uuid
    WeekClosureResult:
      type: object
      required: [weekStart, closed, blocked]
      properties:
        weekStart:
          type: string
          format: date
        closed:
          type: array
          items:
            $ref: "#/components/schemas/WeekClosure"
        blocked:
          type: array
          items:
            $ref: "#/components/schemas/BlockedClosure"
    BlockedClosure:
      type: object
      description: Persona que no se pudo cerrar y por qué.
      required: [employeeId, reason, incidentIds]
      properties:
        employeeId:
          type: string
          format: uuid
        reason:
          type: string
          enum: [open_incidents, open_segment]
        incidentIds:
          type: array
          description: >-
            Con `open_incidents`, las incidencias abiertas de esa semana. Con
            `open_segment`, la que se acaba de abrir sobre el tramo sin
            cerrar; vacía si el tramo lo inició un ajuste.
          items:
            type: string
            format: uuid
    BlockedClosureList:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/BlockedClosure"
        nextCursor:
          $ref: "#/components/schemas/NextCursor"
    WeekClosureList:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/WeekClosure"
        nextCursor:
          $ref: "#/components/schemas/NextCursor"
    WeekClosureRunCreate:
      type: object
      additionalProperties: false
      required: [weekStart]
      properties:
        weekStart:
          type: string
          format: date
        siteId:
          type: string
          format: uuid
          description: Limita la corrida a una sede.
    WeekClosureRun:
      type: object
      required:
        - id
        - weekStart
        - siteId
        - origin
        - status
        - total
        - closed
        - blocked
        - requestedBy
        - failure
        - createdAt
        - startedAt
        - finishedAt
      properties:
        id:
          type: string
          format: uuid
        weekStart:
          type: string
          format: date
        siteId:
          type: [string, "null"]
          format: uuid
        origin:
          type: string
          enum: [requested, scheduled]
          description: >-
            `requested` si la pidió una persona; `scheduled` si la abrió el
            cierre programado.
        status:
          type: string
          enum: [queued, running, done, failed]
        total:
          type: [integer, "null"]
          description: Personas que entran a la corrida; nulo hasta que empieza.
        closed:
          type: integer
          description: Personas que quedaron con un cierre vigente, incluidas las que ya lo tenían.
        blocked:
          type: object
          description: Personas que no se cerraron, por motivo.
          required: [openIncidents, openSegment]
          properties:
            openIncidents:
              type: integer
            openSegment:
              type: integer
        requestedBy:
          type: [string, "null"]
          format: uuid
          description: Quien la pidió; nulo si la abrió el cierre programado.
        failure:
          type: [string, "null"]
          description: Por qué no terminó; nulo si no falló.
        createdAt:
          type: string
          format: date-time
        startedAt:
          type: [string, "null"]
          format: date-time
        finishedAt:
          type: [string, "null"]
          format: date-time
    WeekClosureRunList:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/WeekClosureRun"
        nextCursor:
          $ref: "#/components/schemas/NextCursor"
    WeekClosureReopen:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 10
          maxLength: 500
    AcknowledgementCreate:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          type: string
          enum: [agreed, objected]
        note:
          type: string
          maxLength: 500
    Acknowledgement:
      type: object
      required: [id, closureId, type, note, at, evidenceHash]
      properties:
        id:
          type: string
          format: uuid
        closureId:
          type: string
          format: uuid
        type:
          type: string
          enum: [agreed, objected]
        note:
          type: [string, "null"]
        at:
          type: string
          format: date-time
        evidenceHash:
          $ref: "#/components/schemas/Sha256Hex"

    RuleSet:
      type: object
      required: [id, jurisdiction, version, validFrom, validTo, weeklyOrdinaryMaxMinutes, parameters, sources]
      properties:
        id:
          type: string
          format: uuid
        jurisdiction:
          type: string
        version:
          type: integer
        validFrom:
          type: string
          format: date
        validTo:
          type: [string, "null"]
          format: date
        weeklyOrdinaryMaxMinutes:
          type: integer
        parameters:
          type: object
          description: |
            Resto de los topes y bandas de esa vigencia, por nombre. Cada valor
            va como texto; el nombre dice su unidad.
          additionalProperties:
            type: string
        sources:
          type: array
          items:
            type: string
    RuleSetList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/RuleSet"

    ExportCreate:
      type: object
      additionalProperties: false
      required: [weekStart, format]
      properties:
        weekStart:
          type: string
          format: date
        siteId:
          type: string
          format: uuid
        format:
          type: string
          enum: [csv]
    Export:
      type: object
      required:
        - id
        - status
        - weekStart
        - siteId
        - format
        - timeZone
        - ruleSetVersion
        - rowCount
        - manifestHash
        - fileHash
        - downloadUrl
        - expiresAt
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [queued, ready, failed, expired]
          description: >-
            `queued` mientras se prepara, `ready` cuando se puede descargar,
            `expired` cuando ya se descargó o venció, y `failed` cuando no se
            pudo preparar.
        weekStart:
          type: string
          format: date
        siteId:
          type: [string, "null"]
          format: uuid
        format:
          type: string
          enum: [csv]
        timeZone:
          type: string
        ruleSetVersion:
          type: integer
          description: Versión de reglas vigente en esa semana; cada fila del archivo trae la de su cierre.
        rowCount:
          type: [integer, "null"]
          description: Cierres que entraron al archivo; nulo mientras no está preparado.
        manifestHash:
          oneOf:
            - $ref: "#/components/schemas/Sha256Hex"
            - type: "null"
        fileHash:
          oneOf:
            - $ref: "#/components/schemas/Sha256Hex"
            - type: "null"
        downloadUrl:
          type: [string, "null"]
          format: uri-reference
          description: >-
            Ruta de `downloadExport`, relativa al servidor del API. Nula si no
            hay nada que descargar.
        expiresAt:
          type: [string, "null"]
          format: date-time
          description: Hasta cuándo se puede descargar; nulo si no hay nada que descargar.
        createdAt:
          type: string
          format: date-time

    ExportManifest:
      type: object
      description: >-
        Lo que un exporte declara de sí mismo. Se guarda una vez, al preparar
        el archivo, y no cambia.
      required:
        - exportId
        - templateVersion
        - format
        - tenant
        - weekStart
        - timeZone
        - siteId
        - rowCount
        - fileSha256
        - closures
        - generatedAt
      properties:
        exportId:
          type: string
          format: uuid
        templateVersion:
          type: integer
          description: Versión de la plantilla del archivo.
        format:
          type: string
          enum: [csv]
        tenant:
          type: object
          required: [id, slug, name]
          properties:
            id:
              type: string
              format: uuid
            slug:
              type: string
            name:
              type: string
        weekStart:
          type: string
          format: date
        timeZone:
          type: string
        siteId:
          type: [string, "null"]
          format: uuid
        rowCount:
          type: integer
        fileSha256:
          $ref: "#/components/schemas/Sha256Hex"
          description: SHA-256 del archivo, byte por byte; el mismo valor que `fileHash` del exporte.
        closures:
          type: array
          description: Un elemento por fila del archivo, en el mismo orden.
          items:
            type: object
            required: [closureId, employeeId, version, ruleSetVersion, hash]
            properties:
              closureId:
                type: string
                format: uuid
              employeeId:
                type: string
                format: uuid
              version:
                type: integer
              ruleSetVersion:
                type: integer
              hash:
                $ref: "#/components/schemas/Sha256Hex"
        generatedAt:
          type: string
          format: date-time

    AuditEntry:
      type: object
      required: [id, at, actor, action, target, correlationId, metadata]
      properties:
        id:
          type: string
          format: uuid
        at:
          type: string
          format: date-time
        actor:
          type: object
          required: [type, id]
          properties:
            type:
              type: string
              enum: [user, device, system]
            id:
              type: [string, "null"]
              format: uuid
        action:
          type: string
        target:
          type: object
          required: [type, id]
          properties:
            type:
              type: string
            id:
              type: [string, "null"]
              format: uuid
        correlationId:
          type: string
          format: uuid
        metadata:
          type: object
          description: Datos de contexto como texto, sin secretos ni cargas completas.
          additionalProperties:
            type: string
    AuditEntryList:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AuditEntry"
        nextCursor:
          $ref: "#/components/schemas/NextCursor"

    IntegrationCheckpoint:
      type: object
      required: [sourceId, type, status, cursor, sourceVersion, updatedAt]
      properties:
        sourceId:
          type: string
          format: uuid
        type:
          type: string
          enum: [csv, api, connector]
        status:
          type: string
          enum: [active, paused, error]
        cursor:
          type: [string, "null"]
        sourceVersion:
          type: [string, "null"]
        updatedAt:
          type: string
          format: date-time
    IntegrationCheckpointList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/IntegrationCheckpoint"
