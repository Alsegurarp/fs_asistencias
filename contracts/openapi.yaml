                status: 409
                code: export_not_ready
                detail: El exporte todavía se está preparando.
                correlationId: 0b1c2d3e-4f5a-4b6c-8d7e-9f0a1b2c3d4e
        "410":
          description: El exporte no se pudo preparar
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                type: https://zenit.invalid/problems/gone
                title: Ya no está disponible
                status: 410
                code: export_failed
                detail: El exporte no se pudo preparar; hay que pedirlo otra vez.
                correlationId: 0b1c2d3e-4f5a-4b6c-8d7e-9f0a1b2c3d4e

  /audit-log:
    get:
      tags: [auditoria]
      operationId: listAuditEntries
      summary: Lista las acciones registradas en la bitácora
      x-roles: [admin_empresa, auditor]
      parameters:
        - name: action
          in: query
          schema:
            type: string
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Página de la bitácora
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEntryList"
              example:
                items:
                  - id: 2e4a6c8e-0a2c-4e6a-8c0e-2a4c6e8a0c2e
                    at: "2026-10-12T16:00:00Z"
                    actor:
                      type: user
                      id: a3c5e7b9-1d3f-4b5a-9c7e-1b3d5f7a9c1e
                    action: week_closure.created
                    target:
                      type: week_closure
                      id: 0a2c4e6b-8d0f-4a2c-9e4b-6d8f0a2c4e6d
                    correlationId: 0b1c2d3e-4f5a-4b6c-8d7e-9f0a1b2c3d4e
                    metadata: {}
                nextCursor: null
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /integrations/checkpoints:
    get:
      tags: [integraciones]
      operationId: listIntegrationCheckpoints
      summary: Lista las fuentes del padrón y su último punto de sincronización
      description: |
        De dónde viene el padrón de la empresa. Hoy la única fuente que existe
        es la carga por archivo: aparece cuando se aplica la primera, con
        `cursor` igual al identificador de la última carga aplicada y
        `sourceVersion` igual a la plantilla del archivo. Validar un archivo
        sin aplicarlo no la mueve. Una empresa que captura su padrón a mano
        no tiene fuentes. Los tipos `api` y `connector` quedan reservados
        para cuando exista la sincronización.
      x-roles: [admin_empresa, rh]
      responses:
        "200":
          description: Fuentes del padrón
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntegrationCheckpointList"
              example:
                items:
                  - sourceId: 8c0e2a4c-6e8a-4c0e-8a2c-4e6a8c0e2a4c
                    type: csv
                    status: active
                    cursor: 3f5a7c9e-1b3d-4f5a-8c7e-9b1d3f5a7c9e
                    sourceVersion: "1"
                    updatedAt: "2026-10-05T15:41:00Z"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

components:
  securitySchemes:
    userToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Token de acceso de una persona, emitido por el proveedor de identidad.
        La API deriva de él la empresa y los roles.
    deviceToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Aserción firmada por el propio dispositivo con su clave privada, ES256.
        `iss` y `sub` llevan el identificador del dispositivo, `aud` el valor
        de `audience` recibido al activar, y vive como máximo
        `tokenMaxAgeSeconds`. El servidor la verifica con la clave pública
        registrada al activar y deriva de ella empresa, dispositivo y
        modalidad.

  parameters:
    DossierId:
      name: dossierId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Cursor:
      name: cursor
      in: query
      description: Valor de `nextCursor` de la página anterior.
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Week:
      name: week
      in: query
      required: true
      description: Cualquier fecha de la semana. El servidor la ajusta al inicio de semana de la empresa.
      schema:
        type: string
        format: date
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: La misma clave nunca crea dos resultados.
      schema:
        type: string
        format: uuid
    TenantId:
      name: tenantId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SiteId:
      name: siteId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ScheduleId:
      name: scheduleId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    EmployeeId:
      name: employeeId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ImportId:
      name: importId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CardId:
      name: cardId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DeviceId:
      name: deviceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IncidentId:
      name: incidentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ClosureId:
      name: closureId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ExportId:
      name: exportId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RunId:
      name: runId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    Unauthorized:
      description: Falta la credencial o no es válida
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://zenit.invalid/problems/unauthorized
            title: Credencial no válida
            status: 401
            code: unauthorized
            correlationId: 0b1c2d3e-4f5a-4b6c-8d7e-9f0a1b2c3d4e
            serverTime: "2026-10-05T13:00:01Z"
    Forbidden:
      description: La credencial es válida, pero el rol no alcanza
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://zenit.invalid/problems/forbidden
            title: Permiso insuficiente
            status: 403
            code: forbidden
            correlationId: 0b1c2d3e-4f5a-4b6c-8d7e-9f0a1b2c3d4e
    NotFound:
      description: El recurso no existe en la empresa de quien llama
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://zenit.invalid/problems/not-found
            title: No encontrado
            status: 404
            code: not_found
            correlationId: 0b1c2d3e-4f5a-4b6c-8d7e-9f0a1b2c3d4e
    Conflict:
      description: El estado actual no permite la operación
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://zenit.invalid/problems/conflict
            title: Conflicto con el estado actual
            status: 409
            code: idempotency_conflict
            detail: La clave de idempotencia ya se usó con otro contenido.
            correlationId: 0b1c2d3e-4f5a-4b6c-8d7e-9f0a1b2c3d4e
    Unprocessable:
      description: La petición no cumple las reglas de validación
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://zenit.invalid/problems/validation
            title: Datos no válidos
            status: 422
            code: validation
            correlationId: 0b1c2d3e-4f5a-4b6c-8d7e-9f0a1b2c3d4e
            errors:
              - field: radiusMeters
                code: out_of_range
                message: Debe estar entre 20 y 2000.
    TooManyRequests:
      description: Se excedió la cuota de peticiones
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://zenit.invalid/problems/rate-limited
            title: Demasiadas peticiones
            status: 429
            code: rate_limited
            correlationId: 0b1c2d3e-4f5a-4b6c-8d7e-9f0a1b2c3d4e

  schemas:
    DossierPermission:
      type: object
      additionalProperties: false
      required: [enabled]
      properties:
        enabled: { type: boolean }
    DossierCreate:
      type: object
      additionalProperties: false
      required: [formatVersion]
      properties:
        formatVersion: { type: integer, const: 1 }
    Dossier:
      type: object
      additionalProperties: false
      required: [id, tenantId, requestedBy, formatVersion, scope, status, createdAt, expiresAt, snapshotAt, readyAt, manifestSha256, fileSha256, failureCode]
      properties:
        id: { type: string, format: uuid }
        tenantId: { type: string, format: uuid, description: Derivado de la identidad; no se admite en solicitudes. }
        requestedBy: { type: string, format: uuid }
        formatVersion: { type: integer, const: 1 }
        scope: { type: string, const: all_retained }
        status: { type: string, enum: [queued, preparing, ready, failed, expired, downloaded] }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        snapshotAt: { type: [string, 'null'], format: date-time }
        readyAt: { type: [string, 'null'], format: date-time }
        manifestSha256: { type: [string, 'null'], pattern: '^[a-f0-9]{64}$' }
        fileSha256: { type: [string, 'null'], pattern: '^[a-f0-9]{64}$' }
        failureCode: { enum: [null, preparation_failed] }
      allOf:
        - if: { additionalProperties: true, properties: { status: { enum: [ready, downloaded] } } }
          then:
            additionalProperties: true
            properties:
              snapshotAt: { type: string }
              readyAt: { type: string }
              manifestSha256: { type: string }
              fileSha256: { type: string }
        - if: { additionalProperties: true, properties: { status: { const: queued } } }
          then: { additionalProperties: true, properties: { snapshotAt: { type: 'null' } } }
        - if: { additionalProperties: true, properties: { status: { const: preparing } } }
          then: { additionalProperties: true, properties: { snapshotAt: { type: string } } }
        - if: { additionalProperties: true, properties: { status: { enum: [queued, preparing, failed] } } }
          then:
            additionalProperties: true
            properties:
              readyAt: { type: 'null' }
              manifestSha256: { type: 'null' }
              fileSha256: { type: 'null' }
        - if: { additionalProperties: true, properties: { status: { const: failed } } }
          then: { additionalProperties: true, properties: { failureCode: { const: preparation_failed } } }
          else: { additionalProperties: true, properties: { failureCode: { type: 'null' } } }
        - if: { additionalProperties: true, properties: { manifestSha256: { type: string } } }
          then:
            additionalProperties: true
            properties:
              snapshotAt: { type: string }
              readyAt: { type: string }
              fileSha256: { type: string }
          else:
            additionalProperties: true
            properties:
              readyAt: { type: 'null' }
              fileSha256: { type: 'null' }
    SystemStatus:
      type: object
      additionalProperties: false
      required: [service, status, version]
      properties:
        service:
          type: string
        status:
          type: string
          const: ok
        version:
          type: string

    Problem:
      type: object
      description: Detalle de un error según RFC 9457, con miembros propios.
      required: [type, title, status, code, correlationId]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          description: Código estable para que el cliente decida qué hacer.
        correlationId:
          type: string
          format: uuid
        serverTime:
          type: string
          format: date-time
          description: Presente en 401, para que un dispositivo con el reloj movido pueda corregirse.
        errors:
          type: array
          items:
            $ref: "#/components/schemas/FieldError"
    FieldError:
      type: object
      required: [field, code, message]
      properties:
        field:
          type: string
        code:
          type: string
        message:
          type: string

    NextCursor:
      type: [string, "null"]
      description: Cursor de la página siguiente, o nulo si no hay más.

    Role:
      type: string
      enum: [operador_saas, admin_empresa, rh, supervisor, trabajador, auditor, conector]
    DayOfWeek:
      type: string
      enum: [monday, tuesday, wednesday, thursday, friday, saturday, sunday]
    LocalTime:
      type: string
      pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
      description: Hora local de la sede, de 00:00 a 23:59.
    Sha256Hex:
      type: string
      pattern: "^[0-9a-f]{64}$"
    CompactJws:
      type: string
      pattern: "^[A-Za-z0-9_-]+\\.[A-Za-z0-9_-]+\\.[A-Za-z0-9_-]+$"
      description: JWS en serialización compacta (RFC 7515).

    CurrentUser:
      type: object
      required: [userId, displayName, roles, tenant, employeeId]
      properties:
        userId:
          type: string
          format: uuid
          description: >-
            Identificador de la persona en su empresa, el mismo de `/users`.
            Para quien no pertenece a ninguna, el de su cuenta.
        displayName:
          type: string
        roles:
          type: array
          description: >-
            Vacío para una cuenta válida a la que nadie ha invitado o cuyo
            acceso se deshabilitó; en ese caso `tenant` es nulo.
          items:
            $ref: "#/components/schemas/Role"
        tenant:
          oneOf:
            - $ref: "#/components/schemas/TenantSummary"
            - type: "null"
          description: Nulo para quien opera el servicio sin pertenecer a una empresa.
        employeeId:
          type: [string, "null"]
          format: uuid
          description: Presente cuando la persona también está en el padrón.
    BreakPolicy:
      type: string
      enum: [not_considered, marked]
      description: |
        Qué hace la empresa con el descanso o la comida. Con `not_considered`
        no se marca y la jornada es salida menos entrada: sólo hay marcajes de
        entrada y de salida. Con `marked` la persona marca el inicio y el fin
        del descanso y ese tiempo se mide aparte.
    TenantSummary:
      type: object
      required: [id, name, timeZone, weekStartsOn, breakPolicy]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        timeZone:
          type: string
        weekStartsOn:
          $ref: "#/components/schemas/DayOfWeek"
        breakPolicy:
          $ref: "#/components/schemas/BreakPolicy"

    Tenant:
      type: object
      required: [id, name, slug, timeZone, weekStartsOn, breakPolicy, status, createdAt, autoCloseAfterHours]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        timeZone:
          type: string
          description: Zona IANA, por ejemplo America/Mexico_City.
        weekStartsOn:
          $ref: "#/components/schemas/DayOfWeek"
        breakPolicy:
          $ref: "#/components/schemas/BreakPolicy"
        status:
          type: string
          enum: [active, suspended]
        createdAt:
          type: string
          format: date-time
        autoCloseAfterHours:
          type: [integer, "null"]
          minimum: 1
          maximum: 168
          description: >-
            Horas después del fin de la semana a las que el sistema la cierra
            por su cuenta. Nulo: sólo la cierra una persona.
    TenantCreate:
      type: object
      additionalProperties: false
      required: [name, slug, timeZone, weekStartsOn, breakPolicy, firstAdminEmail]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        slug:
          type: string
          pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
          maxLength: 60
        timeZone:
          type: string
        weekStartsOn:
          $ref: "#/components/schemas/DayOfWeek"
        breakPolicy:
          $ref: "#/components/schemas/BreakPolicy"
          description: Se elige al dar de alta la empresa; no tiene valor por defecto.
        firstAdminEmail:
          type: string
          format: email
          maxLength: 254
          description: >-
            Correo de quien administrará la empresa. Queda invitada con el rol
            `admin_empresa`; desde ahí invita al resto.
    TenantUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        timeZone:
          type: string
        weekStartsOn:
          $ref: "#/components/schemas/DayOfWeek"
        breakPolicy:
          $ref: "#/components/schemas/BreakPolicy"
          description: El cambio no reescribe semanas ya cerradas.
        autoCloseAfterHours:
          type: [integer, "null"]
          minimum: 1
          maximum: 168
          description: Nulo apaga el cierre programado.
    TenantStatusChange:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 10
          maxLength: 500
          description: Por qué se suspende o se reactiva; queda en la bitácora de la empresa.
    AdministratorUnlink:
      type: object
      additionalProperties: false
      required: [email, reason]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          description: Correo de quien administra la empresa.
        reason:
          type: string
          minLength: 10
          maxLength: 500
          description: Por qué se suelta la liga; queda en la bitácora de la empresa.
    TenantList:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Tenant"
        nextCursor:
          $ref: "#/components/schemas/NextCursor"

    TenantRole:
      type: string
      description: Roles que una empresa da a su gente.
      enum: [admin_empresa, rh, supervisor, trabajador, auditor]
    User:
      type: object
      description: Persona con acceso al portal de la empresa.
      required: [id, email, displayName, roles, status, createdAt, linkedAt, employeeId]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        displayName:
          type: string
        roles:
          type: array
          items:
            $ref: "#/components/schemas/TenantRole"
        status:
          type: string
          enum: [invited, active, disabled]
          description: >-
            `invited` mientras no entra por primera vez, `active` cuando ya
            está ligada a su cuenta y `disabled` cuando se le quitó el acceso.
        createdAt:
          type: string
          format: date-time
        linkedAt:
          type: [string, "null"]
          format: date-time
          description: Primera entrada con su cuenta; nulo si todavía no entra.
        employeeId:
          type: [string, "null"]
          format: uuid
          description: Su fila del padrón, cuando la persona también es trabajadora.
    UserCreate:
      type: object
      additionalProperties: false
      required: [email, roles]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        displayName:
          type: string
          minLength: 1
          maxLength: 120
        roles:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: "#/components/schemas/TenantRole"
        employeeId:
          type: string
          format: uuid
          description: Fila del padrón con la que se liga la cuenta.
    UserUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 120
        roles:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: "#/components/schemas/TenantRole"
        disabled:
          type: boolean
        employeeId:
          type: [string, "null"]
          format: uuid
          description: Fila del padrón con la que se liga la cuenta; nulo la suelta.
    UserList:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/User"
        nextCursor:
          $ref: "#/components/schemas/NextCursor"

    Site:
      type: object
      required: [id, name, timeZone, latitude, longitude, radiusMeters, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        timeZone:
          type: string
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
        radiusMeters:
          type: integer
          minimum: 20
          maximum: 2000
        status:
          type: string
          enum: [active, inactive]
        createdAt:
          type: string
          format: date-time
    SiteCreate:
      type: object
      additionalProperties: false
      required: [name, timeZone, latitude, longitude, radiusMeters]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        timeZone:
          type: string
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
        radiusMeters:
          type: integer
          minimum: 20
          maximum: 2000
    SiteUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        timeZone:
          type: string
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
        radiusMeters:
          type: integer
          minimum: 20
          maximum: 2000
        status:
          type: string
          enum: [active, inactive]
    SiteList:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Site"
        nextCursor:
          $ref: "#/components/schemas/NextCursor"

    ScheduleDay:
      type: object
      additionalProperties: false
      required: [dayOfWeek, startTime, endTime, breakMinutes]
      properties:
        dayOfWeek:
          $ref: "#/components/schemas/DayOfWeek"
        startTime:
          $ref: "#/components/schemas/LocalTime"
        endTime:
          $ref: "#/components/schemas/LocalTime"
          description: Si es menor que `startTime`, el turno termina al día siguiente.
        breakMinutes:
          type: integer
          minimum: 0
          maximum: 480
          description: |
            Descanso previsto en ese día. Si la empresa marca el descanso, sirve
            para avisar cuando el medido lo excede; si no lo considera, es sólo
            informativo y no se descuenta.
    Schedule:
      type: object
      required: [id, name, timeZone, validFrom, validTo, days, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        timeZone:
          type: string
        validFrom:
          type: string
          format: date
        validTo:
          type: [string, "null"]
          format: date
        days:
          type: array
          items:
            $ref: "#/components/schemas/ScheduleDay"
        createdAt:
          type: string
          format: date-time
    ScheduleCreate:
      type: object
      additionalProperties: false
      required: [name, timeZone, validFrom, days]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        timeZone:
          type: string
        validFrom:
          type: string
          format: date
        validTo:
          type: [string, "null"]
          format: date
        days:
          type: array
          minItems: 1
          maxItems: 7
          items:
            $ref: "#/components/schemas/ScheduleDay"
    ScheduleList:
      type: object
