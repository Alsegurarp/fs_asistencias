                    deviceMode: personal
                    type: clock_in
                    outcome: accepted
                    observedAt: "2026-10-05T13:00:00Z"
                    receivedAt: "2026-10-05T13:00:01Z"
                    delaySeconds: 1
                    locationVerdict: inside
                    accuracyMeters: 12
                    incidentIds: []
                    payloadHash: 6f2c1d0e9b8a7f6e5d4c3b2a1f0e9d8c7b6a5f4e3d2c1b0a9f8e7d6c5b4a3f2e
