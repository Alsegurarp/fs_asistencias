  /incidents:
    get:
      tags: [jornada]
      operationId: listIncidents
      summary: Lista las incidencias
      description: |
        Una incidencia no sanciona a nadie: es algo que una persona autorizada
        revisa. `severity` sale del tipo: `high` para `clock_anomaly`; `low`
        para `duplicate`, `late_sync` y `outside_window`; `medium` para las
        demás.

        Todos los filtros se aplican en el servidor, antes de paginar, con el
        alcance por sede de Supervisión. `blocksClosure` es verdadero cuando la
        incidencia sigue abierta, su semana ya terminó y esa persona no tiene
        esa semana cerrada: mientras siga así, el cierre de esa persona queda
        bloqueado. Una abierta en una semana ya cerrada no bloquea nada; para
        corregirla hay que reabrir la semana.

        `sort` elige el orden: `opened` (predeterminado), de la más antigua a
        la más reciente; `severity`, la más grave primero y, dentro de cada
        severidad, la más antigua; `resolved`, la resuelta más recientemente
        primero, y sólo con `status=resolved`. El cursor vale sólo para el
        orden con el que se pidió: con otro, responde 422 `invalid_cursor`.
        `q` busca por nombre o número de la persona, en el servidor y antes
        de paginar; los conteos de `getIncidentSummary` no lo usan.
      x-roles: [admin_empresa, rh, supervisor, auditor]
      parameters:
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/IncidentStatus"
        - name: type
          in: query
          schema:
            $ref: "#/components/schemas/IncidentType"
        - name: siteId
          in: query
          schema:
            type: string
            format: uuid
        - name: week
          in: query
          description: Cualquier fecha de la semana en la que cayó el marcaje.
          schema:
            type: string
            format: date
        - name: severity
          in: query
          schema:
            type: string
            enum: [low, medium, high]
        - name: assignee
          in: query
          description: >-
            `me`, asignadas a quien llama; `unassigned`, sin asignar;
            `assigned`, asignadas a alguien.
          schema:
            type: string
            enum: [me, unassigned, assigned]
        - name: blocksClosure
          in: query
          schema:
            type: boolean
        - name: sort
          in: query
          schema:
            type: string
            enum: [opened, severity, resolved]
            default: opened
        - $ref: "#/components/parameters/SearchText"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Página de incidencias
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncidentList"
              example:
                items:
                  - id: 6e8a0c2e-4b6d-4f8a-8c0e-2b4d6f8a0c2e
                    type: late_sync
                    severity: low
                    status: open
                    employeeId: 5a7c9e1b-3d5f-4b6a-8c0e-2a4c6e8b0d12
                    employeeName: Ana Torres
                    employeeExternalId: "0187"
                    siteId: 3b1f9a52-6c0d-4e7a-8f21-9d4c5b6a7e80
                    eventIds: [3c5e7a9c-1e3a-4c5e-9a1c-3e5a7c9e1a3c]
                    occurredAt: "2026-10-06T12:50:00Z"
                    openedAt: "2026-10-06T12:55:03Z"
                    assigneeUserId: null
                    assigneeName: null
                    assignedAt: null
                    assignedBy: null
                    assignedByName: null
                    blocksClosure: false
                    resolution: null
                nextCursor: null
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /incidents/summary:
    get:
      tags: [jornada]
      operationId: getIncidentSummary
      summary: Cuenta las incidencias para las pestañas y los filtros
      description: |
        Una sola consulta con el mismo alcance que `listIncidents` y con sus
        filtros de contexto (`type`, `siteId` y `week`); los demás filtros de
        la lista son los que estos conteos acompañan. `open.mine` cuenta las
        asignadas a quien llama. `resolved.thisWeek` cuenta las resueltas
        desde `weekStart`, el inicio de la semana en curso de la empresa.
      x-roles: [admin_empresa, rh, supervisor, auditor]
      parameters:
        - name: type
          in: query
          schema:
            $ref: "#/components/schemas/IncidentType"
        - name: siteId
          in: query
          schema:
            type: string
            format: uuid
        - name: week
          in: query
          description: Cualquier fecha de la semana en la que cayó el marcaje.
          schema:
            type: string
            format: date
