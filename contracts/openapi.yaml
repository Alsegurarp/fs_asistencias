                openedAt: "2026-10-06T12:55:03Z"
                assigneeUserId: null
                assigneeName: null
                assignedAt: null
                assignedBy: null
                assignedByName: null
                blocksClosure: false
                resolution:
                  decision: justified
                  reason: El teléfono estuvo sin señal durante el turno.
                  adjustment: null
                  resolvedBy: a3c5e7b9-1d3f-4b5a-9c7e-1b3d5f7a9c1e
                  resolvedByName: Rocío Navarro
                  resolvedAt: "2026-10-06T17:00:00Z"
