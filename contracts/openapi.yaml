openapi: 3.1.0
info:
  title: Zenit API
  version: 0.36.0
  description: |
    Contrato del MVP de Zenit. Es la frontera entre el backend y sus canales:
    el portal web y la app Android. Describe el recorrido completo y el backend
    atiende todas sus operaciones. Dos cosas no existen todavía detrás de
    ellas: la verificación de la tarjeta DESFire, y otra fuente del padrón que
    no sea la carga por archivo. Las tarjetas MIFARE Classic del piloto
    (`mifare_classic_signed`) se verifican por su firma, pero se pueden
    clonar: son un riesgo aceptado hasta usar DESFire.

    Convenciones:

    - Identificadores UUID. Instantes en RFC 3339 y UTC; fechas locales como
      `date`; duraciones en minutos.
    - La empresa se deriva de la credencial, nunca del cuerpo ni de la ruta.
      Un recurso de otra empresa responde 404. La única excepción son las
      operaciones de quien opera el servicio, que no pertenece a ninguna.
    - Errores en `application/problem+json` (RFC 9457) con `code` estable y
      `correlationId`.
    - Listas paginadas por cursor: `cursor` y `limit` en la consulta,
      `nextCursor` en la respuesta. Un cursor, un límite o un filtro
      inválidos responden 422, aunque la operación no lo liste.
    - Toda operación con `x-roles` responde 403 a quien no tiene uno de esos
      roles, aunque la operación no lo liste.
    - Una persona que excede su cuota de peticiones por minuto recibe 429
      en cualquier operación, aunque la operación no lo liste.
    - Los nombres de rol son los del producto: `operador_saas`,
      `admin_empresa`, `rh`, `supervisor`, `trabajador`, `auditor` y
      `conector`. Cada operación declara los suyos en `x-roles`.
    - Los valores enumerados y los códigos van en minúsculas con guion bajo,
      para que los clientes generados obtengan nombres limpios.
    - Todos los ejemplos son ficticios.

    Personas y cuentas: una persona pertenece a una sola empresa. Aquí se le
    invita por correo y se le dan roles; su cuenta, contraseña y segundo
    factor viven en el proveedor de identidad. La primera vez que entra con
    ese correo verificado queda ligada a su invitación.

    Jornada: la semana de una persona se calcula de sus marcajes cada vez que
    se pide; no se guarda hasta que se cierra.

    - Los marcajes se leen en el orden en que ocurrieron y su tipo se vuelve a
      deducir con la regla de captura, así que el tipo que muestra un tramo
      puede diferir del que el marcaje recibió al llegar, si llegó en
      desorden. El marcaje guardado no cambia.
    - Un turno pertenece al día y a la semana en que empieza, aunque termine
      después.
    - Se aplican las reglas laborales vigentes en el último día de la semana.
    - Un tramo sin el marcaje que lo cierra queda abierto y no suma.
    - Un ajuste no edita un marcaje: agrega una intención, con autor y motivo,
      que el cálculo aplica. Cada ajuste sube la `version` de los tramos.
    - Cerrar congela el cálculo de cada persona. Una semana cerrada se entrega
      tal como se congeló y no admite ajustes hasta que se reabre. Reabrir
      conserva la versión cerrada; volver a cerrar crea otra.
    - Los topes y sus alertas informan; no bloquean ni sancionan. La lectura
      de la ley de la que salen está sujeta a revisión jurídica.

    Fuera de esta versión: alta de cuentas en el proveedor de identidad;
    entrega del material de clave de las tarjetas al dispositivo, que depende
    de la prueba con tarjetas reales; y la sincronización por conector.
servers:
  - url: /api/v1
tags:
  - name: expediente
    description: Permiso explícito y preparación del expediente empresarial; descarga pendiente de MFA E4.
  - name: sistema
    description: Estado del servicio.
  - name: identidad
    description: Quién llama, con qué permisos, y quién tiene acceso a la empresa.
  - name: empresa
    description: Empresa, sedes con su geocerca y horarios.
  - name: personas
    description: Padrón de personas, asignación de horario e importación.
  - name: credenciales
    description: Tarjetas, enrolamiento y dispositivos.
  - name: captura
    description: Operaciones que usa la app para marcar.
  - name: jornada
    description: Marcajes, jornada calculada, incidencias, cierres y reglas.
  - name: exportes
    description: Exportación de cierres.
  - name: auditoria
    description: Bitácora de acciones administrativas.
  - name: integraciones
    description: Estado de las fuentes del padrón.
security:
  - userToken: []
paths:
  /dossiers/{dossierId}/challenges:
    parameters:
      - $ref: '#/components/parameters/DossierId'
    post:
      tags: [expediente]
      operationId: createDossierChallenge
      summary: Inicia una verificación nueva ligada al expediente listo
      description: |
        El portal genera PKCE; el servidor fija cliente/redirect_uri, state,
        nonce y nivel requerido, y los correlaciona con expediente/usuario/empresa.
        authorizationUrl apunta únicamente al emisor configurado. El portal
        conserva state y verifica la vuelta antes de enviar el código al servidor.
        Requiere OTP nuevo incluso con SSO; nunca acepta prompt=none.
        Un desafío nuevo invalida el anterior no consumido del mismo expediente.
        expiresAt = mínimo de ahora + 300 segundos y caducidad del expediente.
        El servidor comprueba que nonce/state sean criptográficamente aleatorios.
      x-roles: [admin_empresa, rh, supervisor, trabajador, auditor]
      x-permissions: [dossier_download]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChallengeCreate' }
            example: { codeChallenge: DwBzhbb51LfusnSGBa_hqYSgo7-j8BTQnip4TOnlzRo }
      responses:
        '201':
          description: Desafío creado; ninguna autorización de descarga todavía
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Challenge' }
              example:
                id: c1c3a5b7-9d2f-4b4a-8c6e-0d2f4a6c8e0a
                authorizationUrl: https://identity.example.invalid/realms/zenit/protocol/openid-connect/auth?client_id=zenit-dossier&redirect_uri=https%3A%2F%2Fportal.example.invalid%2Fdossier%2Fcallback&response_type=code&scope=openid&code_challenge_method=S256&code_challenge=DwBzhbb51LfusnSGBa_hqYSgo7-j8BTQnip4TOnlzRo&state=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA&nonce=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA&acr_values=2
                state: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
                expiresAt: '2026-10-26T12:05:00Z'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/DossierNotReady' }
        '410': { $ref: '#/components/responses/DossierGone' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /dossiers/{dossierId}/authorizations:
    parameters:
      - $ref: '#/components/parameters/DossierId'
    post:
      tags: [expediente]
      operationId: authorizeDossierDownload
      summary: Canjea una verificación OIDC nueva por una autorización de descarga
      description: |
        El servidor canjea el código con PKCE y redirect_uri/cliente fijados,
        valida firma, emisor, audiencia, sujeto, vigencia, nonce, state y nivel
        2 con OTP nuevo del flujo configurado. No acepta JWT, OTP ni tokens
        renovados enviados como prueba. Revalida cuenta, vínculo y permiso.
        Desafío/expediente/solicitante/empresa deben coincidir; consume desafío
        y emite una autorización de un uso en una transición atómica.
        Caduca al mínimo de ahora + 60 segundos y expiresAt del expediente.
        Código incorrecto no crea autorización; error de red al canjear no
        reutiliza el código: iniciar otro desafío. Respuesta perdida exige
        otro desafío, que invalida autorizaciones anteriores no consumidas.
      x-roles: [admin_empresa, rh, supervisor, trabajador, auditor]
      x-permissions: [dossier_download]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuthorizationCreate' }
            example:
              challengeId: c1c3a5b7-9d2f-4b4a-8c6e-0d2f4a6c8e0a
              code: codigo-ficticio-sin-valor
              codeVerifier: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
              state: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
      responses:
        '201':
          description: Autorización opaca; sólo se devuelve en esta respuesta
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DownloadAuthorization' }
              example: { authorization: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA, expiresAt: '2026-10-26T12:01:00Z' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/DossierVerificationFailed' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/DossierNotReady' }
        '410': { $ref: '#/components/responses/DossierGone' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '503':
          description: Identidad no disponible; no se autoriza la descarga y se inicia otro desafío al recuperarse
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example: { type: 'https://zenit.invalid/problems/unavailable', title: Identidad no disponible, status: 503, code: identity_unavailable, correlationId: 0b1c2d3e-4f5a-4b6c-8d7e-9f0a1b2c3d4e }
  /dossiers/{dossierId}/download:
    parameters:
      - $ref: '#/components/parameters/DossierId'
    post:
      tags: [expediente]
      operationId: downloadDossier
      summary: Consume una autorización y entrega una sola vez el ZIP del expediente
      description: |
        Bearer normal y autorización en JSON, nunca en query/URL. Revalida usuario,
        empresa y permiso. Bloquea/consume autorización y cambia ready a downloaded
        atómicamente antes de transmitir; dos peticiones concurrentes no obtienen
        dos entregas. Una interrupción puede dejar la entrega incompleta aunque
        esté consumida: no hay Range/resume ni reintento con el mismo token.
        Solicitar otro expediente con nueva clave y pasar MFA otra vez.
        Descargado/caducado, el archivo queda inaccesible; limpiar temporales al
        terminar la transmisión y reintentar limpieza si falla. Hashes/manifiesto
        permanecen. Content-Disposition usa sólo el UUID, sin nombres personales.
      x-roles: [admin_empresa, rh, supervisor, trabajador, auditor]
      x-permissions: [dossier_download]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DownloadRequest' }
            example: { authorization: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA }
      responses:
        '200':
          description: ZIP formato 1; huella de bytes igual a fileSha256
          headers:
            Content-Disposition:
              schema: { type: string }
              example: attachment; filename="expediente-e1c3a5b7-9d2f-4b4a-8c6e-0d2f4a6c8e0a.zip"
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/zip:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/DossierVerificationFailed' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/DossierNotReady' }
        '410': { $ref: '#/components/responses/DossierGone' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /me/dossier-permission:
    get:
      tags: [expediente]
      operationId: getMyDossierPermission
      summary: Consulta el permiso explícito propio
      x-roles: [admin_empresa, rh, supervisor, trabajador, auditor]
      responses:
        '200':
          description: Permiso explícito; false no se convierte en true por el rol
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DossierPermission' }
              example: { enabled: false }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /users/{userId}/dossier-permission:
    parameters:
      - $ref: '#/components/parameters/UserId'
    put:
      tags: [expediente]
      operationId: setDossierPermission
      summary: Concede o revoca explícitamente el permiso de un usuario de la empresa
      description: |
        Acción auditada de administración, incluida una asignación a sí misma.
        Conceder exige usuario activo y vinculado; revocar también se permite a
        usuarios deshabilitados o desvinculados. No elimina evidencia ni revoca
        otros roles. Idempotente: repetir el mismo estado no crea otra concesión.
        Los recursos ya preparados dejan de estar disponibles al revocar; volver
        a conceder no reactiva desafíos/autorizaciones anteriores.
      x-roles: [admin_empresa]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DossierPermission' }
            example: { enabled: true }
      responses:
        '200':
          description: Estado explícito guardado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DossierPermission' }
              example: { enabled: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: user_not_linked o user_not_active al intentar conceder
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example: { type: 'https://zenit.invalid/problems/conflict', title: Usuario sin vínculo, status: 409, code: user_not_linked, correlationId: 0b1c2d3e-4f5a-4b6c-8d7e-9f0a1b2c3d4e }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /dossiers:
    get:
      tags: [expediente]
      operationId: listDossiers
      summary: Lista los expedientes propios de quien llama
      description: |
        Del más reciente al más antiguo y sólo los que pidió la cuenta que
        llama, con el permiso vigente: los de otra persona, o de una liga
        anterior de la misma, no existen para ella, igual que en
        `getDossier`. Quién más pidió o descargó una copia está en la
        bitácora, para Administración y Auditoría.
      x-roles: [admin_empresa, rh, supervisor, trabajador, auditor]
      x-permissions: [dossier_download]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Página de expedientes propios
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DossierList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Unprocessable"
    post:
      tags: [expediente]
      operationId: createDossier
      summary: Prepara una instantánea íntegra de la empresa para el solicitante
      description: |
        Todo el histórico conservado, sin filtros de fecha, persona o sede.
        Idempotencia por empresa/usuario/clave: mismo cuerpo devuelve el mismo
        expediente, incluso fallido, vencido o descargado; cuerpo distinto da
        idempotency_conflict. Una preparación nueva requiere otra clave.
        El corte snapshotAt se fija al abrir la instantánea coherente de datos,
        no al recibir la solicitud. Caduca 24 horas después de createdAt,
        incluyendo el tiempo de cola. El trabajo no amplía ese plazo.
      x-roles: [admin_empresa, rh, supervisor, trabajador, auditor]
      x-permissions: [dossier_download]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DossierCreate' }
            example: { formatVersion: 1 }
      responses:
        '202':
          description: Solicitud registrada o repetida; consultar su estado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Dossier' }
              example:
                id: e1c3a5b7-9d2f-4b4a-8c6e-0d2f4a6c8e0a
                tenantId: 7d0c2b7e-51f4-4a0e-9d5b-2f6a1c3e8b10
                requestedBy: a3c5e7b9-1d3f-4b5a-9c7e-1b3d5f7a9c1e
                formatVersion: 1
                scope: all_retained
                status: queued
                createdAt: '2026-10-26T12:00:00Z'
                expiresAt: '2026-10-27T12:00:00Z'
                snapshotAt: null
                readyAt: null
                manifestSha256: null
                fileSha256: null
                failureCode: null
                downloadedAt: null
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /dossiers/{dossierId}:
    parameters:
      - $ref: '#/components/parameters/DossierId'
    get:
      tags: [expediente]
      operationId: getDossier
      summary: Consulta estado y huellas del expediente propio
      description: |
        No devuelve un enlace con autorización. Las huellas y el manifiesto
        ya generado se conservan al caducar/consumir el archivo. No publicar
        mensajes internos del trabajo como failureCode.
      x-roles: [admin_empresa, rh, supervisor, trabajador, auditor]
      x-permissions: [dossier_download]
      responses:
        '200':
          description: Estado del expediente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Dossier' }
              example:
                id: e1c3a5b7-9d2f-4b4a-8c6e-0d2f4a6c8e0a
                tenantId: 7d0c2b7e-51f4-4a0e-9d5b-2f6a1c3e8b10
                requestedBy: a3c5e7b9-1d3f-4b5a-9c7e-1b3d5f7a9c1e
                formatVersion: 1
                scope: all_retained
                status: ready
                createdAt: '2026-10-26T12:00:00Z'
                expiresAt: '2026-10-27T12:00:00Z'
                snapshotAt: '2026-10-26T12:00:01Z'
                readyAt: '2026-10-26T12:00:03Z'
                manifestSha256: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
                fileSha256: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
                failureCode: null
                downloadedAt: null
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /dossiers/{dossierId}/manifest:
    parameters:
      - $ref: '#/components/parameters/DossierId'
    get:
      tags: [expediente]
      operationId: getDossierManifest
      summary: Obtiene los bytes originales del manifiesto propio
      description: |
        Disponible desde ready, también tras downloaded/expired si se generó.
        Su SHA-256 debe coincidir con manifestSha256. No requiere otro MFA,
        pero sí permiso/vínculo vigente y propiedad. No contiene filas de datos.
      x-roles: [admin_empresa, rh, supervisor, trabajador, auditor]
      x-permissions: [dossier_download]
      responses:
        '200':
          description: Manifiesto original; ejemplo completo en contracts/examples/dossier-v1
          content:
            application/json:
              schema: { $ref: './dossier-format.schema.yaml#/$defs/Manifest' }
              examples:
                ficticio:
                  summary: Empresa ficticia sin marcajes
                  externalValue: ./examples/dossier-v1/manifest.json
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /system/status:
    get:
      tags: [sistema]
      operationId: getSystemStatus
      summary: Informa el estado básico de la API
      security: []
      responses:
        "200":
          description: API disponible
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemStatus"
              example:
                service: zenit-backend
                status: ok
                version: 0.1.0
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /me:
    get:
      tags: [identidad]
      operationId: getCurrentUser
      summary: Devuelve la persona autenticada, su empresa y sus roles
      description: |
        Una cuenta válida sin acceso vigente responde sin empresa ni roles.
        Desde 0.36.0, `access` dice por qué: `none` si nadie la ha invitado
        o su acceso se deshabilitó, y `suspended` si su empresa está
        suspendida y la persona conservaba su acceso; sólo entonces
        `suspendedTenantName` trae el nombre de la empresa. La suspensión
        no devuelve ningún permiso: las demás rutas siguen respondiendo 403.
      x-roles: [operador_saas, admin_empresa, rh, supervisor, trabajador, auditor]
      responses:
        "200":
          description: Sesión vigente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
              example:
                userId: a3c5e7b9-1d3f-4b5a-9c7e-1b3d5f7a9c1e
                displayName: Persona de Recursos Humanos
                roles: [rh]
                tenant:
                  id: 7d0c2b7e-51f4-4a0e-9d5b-2f6a1c3e8b10
                  name: Panificadora Ejemplo
                  timeZone: America/Mexico_City
                  weekStartsOn: monday
                  breakPolicy: not_considered
                  upcomingBreakPolicy: null
                employeeId: null
                access: active
                suspendedTenantName: null
        "401":
          $ref: "#/components/responses/Unauthorized"

  /tenants:
    get:
      tags: [empresa]
      operationId: listTenants
      summary: Lista las empresas dadas de alta, con quién las administra
      description: |
        De la más antigua a la más reciente. `q` busca en el nombre y el
        identificador; los filtros se aplican antes de paginar.

        Cada empresa trae el estado de su administración, que sólo ve quien
        opera el servicio: `linked` si alguien con el rol `admin_empresa`
        entró con su cuenta y conserva el acceso, `pending` si sólo hay
        invitaciones sin usar, y `none` si no queda nadie con ese rol y acceso.
        Lista hasta 5 personas que la administran, primero quien ya entró;
        `total` dice cuántas son.

        Responde 422 si un filtro no es uno de sus valores.
      x-roles: [operador_saas]
      parameters:
        - $ref: "#/components/parameters/SearchText"
        - name: status
          in: query
          schema:
            type: string
            enum: [active, suspended]
        - name: administration
          in: query
          description: Estado de la administración de la empresa.
          schema:
            $ref: "#/components/schemas/TenantAdministrationState"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Página de empresas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantList"
              example:
                items:
                  - id: 7d0c2b7e-51f4-4a0e-9d5b-2f6a1c3e8b10
                    name: Panificadora Ejemplo
                    slug: panificadora-ejemplo
                    timeZone: America/Mexico_City
                    weekStartsOn: monday
                    breakPolicy: not_considered
                    status: active
                    createdAt: "2026-10-05T15:00:00Z"
                    autoCloseAfterHours: null
                    captureMethods: [card_terminal, phone_tag]
                    breakPolicyChange: null
                    administration:
                      state: pending
                      total: 1
                      administrators:
