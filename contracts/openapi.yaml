  responses:
    Unauthorized:
      description: Falta la credencial o no es válida
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://zenit.invalid/problems/unauthorized
            title: Credencial no válida
            status: 401
            code: unauthorized
            correlationId: 0b1c2d3e-4f5a-4b6c-8d7e-9f0a1b2c3d4e
            serverTime: "2026-10-05T13:00:01Z"
    Forbidden:
      description: La credencial es válida, pero el rol no alcanza
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://zenit.invalid/problems/forbidden
            title: Permiso insuficiente
            status: 403
            code: forbidden
            correlationId: 0b1c2d3e-4f5a-4b6c-8d7e-9f0a1b2c3d4e
    NotFound:
      description: El recurso no existe en la empresa de quien llama
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://zenit.invalid/problems/not-found
            title: No encontrado
            status: 404
            code: not-found
            correlationId: 0b1c2d3e-4f5a-4b6c-8d7e-9f0a1b2c3d4e
    Conflict:
      description: El estado actual no permite la operación
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://zenit.invalid/problems/conflict
            title: Conflicto con el estado actual
            status: 409
            code: conflict
            detail: La clave de idempotencia ya se usó con otro contenido.
            correlationId: 0b1c2d3e-4f5a-4b6c-8d7e-9f0a1b2c3d4e
    Unprocessable:
      description: La petición no cumple las reglas de validación
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://zenit.invalid/problems/validation
            title: Datos no válidos
            status: 422
            code: validation
            correlationId: 0b1c2d3e-4f5a-4b6c-8d7e-9f0a1b2c3d4e
            errors:
              - field: radiusMeters
                code: out-of-range
                message: Debe estar entre 20 y 2000.
    TooManyRequests:
      description: Se excedió la cuota de peticiones
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://zenit.invalid/problems/rate-limited
            title: Demasiadas peticiones
            status: 429
            code: rate-limited
            correlationId: 0b1c2d3e-4f5a-4b6c-8d7e-9f0a1b2c3d4e

  schemas:
    SystemStatus:
      type: object
      additionalProperties: false
      required: [service, status, version]
      properties:
        service:
          type: string
        status:
          type: string
          const: ok
        version:
          type: string

    Problem:
      type: object
      description: Detalle de un error según RFC 9457, con miembros propios.
      required: [type, title, status, code, correlationId]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          description: Código estable para que el cliente decida qué hacer.
        correlationId:
          type: string
          format: uuid
        serverTime:
          type: string
          format: date-time
          description: Presente en 401, para que un dispositivo con el reloj movido pueda corregirse.
        errors:
          type: array
          items:
            $ref: "#/components/schemas/FieldError"
    FieldError:
      type: object
      required: [field, code, message]
      properties:
        field:
          type: string
        code:
          type: string
        message:
          type: string

    NextCursor:
      type: [string, "null"]
      description: Cursor de la página siguiente, o nulo si no hay más.

    Role:
      type: string
      enum: [operador-saas, admin-empresa, rh, supervisor, trabajador, auditor, conector]
    DayOfWeek:
      type: string
      enum: [monday, tuesday, wednesday, thursday, friday, saturday, sunday]
    LocalTime:
      type: string
      pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
      description: Hora local de la sede, de 00:00 a 23:59.
    Sha256Hex:
      type: string
      pattern: "^[0-9a-f]{64}$"
    CompactJws:
      type: string
      pattern: "^[A-Za-z0-9_-]+\\.[A-Za-z0-9_-]+\\.[A-Za-z0-9_-]+$"
      description: JWS en serialización compacta (RFC 7515).

    CurrentUser:
      type: object
      required: [userId, displayName, roles, tenant, employeeId]
      properties:
        userId:
          type: string
          format: uuid
        displayName:
          type: string
        roles:
          type: array
          items:
            $ref: "#/components/schemas/Role"
        tenant:
          oneOf:
            - $ref: "#/components/schemas/TenantSummary"
            - type: "null"
          description: Nulo para quien opera el servicio sin pertenecer a una empresa.
        employeeId:
          type: [string, "null"]
          format: uuid
          description: Presente cuando la persona también está en el padrón.
    TenantSummary:
      type: object
      required: [id, name, timeZone, weekStartsOn]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        timeZone:
          type: string
        weekStartsOn:
          $ref: "#/components/schemas/DayOfWeek"

    Tenant:
      type: object
      required: [id, name, slug, timeZone, weekStartsOn, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        timeZone:
          type: string
          description: Zona IANA, por ejemplo America/Mexico_City.
        weekStartsOn:
          $ref: "#/components/schemas/DayOfWeek"
        status:
          type: string
          enum: [active, suspended]
        createdAt:
          type: string
          format: date-time
    TenantCreate:
      type: object
      additionalProperties: false
      required: [name, slug, timeZone, weekStartsOn]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        slug:
          type: string
          pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
          maxLength: 60
        timeZone:
          type: string
        weekStartsOn:
          $ref: "#/components/schemas/DayOfWeek"
    TenantUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        timeZone:
          type: string
        weekStartsOn:
          $ref: "#/components/schemas/DayOfWeek"
    TenantList:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Tenant"
        nextCursor:
          $ref: "#/components/schemas/NextCursor"

    Site:
      type: object
      required: [id, name, timeZone, latitude, longitude, radiusMeters, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        timeZone:
          type: string
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
        radiusMeters:
          type: integer
          minimum: 20
          maximum: 2000
        status:
          type: string
          enum: [active, inactive]
        createdAt:
          type: string
          format: date-time
    SiteCreate:
      type: object
      additionalProperties: false
      required: [name, timeZone, latitude, longitude, radiusMeters]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        timeZone:
          type: string
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
        radiusMeters:
          type: integer
          minimum: 20
          maximum: 2000
    SiteUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        timeZone:
          type: string
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
        radiusMeters:
          type: integer
          minimum: 20
          maximum: 2000
