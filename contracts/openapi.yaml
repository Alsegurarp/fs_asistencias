  /exports:
    post:
      tags: [exportes]
      operationId: createExport
      summary: Solicita el exporte de una semana cerrada
      description: |
        Sólo exporta cierres vigentes: quien no está cerrado esa semana no
        entra al archivo. Pedirlo lo deja en `queued`; lo prepara un trabajo y
        hay que consultar `getExport` hasta verlo en `ready` o en `failed`.

        `weekStart` admite cualquier fecha de la semana. `siteId` lo limita a
        las personas de una sede. Responde 422 con el error `no_closed_weeks`
        si esa semana, o esa sede, no tiene ningún cierre vigente.

        La misma `Idempotency-Key` devuelve el mismo exporte; con otro
        contenido responde 409 con `code` `idempotency_conflict`.

        Plantilla 1 del archivo: CSV en UTF-8 con marca de orden de bytes,
        para que una hoja de cálculo lea bien los acentos, y fin de línea
        CRLF. Una fila por cierre, ordenadas por identificador externo, con
        estas columnas: `tenant_slug`, `week_start`, `time_zone`,
        `rule_set_jurisdiction`, `rule_set_version`, `external_id`,
        `display_name`, `site_name`, `closure_version`, `worked_minutes`,
        `break_minutes`, `ordinary_minutes`, `overtime_minutes`,
        `acknowledgement`, `closed_at` y `closure_hash`. Cada fila declara así
        empresa, periodo, zona horaria, versión de reglas y la huella del
        cierre del que salió. El texto va entre comillas; a la celda que
        empieza con `=`, `+`, `-`, `@`, tabulador o salto de línea se le
        antepone un apóstrofo, para que una hoja de cálculo no la ejecute
        como fórmula.
      x-roles: [admin_empresa, rh, auditor]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExportCreate"
            example:
              weekStart: "2026-10-05"
              format: csv
      responses:
        "202":
          description: Exporte en preparación
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Export"
              example:
                id: e1c3a5b7-9d2f-4b4a-8c6e-0d2f4a6c8e0a
                status: queued
                weekStart: "2026-10-05"
                siteId: null
                format: csv
                timeZone: America/Mexico_City
                ruleSetVersion: 1
                rowCount: null
                manifestHash: null
                fileHash: null
                downloadUrl: null
                expiresAt: null
                createdAt: "2026-10-12T16:05:00Z"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /exports/{exportId}:
    parameters:
      - $ref: "#/components/parameters/ExportId"
    get:
      tags: [exportes]
      operationId: getExport
      summary: Devuelve el estado de un exporte y su enlace de descarga
      description: |
        `downloadUrl` y `expiresAt` sólo vienen mientras hay algo que
        descargar. El enlace es de un solo uso y expira: descargado o
        vencido, el exporte pasa a `expired` y el archivo deja de
        conservarse; quedan `fileHash`, `manifestHash` y `rowCount`.

        `fileHash` es el SHA-256 del archivo, byte por byte. `manifestHash`
        es el SHA-256 del manifiesto, que se lee con `getExportManifest`: declara
        empresa, semana, zona horaria, la huella del archivo y la huella de
        cada cierre que entró, y así liga el archivo con lo que se cerró.

        `failed` quiere decir que no se pudo preparar, por ejemplo porque los
        cierres se reabrieron antes de prepararlo: hay que pedirlo otra vez.
      x-roles: [admin_empresa, rh, auditor]
      responses:
        "200":
          description: Exporte
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Export"
              example:
                id: e1c3a5b7-9d2f-4b4a-8c6e-0d2f4a6c8e0a
                status: ready
                weekStart: "2026-10-05"
                siteId: null
                format: csv
                timeZone: America/Mexico_City
                ruleSetVersion: 1
                rowCount: 42
                manifestHash: 5d4c3b2a1f0e9d8c7b6a5f4e3d2c1b0a9f8e7d6c5b4a3f2e1d0c9b8a7f6e5d4c
                fileHash: 7a6b5c4d3e2f1a0b9c8d7e6f5a4b3c2d1e0f9a8b7c6d5e4f3a2b1c0d9e8f7a6b
                downloadUrl: /api/v1/exports/e1c3a5b7-9d2f-4b4a-8c6e-0d2f4a6c8e0a/download
                expiresAt: "2026-10-12T16:20:00Z"
                createdAt: "2026-10-12T16:05:00Z"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /exports/{exportId}/download:
    parameters:
      - $ref: "#/components/parameters/ExportId"
    get:
      tags: [exportes]
      operationId: downloadExport
      summary: Descarga el archivo de un exporte, una sola vez
      description: |
        Pide la misma credencial y los mismos roles que el exporte: el enlace
        por sí solo no da acceso a nada. Entrega el archivo una vez; después
        el exporte queda `expired` y el archivo deja de conservarse. Queda en
        la bitácora quién lo descargó.

        Responde 409 con `code` `export_not_ready` mientras se prepara, y 410
        con `export_expired` si ya se descargó o venció, o con
        `export_failed` si no se pudo preparar. En los dos casos de 410 hay
        que pedir el exporte otra vez.
      x-roles: [admin_empresa, rh, auditor]
      responses:
        "200":
          description: Archivo del exporte
          headers:
            Content-Disposition:
              description: Nombre sugerido, con la empresa y la semana.
              schema:
                type: string
              example: attachment; filename="zenit-panificadora-2026-10-05.csv"
          content:
            text/csv:
              schema:
                type: string
              example: |
                tenant_slug,week_start,time_zone,rule_set_jurisdiction,rule_set_version,external_id,display_name,site_name,closure_version,worked_minutes,break_minutes,ordinary_minutes,overtime_minutes,acknowledgement,closed_at,closure_hash
                "panificadora",2026-10-05,"America/Mexico_City","MX-LFT",1,"E-001","Persona Uno","Sucursal Centro",1,2400,150,2400,0,agreed,2026-10-12T16:00:00Z,1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a6b7c8d9e0f1a2b
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "410":
          description: El archivo ya se descargó, venció o no se pudo preparar
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                type: https://zenit.invalid/problems/gone
                title: Ya no está disponible
                status: 410
                code: export_expired
                detail: El enlace ya se usó o venció; hay que pedir el exporte otra vez.
                correlationId: 0b1c2d3e-4f5a-4b6c-8d7e-9f0a1b2c3d4e

  /exports/{exportId}/manifest:
    parameters:
      - $ref: "#/components/parameters/ExportId"
    get:
      tags: [exportes]
      operationId: getExportManifest
      summary: Devuelve el manifiesto de un exporte
      description: |
        El manifiesto declara qué se exportó y de dónde salió: empresa,
        semana, zona horaria, la huella del archivo y, por cada fila, el
        cierre del que salió con su versión y su huella. Con él se comprueba
        que un archivo guardado es el que se generó, comparando `fileSha256`
        con el SHA-256 del archivo, y que cada fila corresponde a un cierre,
        comparando `closures[].hash` con el `hash` de ese cierre.

        Se entrega byte por byte como se guardó: el SHA-256 del cuerpo de
        esta respuesta es el `manifestHash` del exporte. Hay que calcularlo
        sobre el cuerpo tal como llega, sin volver a darle formato.

        Sigue disponible después de descargar el archivo o de que venza.
        Responde 409 con `code` `export_not_ready` mientras se prepara, y 410
        con `export_failed` si no se pudo preparar.
      x-roles: [admin_empresa, rh, auditor]
      responses:
        "200":
          description: Manifiesto del exporte
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExportManifest"
              example:
                exportId: e1c3a5b7-9d2f-4b4a-8c6e-0d2f4a6c8e0a
                templateVersion: 1
                format: csv
                tenant:
                  id: 7d0c2b7e-51f4-4a0e-9d5b-2f6a1c3e8b10
                  slug: panificadora-ejemplo
                  name: Panificadora Ejemplo
                weekStart: "2026-10-05"
                timeZone: America/Mexico_City
                siteId: null
                rowCount: 1
                fileSha256: 7a6b5c4d3e2f1a0b9c8d7e6f5a4b3c2d1e0f9a8b7c6d5e4f3a2b1c0d9e8f7a6b
                closures:
                  - closureId: 0a2c4e6b-8d0f-4a2c-9e4b-6d8f0a2c4e6d
                    employeeId: 5a7c9e1b-3d5f-4b6a-8c0e-2a4c6e8b0d12
                    version: 1
                    ruleSetVersion: 1
                    hash: 1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a6b7c8d9e0f1a2b
                generatedAt: "2026-10-12T16:05:03Z"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
