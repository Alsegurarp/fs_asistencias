        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /integrations/checkpoints:
    get:
      tags: [integraciones]
      operationId: listIntegrationCheckpoints
      summary: Lista las fuentes del padrón y su último punto de sincronización
      description: |
        De dónde viene el padrón de la empresa. Hoy la única fuente que existe
        es la carga por archivo: aparece cuando se aplica la primera, con
        `cursor` igual al identificador de la última carga aplicada y
        `sourceVersion` igual a la plantilla del archivo. Validar un archivo
        sin aplicarlo no la mueve. Una empresa que captura su padrón a mano
        no tiene fuentes. Los tipos `api` y `connector` quedan reservados
        para cuando exista la sincronización.
      x-roles: [admin_empresa, rh]
      responses:
        "200":
          description: Fuentes del padrón
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntegrationCheckpointList"
              example:
                items:
                  - sourceId: 8c0e2a4c-6e8a-4c0e-8a2c-4e6a8c0e2a4c
                    type: csv
                    status: active
                    cursor: 3f5a7c9e-1b3d-4f5a-8c7e-9b1d3f5a7c9e
                    sourceVersion: "1"
                    updatedAt: "2026-10-05T15:41:00Z"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

components:
  securitySchemes:
    userToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Token de acceso de una persona, emitido por el proveedor de identidad.
        La API deriva de él la empresa y los roles.
    deviceToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Aserción firmada por el propio dispositivo con su clave privada, ES256.
        `iss` y `sub` llevan el identificador del dispositivo, `aud` el valor
        de `audience` recibido al activar, y vive como máximo
        `tokenMaxAgeSeconds`. El servidor la verifica con la clave pública
        registrada al activar y deriva de ella empresa, dispositivo y
        modalidad.

  parameters:
    DossierId:
      name: dossierId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Cursor:
      name: cursor
      in: query
      description: Valor de `nextCursor` de la página anterior.
      schema:
        type: string
    AuditAction:
      name: action
      in: query
      schema:
        type: string
    AuditGroup:
      name: group
      in: query
      schema:
        type: string
        enum: [closures, incidents, directory, devices, access, settings, exports]
    AuditActorType:
      name: actorType
      in: query
      schema:
        type: string
        enum: [user, device, system]
    AuditActorId:
      name: actorId
      in: query
      schema:
        type: string
        format: uuid
    AuditTargetType:
      name: targetType
      in: query
      description: Tipo de lo que se tocó, como `employee`, `incident` o `card`.
      schema:
        type: string
        maxLength: 40
    AuditTargetId:
      name: targetId
      in: query
      description: Va junto con `targetType`.
      schema:
        type: string
        format: uuid
    AuditFrom:
      name: from
      in: query
      schema:
        type: string
        format: date-time
    AuditTo:
      name: to
      in: query
      schema:
        type: string
        format: date-time
    UsageMonth:
      name: month
      in: query
      required: true
      description: Mes del calendario de cada empresa, en la forma `AAAA-MM`.
      schema:
        type: string
        pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$"
      example: "2026-10"
    SearchText:
      name: q
      in: query
      description: >-
        Texto a buscar por fragmento, sin distinguir mayúsculas ni acentos del
        español. Un `%` o un `_` se buscan tal cual. Más de 100 caracteres
        responde 422 con `too_long`.
      schema:
        type: string
        maxLength: 100
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Week:
      name: week
      in: query
      required: true
      description: Cualquier fecha de la semana. El servidor la ajusta al inicio de semana de la empresa.
      schema:
        type: string
        format: date
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: La misma clave nunca crea dos resultados.
      schema:
        type: string
        format: uuid
    TenantId:
      name: tenantId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    BreakPolicyChangeId:
      name: changeId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SiteId:
      name: siteId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ScheduleId:
      name: scheduleId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    EmployeeId:
      name: employeeId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ImportId:
      name: importId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CardId:
      name: cardId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DeviceId:
      name: deviceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IncidentId:
      name: incidentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ClosureId:
      name: closureId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ExportId:
      name: exportId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RunId:
      name: runId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    DossierNotReady:
      description: dossier_not_ready, challenge_consumed o idempotency_conflict; ver tabla de errores E1
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example: { type: 'https://zenit.invalid/problems/conflict', title: Expediente no listo, status: 409, code: dossier_not_ready, correlationId: 0b1c2d3e-4f5a-4b6c-8d7e-9f0a1b2c3d4e }
    DossierGone:
      description: dossier_expired, dossier_downloaded, challenge_expired o authorization_expired
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example: { type: 'https://zenit.invalid/problems/gone', title: Expediente vencido, status: 410, code: dossier_expired, correlationId: 0b1c2d3e-4f5a-4b6c-8d7e-9f0a1b2c3d4e }
    DossierVerificationFailed:
      description: forbidden sin permiso o verification_failed si la prueba/autorización no coincide; no revelar detalles criptográficos
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example: { type: 'https://zenit.invalid/problems/forbidden', title: Verificación no válida, status: 403, code: verification_failed, correlationId: 0b1c2d3e-4f5a-4b6c-8d7e-9f0a1b2c3d4e }
    Unauthorized:
      description: Falta la credencial o no es válida
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://zenit.invalid/problems/unauthorized
            title: Credencial no válida
            status: 401
            code: unauthorized
            correlationId: 0b1c2d3e-4f5a-4b6c-8d7e-9f0a1b2c3d4e
            serverTime: "2026-10-05T13:00:01Z"
    Forbidden:
      description: La credencial es válida, pero el rol no alcanza
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://zenit.invalid/problems/forbidden
            title: Permiso insuficiente
            status: 403
            code: forbidden
            correlationId: 0b1c2d3e-4f5a-4b6c-8d7e-9f0a1b2c3d4e
    BreakPolicyChangePending:
      description: Ya hay un cambio de la política de comida programado
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://zenit.invalid/problems/conflict
            title: Conflicto con el estado actual
            status: 409
            code: break_policy_change_pending
            detail: Ya hay un cambio de la política de comida programado; cancélalo para programar otro.
            correlationId: 0b1c2d3e-4f5a-4b6c-8d7e-9f0a1b2c3d4e
    BreakPolicyChangeNotPending:
      description: El cambio ya entró o ya estaba cancelado
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://zenit.invalid/problems/conflict
            title: Conflicto con el estado actual
            status: 409
            code: break_policy_change_not_pending
            detail: Ese cambio ya entró o ya estaba cancelado.
            correlationId: 0b1c2d3e-4f5a-4b6c-8d7e-9f0a1b2c3d4e
    NotFound:
      description: El recurso no existe en la empresa de quien llama
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://zenit.invalid/problems/not-found
            title: No encontrado
            status: 404
            code: not_found
            correlationId: 0b1c2d3e-4f5a-4b6c-8d7e-9f0a1b2c3d4e
    Conflict:
      description: El estado actual no permite la operación
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://zenit.invalid/problems/conflict
            title: Conflicto con el estado actual
            status: 409
            code: idempotency_conflict
            detail: La clave de idempotencia ya se usó con otro contenido.
            correlationId: 0b1c2d3e-4f5a-4b6c-8d7e-9f0a1b2c3d4e
    Unprocessable:
      description: La petición no cumple las reglas de validación
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://zenit.invalid/problems/validation
            title: Datos no válidos
            status: 422
            code: validation
            correlationId: 0b1c2d3e-4f5a-4b6c-8d7e-9f0a1b2c3d4e
            errors:
              - field: radiusMeters
                code: out_of_range
                message: Debe estar entre 20 y 2000.
    TooManyRequests:
      description: Se excedió la cuota de peticiones
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://zenit.invalid/problems/rate-limited
            title: Demasiadas peticiones
            status: 429
            code: rate_limited
            correlationId: 0b1c2d3e-4f5a-4b6c-8d7e-9f0a1b2c3d4e

  schemas:
    ChallengeCreate:
      type: object
      additionalProperties: false
      required: [codeChallenge]
      properties:
        codeChallenge: { type: string, pattern: '^[A-Za-z0-9_-]{43}$' }
    Challenge:
      type: object
      additionalProperties: false
      required: [id, authorizationUrl, state, expiresAt]
      properties:
        id: { type: string, format: uuid }
        authorizationUrl: { type: string, format: uri, pattern: '^https://|^http://(localhost|127\.0\.0\.1)(:[0-9]+)?/' }
        state: { type: string, pattern: '^[A-Za-z0-9_-]{43}$' }
        expiresAt: { type: string, format: date-time }
    AuthorizationCreate:
      type: object
      additionalProperties: false
      required: [challengeId, code, codeVerifier, state]
      properties:
        challengeId: { type: string, format: uuid }
        code: { type: string, minLength: 1, maxLength: 2048 }
        codeVerifier: { type: string, pattern: '^[A-Za-z0-9._~-]{43,128}$' }
        state: { type: string, pattern: '^[A-Za-z0-9_-]{43}$' }
    DownloadAuthorization:
      type: object
      additionalProperties: false
      required: [authorization, expiresAt]
      properties:
        authorization: { type: string, pattern: '^[A-Za-z0-9_-]{43}$', description: 32 bytes aleatorios base64url sin relleno; ejemplo sin valor. }
        expiresAt: { type: string, format: date-time }
    DownloadRequest:
      type: object
      additionalProperties: false
      required: [authorization]
      properties:
        authorization: { type: string, pattern: '^[A-Za-z0-9_-]{43}$' }
    DossierPermission:
      type: object
      additionalProperties: false
      required: [enabled]
      properties:
        enabled: { type: boolean }
    DossierCreate:
      type: object
      additionalProperties: false
      required: [formatVersion]
      properties:
        formatVersion: { type: integer, const: 1 }
    Dossier:
      type: object
      additionalProperties: false
      required: [id, tenantId, requestedBy, formatVersion, scope, status, createdAt, expiresAt, snapshotAt, readyAt, manifestSha256, fileSha256, failureCode, downloadedAt]
      properties:
        downloadedAt: { type: [string, 'null'], format: date-time, description: Cuándo se descargó; nulo mientras no se descarga. }
        id: { type: string, format: uuid }
        tenantId: { type: string, format: uuid, description: Derivado de la identidad; no se admite en solicitudes. }
        requestedBy: { type: string, format: uuid }
        formatVersion: { type: integer, const: 1 }
        scope: { type: string, const: all_retained }
        status: { type: string, enum: [queued, preparing, ready, failed, expired, downloaded] }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        snapshotAt: { type: [string, 'null'], format: date-time }
        readyAt: { type: [string, 'null'], format: date-time }
        manifestSha256: { type: [string, 'null'], pattern: '^[a-f0-9]{64}$' }
        fileSha256: { type: [string, 'null'], pattern: '^[a-f0-9]{64}$' }
        failureCode: { enum: [null, preparation_failed] }
      allOf:
        - if: { additionalProperties: true, properties: { status: { enum: [ready, downloaded] } } }
          then:
            additionalProperties: true
            properties:
              snapshotAt: { type: string }
              readyAt: { type: string }
              manifestSha256: { type: string }
              fileSha256: { type: string }
        - if: { additionalProperties: true, properties: { status: { const: queued } } }
          then: { additionalProperties: true, properties: { snapshotAt: { type: 'null' } } }
        - if: { additionalProperties: true, properties: { status: { const: preparing } } }
          then: { additionalProperties: true, properties: { snapshotAt: { type: string } } }
        - if: { additionalProperties: true, properties: { status: { enum: [queued, preparing, failed] } } }
          then:
            additionalProperties: true
            properties:
              readyAt: { type: 'null' }
              manifestSha256: { type: 'null' }
              fileSha256: { type: 'null' }
        - if: { additionalProperties: true, properties: { status: { const: failed } } }
          then: { additionalProperties: true, properties: { failureCode: { const: preparation_failed } } }
          else: { additionalProperties: true, properties: { failureCode: { type: 'null' } } }
        - if: { additionalProperties: true, properties: { manifestSha256: { type: string } } }
          then:
            additionalProperties: true
            properties:
              snapshotAt: { type: string }
              readyAt: { type: string }
              fileSha256: { type: string }
          else:
            additionalProperties: true
            properties:
              readyAt: { type: 'null' }
              fileSha256: { type: 'null' }
    DossierList:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Dossier"
        nextCursor:
          $ref: "#/components/schemas/NextCursor"
    SystemStatus:
      type: object
      additionalProperties: false
      required: [service, status, version]
      properties:
        service:
          type: string
        status:
          type: string
          const: ok
        version:
          type: string

    Problem:
      type: object
      description: Detalle de un error según RFC 9457, con miembros propios.
      required: [type, title, status, code, correlationId]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          description: Código estable para que el cliente decida qué hacer.
        correlationId:
          type: string
          format: uuid
        serverTime:
          type: string
          format: date-time
          description: Presente en 401, para que un dispositivo con el reloj movido pueda corregirse.
        errors:
          type: array
          items:
            $ref: "#/components/schemas/FieldError"
    FieldError:
      type: object
      required: [field, code, message]
      properties:
        field:
          type: string
        code:
          type: string
        message:
          type: string

    NextCursor:
      type: [string, "null"]
      description: Cursor de la página siguiente, o nulo si no hay más.

    Role:
      type: string
      enum: [operador_saas, admin_empresa, rh, supervisor, trabajador, auditor, conector]
    DayOfWeek:
      type: string
      enum: [monday, tuesday, wednesday, thursday, friday, saturday, sunday]
    LocalTime:
      type: string
      pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
      description: Hora local de la sede, de 00:00 a 23:59.
    Sha256Hex:
      type: string
      pattern: "^[0-9a-f]{64}$"
    CompactJws:
      type: string
      pattern: "^[A-Za-z0-9_-]+\\.[A-Za-z0-9_-]+\\.[A-Za-z0-9_-]+$"
      description: JWS en serialización compacta (RFC 7515).

    CurrentUser:
      type: object
      required: [userId, displayName, roles, tenant, employeeId, access, suspendedTenantName]
      properties:
        userId:
          type: string
          format: uuid
          description: >-
            Identificador de la persona en su empresa, el mismo de `/users`.
            Para quien no pertenece a ninguna, el de su cuenta.
        displayName:
          type: string
        roles:
          type: array
          description: >-
            Vacío para una cuenta válida a la que nadie ha invitado o cuyo
            acceso se deshabilitó; en ese caso `tenant` es nulo.
          items:
            $ref: "#/components/schemas/Role"
        tenant:
          oneOf:
            - $ref: "#/components/schemas/TenantSummary"
            - type: "null"
          description: Nulo para quien opera el servicio sin pertenecer a una empresa.
        employeeId:
          type: [string, "null"]
          format: uuid
          description: Presente cuando la persona también está en el padrón.
        access:
          type: string
          enum: [active, suspended, none]
          description: >-
            Desde 0.36.0. `active` con acceso vigente; `suspended` cuando su
            empresa está suspendida; `none` sin invitación o con el acceso
            deshabilitado. En los dos últimos, `tenant` es nulo y `roles`, vacío.
        suspendedTenantName:
          type: [string, "null"]
          description: >-
            Desde 0.36.0. Nombre de la empresa suspendida, sólo con `access`
            en `suspended`.
    BreakPolicy:
      type: string
      enum: [not_considered, marked]
      description: |
        Qué hace la empresa con el descanso o la comida. Con `not_considered`
        no se marca y la jornada es salida menos entrada: sólo hay marcajes de
        entrada y de salida. Con `marked` la persona marca el inicio y el fin
        del descanso y ese tiempo se mide aparte.
    TenantSummary:
      type: object
      required: [id, name, timeZone, weekStartsOn, breakPolicy, upcomingBreakPolicy]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        timeZone:
          type: string
        weekStartsOn:
          $ref: "#/components/schemas/DayOfWeek"
        breakPolicy:
          $ref: "#/components/schemas/BreakPolicy"
        upcomingBreakPolicy:
          oneOf:
            - $ref: "#/components/schemas/UpcomingBreakPolicy"
            - type: "null"
          description: El cambio de la política de comida que todavía no entra; nulo si no hay.

    Tenant:
      type: object
      required: [id, name, slug, timeZone, weekStartsOn, breakPolicy, status, createdAt, autoCloseAfterHours, breakPolicyChange, captureMethods]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        timeZone:
          type: string
          description: Zona IANA, por ejemplo America/Mexico_City.
        weekStartsOn:
          $ref: "#/components/schemas/DayOfWeek"
        breakPolicy:
          $ref: "#/components/schemas/BreakPolicy"
          description: La que vale hoy en la empresa. Cambia sólo con un cambio programado.
        status:
          type: string
          enum: [active, suspended]
        createdAt:
          type: string
          format: date-time
        autoCloseAfterHours:
          type: [integer, "null"]
          minimum: 1
          maximum: 168
          description: >-
            Horas después del fin de la semana a las que el sistema la cierra
            por su cuenta. Nulo: sólo la cierra una persona.
        breakPolicyChange:
          oneOf:
            - $ref: "#/components/schemas/BreakPolicyChange"
            - type: "null"
          description: El cambio de la política de comida que todavía no entra; nulo si no hay.
        captureMethods:
          $ref: "#/components/schemas/CaptureMethods"
          description: >-
            Las formas de marcar del plan de la empresa (desde 0.35.0). Las
            fija quien opera el servicio; la empresa no las cambia.
    CaptureMethods:
      type: array
      minItems: 1
      uniqueItems: true
      items:
        type: string
        enum: [card_terminal, phone_tag]
      description: >-
        `card_terminal`: la tarjeta de la persona en el lector fijo de la sede.
        `phone_tag`: el teléfono de la persona en la etiqueta de la sede. Se
        venden por separado.
    PersonCaptureMethod:
      type: string
      enum: [card, phone]
      description: >-
        Cómo marca una persona: con su tarjeta en el lector fijo (`card`) o
        con su teléfono en la etiqueta de la sede (`phone`). Una sola forma.
    TenantCaptureMethodsChange:
      type: object
      additionalProperties: false
      required: [captureMethods, reason]
      properties:
        captureMethods:
          $ref: "#/components/schemas/CaptureMethods"
        reason:
          type: string
          minLength: 10
          maxLength: 500
          description: Por qué cambia el plan; queda en la bitácora de la empresa.
    TenantCreate:
      type: object
      additionalProperties: false
      required: [name, slug, timeZone, weekStartsOn, breakPolicy, firstAdminEmail]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        slug:
          type: string
          pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
          maxLength: 60
        timeZone:
          type: string
        weekStartsOn:
          $ref: "#/components/schemas/DayOfWeek"
        breakPolicy:
          $ref: "#/components/schemas/BreakPolicy"
          description: Se elige al dar de alta la empresa; no tiene valor por defecto.
        firstAdminEmail:
          type: string
          format: email
          maxLength: 254
          description: >-
            Correo de quien administrará la empresa. Queda invitada con el rol
            `admin_empresa`; desde ahí invita al resto.
    TenantUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        timeZone:
          type: string
        weekStartsOn:
          $ref: "#/components/schemas/DayOfWeek"
        autoCloseAfterHours:
          type: [integer, "null"]
          minimum: 1
          maximum: 168
          description: Nulo apaga el cierre programado.
    BreakPolicyChangeCreate:
      type: object
      additionalProperties: false
      required: [breakPolicy, reason]
      properties:
        breakPolicy:
          $ref: "#/components/schemas/BreakPolicy"
        reason:
          type: string
          minLength: 10
          maxLength: 500
          description: Por qué cambia. Lo ven quienes administran la empresa.
    BreakPolicyChange:
      type: object
      additionalProperties: false
      required: [id, breakPolicy, effectiveOn, effectiveAt, reason, scheduledAt]
      properties:
        id:
          type: string
          format: uuid
        breakPolicy:
          $ref: "#/components/schemas/BreakPolicy"
        effectiveOn:
          type: string
          format: date
          description: Día del calendario de la empresa en que entra; es un inicio de su semana.
        effectiveAt:
          type: string
          format: date-time
          description: El inicio de ese día en la zona horaria de la empresa.
        reason:
          type: string
        scheduledAt:
          type: string
          format: date-time
    UpcomingBreakPolicy:
      type: object
      additionalProperties: false
      required: [breakPolicy, effectiveOn, effectiveAt]
      description: Lo que una persona o un dispositivo necesitan para avisar del cambio y aplicarlo al llegar la hora.
      properties:
        breakPolicy:
          $ref: "#/components/schemas/BreakPolicy"
        effectiveOn:
          type: string
          format: date
        effectiveAt:
          type: string
          format: date-time
    TenantUsage:
      type: object
      additionalProperties: false
      required: [tenantId, month, timeZone, from, to, complete, employeesWithAttendance, employeesInPeriod, cardsAssigned, devicesActive, attendanceEvents]
      properties:
        tenantId:
          type: string
          format: uuid
        month:
          type: string
          pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$"
        timeZone:
          type: string
          description: Zona IANA de la empresa, con la que se cortó el mes.
        from:
          type: string
          format: date-time
          description: Inicio del mes en la zona de la empresa, incluido.
        to:
          type: string
          format: date-time
          description: Inicio del mes siguiente en la zona de la empresa, excluido.
        complete:
          type: boolean
          description: Verdadero cuando el mes ya terminó; mientras no, los conteos crecen.
        employeesWithAttendance:
          type: integer
          minimum: 0
        employeesInPeriod:
          type: integer
          minimum: 0
        cardsAssigned:
          type: integer
          minimum: 0
        devicesActive:
          type: integer
          minimum: 0
        attendanceEvents:
          type: integer
          minimum: 0
    TenantStatusChange:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 10
          maxLength: 500
          description: Por qué se suspende o se reactiva; queda en la bitácora de la empresa.
    AdministratorUnlink:
      type: object
      additionalProperties: false
      required: [email, reason]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          description: Correo de quien administra la empresa.
        reason:
          type: string
          minLength: 10
          maxLength: 500
          description: Por qué se suelta la liga; queda en la bitácora de la empresa.
    AdministratorInvite:
      type: object
      additionalProperties: false
      required: [email, reason]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          description: Correo de quien administrará la empresa.
        reason:
          type: string
          minLength: 10
          maxLength: 500
          description: Por qué se invita desde la operación; queda en la bitácora de la empresa.
    TenantAdministrationState:
      type: string
      description: >-
        `linked`: alguien con el rol `admin_empresa` entró con su cuenta y
        conserva el acceso. `pending`: sólo hay invitaciones sin usar.
        `none`: no queda nadie con ese rol y acceso.
      enum: [linked, pending, none]
    TenantAdministrator:
      type: object
      additionalProperties: false
      description: Quien administra una empresa. No lleva más datos de la persona que su correo y su acceso.
      required: [email, status, invitedAt, linkedAt]
      properties:
        email:
          type: string
          format: email
        status:
          type: string
          enum: [active, invited]
        invitedAt:
          type: string
          format: date-time
        linkedAt:
          type: [string, "null"]
          format: date-time
          description: Cuándo entró por primera vez con su cuenta de hoy; nulo si todavía no entra.
    TenantAdministration:
      type: object
      additionalProperties: false
      required: [state, total, administrators]
      properties:
        state:
          $ref: "#/components/schemas/TenantAdministrationState"
        total:
          type: integer
          minimum: 0
          description: Cuántas personas con acceso tienen el rol `admin_empresa`.
        administrators:
          type: array
          maxItems: 5
          description: Hasta 5, primero quien ya entró y luego las invitaciones más recientes.
          items:
            $ref: "#/components/schemas/TenantAdministrator"
    OperatedTenant:
      description: Una empresa vista desde la operación del servicio, con el estado de su administración.
      allOf:
        - $ref: "#/components/schemas/Tenant"
        - type: object
          required: [administration]
          properties:
            administration:
              $ref: "#/components/schemas/TenantAdministration"
    TenantList:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/OperatedTenant"
        nextCursor:
          $ref: "#/components/schemas/NextCursor"
    TenantListSummary:
      type: object
      additionalProperties: false
      required: [total, active, suspended, administration]
      properties:
        total:
          type: integer
        active:
          type: integer
        suspended:
          type: integer
        administration:
          type: object
          additionalProperties: false
          required: [linked, pending, none]
          properties:
            linked: { type: integer }
            pending: { type: integer }
            none: { type: integer }
    TenantUsageItem:
      type: object
      additionalProperties: false
      required: [id, name, slug, status, usage]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        status:
          type: string
          enum: [active, suspended]
        usage:
          $ref: "#/components/schemas/TenantUsage"
    TenantUsageList:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/TenantUsageItem"
        nextCursor:
          $ref: "#/components/schemas/NextCursor"
    TenantUsageSummary:
      type: object
      additionalProperties: false
      required: [month, tenants, complete, employeesWithAttendance, employeesInPeriod, cardsAssigned, devicesActive, attendanceEvents]
      properties:
        month:
          type: string
          pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$"
        tenants:
          type: integer
          minimum: 0
          description: Empresas que entran con estos filtros.
        complete:
          type: integer
          minimum: 0
          description: En cuántas de ellas el mes ya terminó.
        employeesWithAttendance:
          type: integer
          minimum: 0
        employeesInPeriod:
          type: integer
          minimum: 0
        cardsAssigned:
          type: integer
          minimum: 0
        devicesActive:
          type: integer
          minimum: 0
        attendanceEvents:
          type: integer
          minimum: 0

    TenantRole:
      type: string
      description: Roles que una empresa da a su gente.
      enum: [admin_empresa, rh, supervisor, trabajador, auditor]
    User:
      type: object
      description: Persona con acceso al portal de la empresa. Supervisión se limita a sus siteIds, salvo roles adicionales de alcance empresa. El permiso explícito de expediente es una capacidad independiente.
      required: [id, email, displayName, roles, status, createdAt, linkedAt, employeeId, siteIds, dossierPermission, dossierPermissionSince]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        displayName:
          type: string
        roles:
          type: array
          items:
            $ref: "#/components/schemas/TenantRole"
        status:
          type: string
          enum: [invited, active, disabled]
          description: >-
            `invited` mientras no entra por primera vez, `active` cuando ya
            está ligada a su cuenta y `disabled` cuando se le quitó el acceso.
        createdAt:
          type: string
          format: date-time
        linkedAt:
          type: [string, "null"]
          format: date-time
          description: Primera entrada con su cuenta; nulo si todavía no entra.
        employeeId:
          type: [string, "null"]
          format: uuid
          description: Su fila del padrón, cuando la persona también es trabajadora.
        siteIds:
          $ref: "#/components/schemas/SupervisorSiteIds"
        dossierPermission:
          type: boolean
          description: >-
            Puede descargar hoy el expediente de la empresa. El permiso vale
            para la cuenta con la que se concedió: si la liga cambia, deja de
            valer.
        dossierPermissionSince:
          type: [string, "null"]
          format: date-time
          description: Desde cuándo vale; nulo sin permiso, o en un permiso concedido antes de 0.22.0 sin rastro en la bitácora.
    UserSummary:
      type: object
      additionalProperties: false
      required: [total, active, invited, disabled, byRole, supervisorsWithoutSites, dossierPermission]
      properties:
        total:
          type: integer
        active:
          type: integer
        invited:
          type: integer
        disabled:
          type: integer
        byRole:
          type: object
          additionalProperties: false
          required: [admin_empresa, auditor, rh, supervisor, trabajador]
          properties:
            admin_empresa:
              type: integer
            auditor:
              type: integer
            rh:
              type: integer
            supervisor:
              type: integer
            trabajador:
              type: integer
        supervisorsWithoutSites:
          type: integer
          description: Supervisión con acceso vigente y sin sedes asignadas; no ve a nadie.
        dossierPermission:
          type: integer
          description: Personas que pueden descargar hoy el expediente.
    UserCreate:
      type: object
      additionalProperties: false
      required: [email, roles]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        displayName:
          type: string
          minLength: 1
          maxLength: 120
        roles:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: "#/components/schemas/TenantRole"
        employeeId:
          type: string
          format: uuid
          description: Fila del padrón con la que se liga la cuenta.
        siteIds:
          $ref: "#/components/schemas/SupervisorSiteIds"
    UserUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 120
        roles:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: "#/components/schemas/TenantRole"
        disabled:
          type: boolean
        employeeId:
          type: [string, "null"]
          format: uuid
          description: Fila del padrón con la que se liga la cuenta; nulo la suelta.
        siteIds:
          $ref: "#/components/schemas/SupervisorSiteIds"
    SupervisorSiteIds:
      type: array
      maxItems: 100
      uniqueItems: true
      description: Sedes de la misma empresa para Supervisión; vacío no concede acceso a ninguna sede. Administración, RH y Auditoría conservan su alcance explícito de empresa.
      items:
        type: string
        format: uuid
    UserList:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/User"
        nextCursor:
          $ref: "#/components/schemas/NextCursor"

    Site:
      type: object
      required: [id, name, timeZone, latitude, longitude, radiusMeters, status, createdAt, people, terminals, captureMethods]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        timeZone:
          type: string
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
        radiusMeters:
          type: integer
          minimum: 20
          maximum: 2000
        status:
          type: string
          enum: [active, inactive]
        createdAt:
          type: string
          format: date-time
        people:
          type: integer
          minimum: 0
          description: Personas activas de la sede.
        terminals:
          type: integer
          minimum: 0
          description: Terminales activas de la sede.
        captureMethods:
          $ref: "#/components/schemas/CaptureMethods"
          description: >-
            Las formas de marcar que admite la sede, siempre dentro del plan
            (desde 0.35.0). Si la sede no eligió, todas las del plan.
    SiteCreate:
      type: object
      additionalProperties: false
      required: [name, timeZone, latitude, longitude, radiusMeters]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        timeZone:
          type: string
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
        radiusMeters:
          type: integer
          minimum: 20
          maximum: 2000
    SiteUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        timeZone:
          type: string
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
        radiusMeters:
          type: integer
          minimum: 20
          maximum: 2000
        status:
          type: string
          enum: [active, inactive]
        captureMethods:
          $ref: "#/components/schemas/CaptureMethods"
          description: >-
            Sólo formas del plan; otra responde 422 con `not_in_plan`. Mandar
            todas las del plan deja a la sede sin elección propia: si el plan
            crece, la sede también las admite.
    SiteList:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Site"
        nextCursor:
          $ref: "#/components/schemas/NextCursor"

    ScheduleDay:
      type: object
      additionalProperties: false
      required: [dayOfWeek, startTime, endTime, breakMinutes]
      properties:
        dayOfWeek:
          $ref: "#/components/schemas/DayOfWeek"
        startTime:
          $ref: "#/components/schemas/LocalTime"
        endTime:
          $ref: "#/components/schemas/LocalTime"
          description: Si es menor que `startTime`, el turno termina al día siguiente.
        breakMinutes:
          type: integer
          minimum: 0
          maximum: 480
          description: |
            Descanso previsto en ese día. Si la empresa marca el descanso, sirve
            para avisar cuando el medido lo excede; si no lo considera, es sólo
            informativo y no se descuenta.
    Schedule:
      type: object
      required: [id, name, timeZone, validFrom, validTo, days, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        timeZone:
          type: string
        validFrom:
          type: string
          format: date
        validTo:
          type: [string, "null"]
          format: date
        days:
          type: array
          items:
            $ref: "#/components/schemas/ScheduleDay"
        createdAt:
          type: string
          format: date-time
    ScheduleCreate:
      type: object
      additionalProperties: false
      required: [name, timeZone, validFrom, days]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        timeZone:
          type: string
        validFrom:
          type: string
          format: date
        validTo:
          type: [string, "null"]
          format: date
        days:
          type: array
          minItems: 1
          maxItems: 7
          items:
            $ref: "#/components/schemas/ScheduleDay"
    ScheduleList:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Schedule"
        nextCursor:
          $ref: "#/components/schemas/NextCursor"
    ScheduleAssignment:
      type: object
      required: [id, employeeId, scheduleId, validFrom, validTo]
      properties:
        id:
          type: string
          format: uuid
        employeeId:
          type: string
          format: uuid
        scheduleId:
          type: string
          format: uuid
        validFrom:
          type: string
          format: date
        validTo:
          type: [string, "null"]
          format: date
    ScheduleAssignmentCreate:
      type: object
      additionalProperties: false
      required: [scheduleId, validFrom]
      properties:
        scheduleId:
          type: string
          format: uuid
        validFrom:
          type: string
          format: date

    EmployeeStatus:
      type: string
      enum: [active, inactive]
    Employee:
      type: object
      required:
        - id
        - externalId
        - displayName
        - status
        - siteId
        - employmentStart
        - employmentEnd
        - source
        - currentScheduleId
        - activeCardId
        - activeCardLabel
        - createdAt
        - updatedAt
        - captureMethod
      properties:
        id:
          type: string
          format: uuid
        externalId:
          type: string
          description: Identificador de la persona en el origen. Único por empresa.
        displayName:
          type: string
        status:
          $ref: "#/components/schemas/EmployeeStatus"
        siteId:
          type: [string, "null"]
          format: uuid
        employmentStart:
          type: string
          format: date
        employmentEnd:
          type: [string, "null"]
          format: date
        source:
          type: string
          enum: [manual, csv, api, connector]
        currentScheduleId:
          type: [string, "null"]
          format: uuid
        activeCardId:
          type: [string, "null"]
          format: uuid
        activeCardLabel:
          type: [string, "null"]
          description: Etiqueta de la tarjeta vigente, para mostrarla sin leer la lista de tarjetas.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        captureMethod:
          $ref: "#/components/schemas/PersonCaptureMethod"
    EmployeeCreate:
      type: object
      additionalProperties: false
      required: [externalId, displayName, employmentStart]
      properties:
        externalId:
          type: string
          minLength: 1
          maxLength: 64
        displayName:
          type: string
          minLength: 1
          maxLength: 160
        siteId:
          type: [string, "null"]
          format: uuid
        employmentStart:
          type: string
          format: date
        captureMethod:
          $ref: "#/components/schemas/PersonCaptureMethod"
          description: >-
            Opcional. Si no viene, la tarjeta cuando la sede la admite y si no
            el teléfono. Una forma que el plan o la sede no admiten responde
            422 con `capture_method_not_allowed`.
    EmployeeUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 160
        siteId:
          type: [string, "null"]
          format: uuid
        status:
          $ref: "#/components/schemas/EmployeeStatus"
        employmentEnd:
          type: [string, "null"]
          format: date
        captureMethod:
          $ref: "#/components/schemas/PersonCaptureMethod"
          description: >-
            Cambiarla revoca lo de la otra forma: al pasar al teléfono, su
            tarjeta vigente; al pasar a la tarjeta, sus teléfonos personales.
            Queda en la bitácora (`employee.capture_method_changed`). Una
            forma que el plan o la sede no admiten responde 422 con
            `capture_method_not_allowed`; cambiar a una sede que no admite la
            forma de la persona, también.
    EmployeeSummary:
      type: object
      additionalProperties: false
      required: [total, active, inactive, withoutCard, withoutSchedule, bySchedule]
      properties:
        total:
          type: integer
        active:
          type: integer
        inactive:
          type: integer
        withoutCard:
          type: integer
        withoutSchedule:
          type: integer
        bySchedule:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [scheduleId, people]
            properties:
              scheduleId:
                type: string
                format: uuid
              people:
                type: integer
    EmployeeList:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Employee"
        nextCursor:
          $ref: "#/components/schemas/NextCursor"

    Import:
      type: object
      required: [id, status, dryRun, templateVersion, counts, errors, manifestHash, fileName, createdBy, createdByName, reviewedImportId, appliedByImportId, createdAt]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [validating, ready, applied, failed]
        dryRun:
          type: boolean
        templateVersion:
          type: integer
        counts:
          type: object
          required: [total, accepted, rejected, created, updated, unchanged]
          description: |
            `created`, `updated` y `unchanged` reparten las filas aceptadas:
            altas, personas cuyo nombre, sede o fecha de ingreso cambia y
            personas que ya estaban igual. En una revisión anticipan lo que
            haría aplicarla con el padrón de ese momento. Son nulos en las
            importaciones anteriores a 0.29.0.
          properties:
            total:
              type: integer
            accepted:
              type: integer
            rejected:
              type: integer
            created:
              type: [integer, "null"]
              minimum: 0
            updated:
              type: [integer, "null"]
              minimum: 0
            unchanged:
              type: [integer, "null"]
              minimum: 0
        errors:
          type: array
          description: Filas rechazadas, con su causa.
          items:
            $ref: "#/components/schemas/ImportRowError"
        manifestHash:
          oneOf:
            - $ref: "#/components/schemas/Sha256Hex"
            - type: "null"
        fileName:
          type: [string, "null"]
          maxLength: 255
          description: Nombre del archivo que se subió, sin ruta; nulo en las importaciones anteriores a 0.21.0.
        createdBy:
          type: [string, "null"]
          format: uuid
          description: Persona de la empresa que lo subió.
        createdByName:
          type: [string, "null"]
        reviewedImportId:
          type: [string, "null"]
          format: uuid
          description: Revisión que esta importación aplicó, si se aplicó desde el historial.
        appliedByImportId:
          type: [string, "null"]
          format: uuid
          description: En una revisión, la importación que la aplicó; nulo mientras no se aplica.
        createdAt:
          type: string
          format: date-time
    ImportList:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Import"
        nextCursor:
          $ref: "#/components/schemas/NextCursor"
    ImportRowError:
      type: object
      required: [row, externalId, code, message]
      properties:
        row:
          type: integer
          minimum: 1
        externalId:
          type: [string, "null"]
        code:
          type: string
        message:
          type: string

    CardStatus:
      type: string
      enum: [inventory, assigned, active, revoked, lost, damaged, replaced]
    CardTechnology:
      type: string
      enum: [manual, mifare_classic_signed]
      description: >-
        `manual`: la huella se escribió a mano al registrarla (tarjeta
        simulada o sin firma). `mifare_classic_signed`: tarjeta del piloto,
        preparada por una terminal con un código firmado.
    Card:
      type: object
      required: [id, label, status, keyVersion, technology, assignment, latestAssignment, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        label:
          type: string
          description: Número impreso en la tarjeta.
        status:
          $ref: "#/components/schemas/CardStatus"
        keyVersion:
          type: [integer, "null"]
        technology:
          $ref: "#/components/schemas/CardTechnology"
        assignment:
          description: Quien la tiene hoy.
          oneOf:
            - type: object
              required: [employeeId, employeeName, employeeExternalId, since]
              properties:
                employeeId:
                  type: string
                  format: uuid
                employeeName:
                  type: string
                employeeExternalId:
                  type: string
                since:
                  type: string
                  format: date-time
            - type: "null"
        latestAssignment:
          description: >-
            Quien la tuvo por última vez, también si ya no está asignada
            (perdida, dañada, revocada o reemplazada); `until` es nulo si sigue
            asignada. Nula si nunca tuvo titular.
          oneOf:
            - type: object
              required: [employeeId, employeeName, employeeExternalId, since, until]
              properties:
                employeeId:
                  type: string
                  format: uuid
                employeeName:
                  type: string
                employeeExternalId:
                  type: string
                since:
                  type: string
                  format: date-time
                until:
                  type: [string, "null"]
                  format: date-time
            - type: "null"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CardDetail:
      allOf:
        - $ref: "#/components/schemas/Card"
        - type: object
          required: [registeredBy, assignments, lastRead, readCount]
          properties:
            registeredBy:
              oneOf:
                - type: object
                  required: [type, name]
                  properties:
                    type:
                      type: string
                      enum: [user, device]
                    name:
                      type: [string, "null"]
                      description: Nombre de la persona o de la terminal; nulo si ya no existe.
                - type: "null"
            assignments:
              type: array
              description: De la más reciente a la primera.
              items:
                type: object
                required: [employeeId, employeeName, employeeExternalId, since, until, replacedCardId]
                properties:
                  employeeId:
                    type: string
                    format: uuid
                  employeeName:
                    type: string
                  employeeExternalId:
                    type: string
                  since:
                    type: string
                    format: date-time
                  until:
                    type: [string, "null"]
                    format: date-time
                  replacedCardId:
                    type: [string, "null"]
                    format: uuid
                    description: La tarjeta que esta asignación reemplazó.
            lastRead:
              oneOf:
                - type: object
                  required: [observedAt, deviceId, deviceName]
                  properties:
                    observedAt:
                      type: string
                      format: date-time
                    deviceId:
                      type: string
                      format: uuid
                    deviceName:
                      type: string
                - type: "null"
            readCount:
              type: integer
              minimum: 0
              description: Cuántos marcajes se guardaron con la tarjeta.
    CardCreate:
      type: object
      additionalProperties: false
      required: [label, fingerprint]
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 40
        fingerprint:
          type: string
          minLength: 16
          maxLength: 128
          description: Huella criptográfica de la tarjeta. El UID público no basta como identidad.
    CardSummary:
      type: object
      additionalProperties: false
      required: [total, byStatus]
      properties:
        total:
          type: integer
        byStatus:
          type: object
          additionalProperties: false
          required: [inventory, assigned, active, lost, damaged, revoked, replaced]
          properties:
            inventory:
              type: integer
            assigned:
              type: integer
            active:
              type: integer
            lost:
              type: integer
            damaged:
              type: integer
            revoked:
              type: integer
            replaced:
              type: integer
    CardList:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Card"
        nextCursor:
          $ref: "#/components/schemas/NextCursor"
    CardAssignment:
      type: object
      required: [id, cardId, employeeId, since, until, replacedCardId]
      properties:
        id:
          type: string
          format: uuid
        cardId:
          type: string
          format: uuid
        employeeId:
          type: string
          format: uuid
        since:
          type: string
          format: date-time
        until:
          type: [string, "null"]
          format: date-time
        replacedCardId:
          type: [string, "null"]
          format: uuid
    CardAssignmentCreate:
      type: object
      additionalProperties: false
      required: [employeeId]
      properties:
        employeeId:
          type: string
          format: uuid
    CardRevocation:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          enum: [revoked, lost, damaged]
        note:
          type: string
          maxLength: 280

    DeviceMode:
      type: string
      enum: [personal, terminal]
      description: |
        `personal` es el teléfono de un trabajador y sólo acepta su tarjeta.
        `terminal` es un equipo compartido de una sede y acepta cualquier
        tarjeta activa de la empresa.
    DeviceStatus:
      type: string
      enum: [active, revoked, replaced]
    DeviceEnrollment:
      type: object
      required: [id, mode, employeeId, siteId, label, code, status, expiresAt, createdAt]
      properties:
        id:
          type: string
          format: uuid
        mode:
          $ref: "#/components/schemas/DeviceMode"
        employeeId:
          type: [string, "null"]
          format: uuid
        siteId:
          type: [string, "null"]
          format: uuid
        label:
          type: [string, "null"]
        code:
          type: string
          description: Código de un solo uso. Se muestra una vez.
        status:
          type: string
          enum: [pending, used, expired]
        expiresAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
    DeviceEnrollmentCreate:
      type: object
      additionalProperties: false
      required: [mode]
      properties:
        mode:
          $ref: "#/components/schemas/DeviceMode"
        employeeId:
          type: string
          format: uuid
          description: Obligatorio en `personal`.
        siteId:
          type: string
          format: uuid
          description: Obligatorio en `terminal`.
        label:
          type: string
          maxLength: 60
          description: Nombre para reconocer una terminal, por ejemplo «Recepción».
    PublicJwk:
      type: object
      additionalProperties: false
      required: [kty, crv, x, y]
      description: Clave pública del dispositivo en formato JWK, curva P-256.
      properties:
        kty:
          type: string
          const: EC
        crv:
          type: string
          const: P-256
        x:
          type: string
        y:
          type: string
    DeviceActivationRequest:
      type: object
      additionalProperties: false
      required: [enrollmentCode, publicKey, proof, device, screenLock]
      properties:
        enrollmentCode:
          type: string
          minLength: 6
          maxLength: 32
        publicKey:
          $ref: "#/components/schemas/PublicJwk"
        proof:
          $ref: "#/components/schemas/CompactJws"
          description: Firmado con la clave que se registra; su carga lleva `enrollmentCode`.
        device:
          type: object
          additionalProperties: false
          required: [manufacturer, model, androidSdk, appVersion]
          properties:
            manufacturer:
              type: string
              maxLength: 60
            model:
              type: string
              maxLength: 60
            androidSdk:
              type: integer
              minimum: 28
            appVersion:
              type: string
              maxLength: 20
        screenLock:
          type: boolean
          description: Si el dispositivo tiene bloqueo de pantalla. Es condición para enrolar.
        integrityToken:
          type: string
          description: Señal de integridad de la plataforma, cuando exista.
    DeviceActivation:
      type: object
      required: [deviceId, mode, tenant, employee, site, audience, session]
      properties:
        deviceId:
          type: string
          format: uuid
        mode:
          $ref: "#/components/schemas/DeviceMode"
        tenant:
          type: object
          required: [name, timeZone]
          properties:
            name:
              type: string
            timeZone:
              type: string
        employee:
          oneOf:
            - type: object
              required: [id, displayName]
              properties:
                id:
                  type: string
                  format: uuid
                displayName:
                  type: string
            - type: "null"
          description: Presente en `personal`.
        site:
          oneOf:
            - $ref: "#/components/schemas/SiteSummary"
            - type: "null"
          description: Presente en `terminal`.
        audience:
          type: string
          description: Valor que el dispositivo pone en `aud` de sus aserciones.
        session:
          $ref: "#/components/schemas/DeviceSession"
    SiteSummary:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    DeviceSessionCreate:
      type: object
      additionalProperties: false
      required: [appVersion]
      properties:
        appVersion:
          type: string
          maxLength: 20
    DeviceSession:
      type: object
      required: [sessionId, startedAt, serverTime, tokenMaxAgeSeconds, locationReuseSeconds, breakPolicy, upcomingBreakPolicy, offlinePolicy, pilotCards]
      properties:
        sessionId:
          type: string
          format: uuid
        startedAt:
          type: string
          format: date-time
        serverTime:
          type: string
          format: date-time
        breakPolicy:
          $ref: "#/components/schemas/BreakPolicy"
          description: La que vale al abrir la sesión. Le dice a la app si debe ofrecer el marcaje de descanso.
        upcomingBreakPolicy:
          oneOf:
            - $ref: "#/components/schemas/UpcomingBreakPolicy"
            - type: "null"
          description: |
            El cambio programado que todavía no entra. La app avisa a la persona
            y, desde `effectiveAt`, usa esa política aunque no tenga red.
        tokenMaxAgeSeconds:
          type: integer
          description: Vida máxima de una aserción del dispositivo.
        locationReuseSeconds:
          type: integer
          description: |
            Tiempo durante el que una terminal puede reutilizar una muestra de
            ubicación para lecturas seguidas. En `personal` vale 0.
        offlinePolicy:
          type: object
          required: [maxAgeHours, maxEvents]
          properties:
            maxAgeHours:
              type: integer
            maxEvents:
              type: integer
        pilotCards:
          description: |
            Lo que el dispositivo necesita para leer las tarjetas del piloto.
            Nulo si el ambiente no las acepta.
          oneOf:
            - type: object
              required: [scheme, keyVersion, sectorKey, verificationKey]
              properties:
                scheme:
                  type: string
                  enum: [mifare_classic_signed]
                keyVersion:
                  type: integer
                  description: Versión de la clave con la que se firman hoy las tarjetas.
                sectorKey:
                  type: string
                  pattern: "^[0-9a-f]{12}$"
                  description: |
                    Clave A y B de los sectores de las tarjetas de la empresa, en
                    hexadecimal. Impide leerlas o borrarlas con una app de
                    celular; no detiene un ataque a la Classic.
                verificationKey:
                  type: string
                  description: Clave pública P-256 en X.509 (base64), para comprobar la firma sin red.
            - type: "null"
    PilotCardIssue:
      type: object
      additionalProperties: false
      required: [uid]
      properties:
        uid:
          type: string
          pattern: "^([0-9a-fA-F]{8}|[0-9a-fA-F]{14}|[0-9a-fA-F]{20})$"
          description: Identificador de la tarjeta, de 4, 7 o 10 bytes, en hexadecimal.
    PilotCardCredential:
      type: object
      required: [uid, keyVersion, token, signature]
      properties:
        uid:
          type: string
          description: El identificador en minúsculas.
        keyVersion:
          type: integer
        token:
          type: string
          pattern: "^[0-9a-f]{32}$"
          description: Código aleatorio de 16 bytes, en hexadecimal.
        signature:
          type: string
          description: Firma de 64 bytes en base64url sin relleno.
    PilotCardRegistration:
      type: object
      additionalProperties: false
      required: [uid, keyVersion, token, signature]
      properties:
        uid:
          type: string
          pattern: "^([0-9a-fA-F]{8}|[0-9a-fA-F]{14}|[0-9a-fA-F]{20})$"
        keyVersion:
          type: integer
        token:
          type: string
          pattern: "^[0-9a-fA-F]{32}$"
        signature:
          type: string
    Device:
      type: object
      required:
        - id
        - mode
        - status
        - employeeId
        - employeeName
        - siteId
        - label
        - model
        - appVersion
        - enrolledAt
        - lastSeenAt
        - revokedAt
      properties:
        id:
          type: string
          format: uuid
        mode:
          $ref: "#/components/schemas/DeviceMode"
        status:
          $ref: "#/components/schemas/DeviceStatus"
        employeeId:
          type: [string, "null"]
          format: uuid
        employeeName:
          type: [string, "null"]
          description: Nombre de la persona de un teléfono personal; nulo en una terminal de sede.
        siteId:
          type: [string, "null"]
          format: uuid
        label:
          type: [string, "null"]
        model:
          type: string
        appVersion:
          type: string
        enrolledAt:
          type: string
          format: date-time
        lastSeenAt:
          type: [string, "null"]
          format: date-time
        revokedAt:
          type: [string, "null"]
          format: date-time
    DeviceSummary:
      type: object
      additionalProperties: false
      required: [active, silent, revoked, replaced]
      properties:
        active:
          type: integer
        silent:
          type: integer
          description: Activos sin contacto en las últimas 24 horas o que nunca se conectaron.
        revoked:
          type: integer
        replaced:
          type: integer
    DeviceList:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Device"
        nextCursor:
          $ref: "#/components/schemas/NextCursor"
    DeviceRevocation:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 5
          maxLength: 280

    EventType:
      type: string
      enum: [clock_in, clock_out, break_start, break_end]
      description: |
        `break_start` y `break_end` sólo existen en empresas que marcan el
        descanso. En las demás el servidor fija siempre entrada o salida.
    LocationVerdict:
      type: string
      enum: [inside, outside, inconclusive, not_evaluated, device_site]
      description: |
        `inconclusive` cuando la precisión declarada es mayor que el radio de
        la sede. No se interpreta como fuera: abre una incidencia.

        `device_site` (desde 0.34.0): marcó en el lector fijo de una sede sin
        ubicación, o con una menos precisa que el radio. Cuenta en esa sede y
        no abre incidencia. Un cliente que no lo conozca lo trata como
        `not_evaluated`.
    AttendanceEventSubmission:
      type: object
      additionalProperties: false
      required: [envelope]
      properties:
        envelope:
          $ref: "#/components/schemas/CompactJws"
          description: |
            Sobre firmado por el dispositivo con ES256. Su encabezado lleva en
            `kid` el identificador del dispositivo y su carga es un
            `AttendanceEventPayload`.
          contentMediaType: application/jose
          contentSchema:
            $ref: "#/components/schemas/AttendanceEventPayload"
    AttendanceBatchSubmission:
      type: object
      additionalProperties: false
      required: [envelopes]
      properties:
        envelopes:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: "#/components/schemas/CompactJws"
    AttendanceEventPayload:
      type: object
      description: |
        Carga del sobre firmado. No viaja como JSON suelto: va dentro del JWS,
        de modo que el servidor conserva la evidencia tal como la firmó el
        dispositivo y puede volver a verificarla.
      additionalProperties: false
      required: [envelopeVersion, idempotencyKey, sessionId, sequence, observedAt, timeZone, card, location, app]
      properties:
        envelopeVersion:
          type: integer
          const: 1
        idempotencyKey:
          type: string
          format: uuid
          description: Igual al encabezado `Idempotency-Key` cuando se envía un solo marcaje.
        sessionId:
          type: string
          format: uuid
        sequence:
          type: integer
          minimum: 1
          description: Consecutivo dentro de la sesión.
        observedAt:
          type: string
          format: date-time
          description: Hora del dispositivo al leer la tarjeta.
        timeZone:
          type: string
          description: Zona IANA del dispositivo.
        elapsedRealtimeMs:
          type: integer
          description: Reloj monotónico del dispositivo, para detectar cambios de hora.
        declaredType:
          $ref: "#/components/schemas/EventType"
          description: Lo que la persona dijo estar marcando, si la app lo pregunta. El servidor decide el tipo final.
        card:
          type: object
          additionalProperties: false
          required: [scheme, proof]
          properties:
            scheme:
              type: string
              enum: [desfire_ev3_aes, mifare_classic_signed, uid_sha256]
              description: |
                `mifare_classic_signed` es la tarjeta del piloto: `proof` es
                `<uid>.<código>.<firma>` (los dos primeros en hexadecimal, la
                firma en base64url) y `keyVersion` es la versión de la clave
                con la que se firmó. El servidor comprueba la firma y busca la
                tarjeta registrada; se acepta sólo en un ambiente que enciende
                el piloto. Se puede clonar con equipo especial.
                `uid_sha256` es la señal no autenticada del prototipo y nunca
                basta para aceptar un marcaje con datos reales.
                El servidor sólo la acepta en un ambiente que la enciende a
                propósito, con datos ficticios; ahí `proof` es la huella con
                la que se registró la tarjeta. `desfire_ev3_aes` todavía no
                se verifica: se rechaza con `card_unknown`.
            proof:
              type: string
              description: Resultado de la autenticación de la tarjeta, en base64url.
            keyVersion:
              type: integer
        location:
          oneOf:
            - type: object
              additionalProperties: false
              required: [latitude, longitude, accuracyMeters, capturedAt]
              properties:
                latitude:
                  type: number
                longitude:
                  type: number
                accuracyMeters:
                  type: number
                capturedAt:
                  type: string
                  format: date-time
                provider:
                  type: string
                mock:
                  type: [boolean, "null"]
            - type: "null"
          description: Muestra tomada al marcar. Nula si no se pudo obtener.
        locationUnavailableReason:
          type: string
          enum: [permission_denied, disabled, timeout]
        integrityToken:
          type: string
        app:
          type: object
          additionalProperties: false
          required: [version]
          properties:
            version:
              type: string
    AttendanceReceipt:
      type: object
      required:
        - eventId
        - idempotencyKey
        - outcome
        - type
        - observedAt
        - receivedAt
        - employee
        - site
        - locationVerdict
        - incident
        - rejection
      properties:
        eventId:
          type: [string, "null"]
          format: uuid
          description: Nulo cuando el marcaje se rechaza y no se crea.
        idempotencyKey:
          type: string
          format: uuid
        outcome:
          type: string
          enum: [accepted, accepted_with_incident, rejected]
        type:
          oneOf:
            - $ref: "#/components/schemas/EventType"
            - type: "null"
        observedAt:
          type: string
          format: date-time
        receivedAt:
          type: string
          format: date-time
        employee:
          oneOf:
            - type: object
              required: [displayName]
              properties:
                displayName:
                  type: string
            - type: "null"
          description: Para que una terminal muestre a quién registró.
        site:
          oneOf:
            - $ref: "#/components/schemas/SiteSummary"
            - type: "null"
        locationVerdict:
          $ref: "#/components/schemas/LocationVerdict"
        incident:
          oneOf:
            - type: object
              required: [id, type]
              properties:
                id:
                  type: string
                  format: uuid
                type:
                  $ref: "#/components/schemas/IncidentType"
            - type: "null"
        rejection:
          oneOf:
            - type: object
              required: [code, message]
              properties:
                code:
                  type: string
                  enum:
                    - card_unknown
                    - card_revoked
                    - card_not_owner
                    - signature_invalid
                    - session_invalid
                    - payload_invalid
                    - too_old
                    - method_not_allowed
                message:
                  type: string
            - type: "null"
    AttendanceBatchResult:
      type: object
      required: [receipts]
      properties:
        receipts:
          type: array
          items:
            $ref: "#/components/schemas/AttendanceReceipt"
    AttendanceEvent:
      type: object
      required:
        - id
        - employeeId
        - siteId
        - deviceId
        - deviceMode
        - type
        - outcome
        - observedAt
        - receivedAt
        - delaySeconds
        - locationVerdict
        - accuracyMeters
        - incidentIds
        - payloadHash
      properties:
        id:
          type: string
          format: uuid
        employeeId:
          type: string
          format: uuid
        siteId:
          type: [string, "null"]
          format: uuid
        deviceId:
          type: string
          format: uuid
        deviceMode:
          $ref: "#/components/schemas/DeviceMode"
        type:
          $ref: "#/components/schemas/EventType"
        outcome:
          type: string
          enum: [accepted, accepted_with_incident]
        observedAt:
          type: string
          format: date-time
        receivedAt:
          type: string
          format: date-time
        delaySeconds:
          type: integer
          description: Diferencia entre la hora observada y la de recepción.
        locationVerdict:
          $ref: "#/components/schemas/LocationVerdict"
        accuracyMeters:
          type: [number, "null"]
        incidentIds:
          type: array
          items:
            type: string
            format: uuid
        payloadHash:
          $ref: "#/components/schemas/Sha256Hex"
    AttendanceEventList:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AttendanceEvent"
        nextCursor:
          $ref: "#/components/schemas/NextCursor"

    RuleSetRef:
      type: object
      required: [id, version]
      properties:
        id:
          type: string
          format: uuid
        version:
          type: integer
    WeekTotals:
      type: object
      required: [workedMinutes, breakMinutes, ordinaryMinutes, overtimeMinutes]
      properties:
        workedMinutes:
          type: integer
        breakMinutes:
          type: integer
        ordinaryMinutes:
          type: integer
        overtimeMinutes:
          type: integer
          description: Tiempo extraordinario por exceso diario según clasificación diurna/nocturna/mixta y por exceso semanal, sin contar dos veces los mismos minutos.
    DayTotals:
      type: object
      additionalProperties: false
      required: [date, workedMinutes, breakMinutes, ordinaryMinutes, overtimeMinutes]
      description: >-
        Un día de la semana: la fecha en que empezó la jornada, en la zona
        horaria de la empresa, con lo que sumaron sus tramos. Un turno que
        cruza la medianoche cuenta en el día en que empezó. Lo ordinario y lo
        extraordinario salen del mismo reparto que `totals`: la suma de los
        días, campo por campo, es la semana. Sólo vienen los días con algún
        tramo, aunque sea abierto o un descanso.
      properties:
        date:
          type: string
          format: date
        workedMinutes:
          type: integer
        breakMinutes:
          type: integer
        ordinaryMinutes:
          type: integer
        overtimeMinutes:
          type: integer
          description: Extraordinario de ese día, por su máximo diario o porque ya se llenó el tope semanal.
    WorkSegment:
      type: object
      required: [id, kind, startAt, endAt, minutes, startEventId, endEventId, version]
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [work, break]
        startAt:
          type: string
          format: date-time
        endAt:
          type: [string, "null"]
          format: date-time
          description: Nulo mientras falte el marcaje que lo cierra.
        minutes:
          type: integer
          description: Cero mientras el tramo esté abierto.
        startEventId:
          type: string
          format: uuid
          description: >-
            Marcaje que abre el tramo. Si lo agregó un ajuste, es el
            identificador de ese ajuste y no existe en la lista de marcajes.
        endEventId:
          type: [string, "null"]
          format: uuid
          description: Marcaje que lo cierra, con la misma salvedad.
        version:
          type: integer
          description: Uno más el número de ajustes aplicados a la semana.
    AttendanceAlert:
      type: object
      required: [code, severity, message]
      properties:
        code:
          type: string
          description: >-
            `open_segment`, `daily_combined_limit_exceeded`, `daily_ordinary_limit_exceeded`,
            `daily_overtime_limit_exceeded`, `overtime_days_limit_exceeded`,
            `break_computability_unverified`, `weekly_overtime`,
            `weekly_overtime_limit_exceeded` o `weekly_total_overtime_limit_exceeded`. Pueden agregarse más: un
            cliente debe tolerar un código que no conoce.
        severity:
          type: string
          enum: [info, warning, critical]
        message:
          type: string
    WeekAttendance:
      type: object
      required: [employeeId, weekStart, timeZone, ruleSet, segments, totals, alerts, days, openIncidentIds, closure]
      properties:
        employeeId:
          type: string
          format: uuid
        weekStart:
          type: string
          format: date
        timeZone:
          type: string
        ruleSet:
          $ref: "#/components/schemas/RuleSetRef"
        segments:
          type: array
          items:
            $ref: "#/components/schemas/WorkSegment"
        totals:
          $ref: "#/components/schemas/WeekTotals"
        alerts:
          type: array
          items:
            $ref: "#/components/schemas/AttendanceAlert"
        days:
          description: Nulo en una semana cerrada antes del contrato 0.26.0, que no los guardó.
          oneOf:
            - type: array
              items:
                $ref: "#/components/schemas/DayTotals"
            - type: "null"
        openIncidentIds:
          type: array
          items:
            type: string
            format: uuid
        acknowledgement:
          description: Acuse del cierre vigente, incluso si se emitió desde otro dispositivo. Nulo si no existe o el cierre está reabierto.
          oneOf:
            - $ref: "#/components/schemas/Acknowledgement"
            - type: "null"
        closure:
          oneOf:
            - type: object
              required: [id, version, status]
              properties:
                id:
                  type: string
                  format: uuid
                version:
                  type: integer
                status:
                  $ref: "#/components/schemas/WeekClosureStatus"
            - type: "null"
    AttendanceToday:
      type: object
      additionalProperties: false
      required: [state, since, lastMarkAt]
      properties:
        state:
          type: string
          enum: [on_shift, on_break, off_shift, no_entry]
          description: >-
            `on_shift` y `on_break`: tiene abierto un tramo de trabajo o de
            descanso que empezó hace menos de la separación entre turnos.
            `off_shift`: hoy marcó y no tiene tramo abierto. `no_entry`: hoy
            no ha marcado.
        since:
          type: [string, "null"]
          format: date-time
          description: Inicio del tramo abierto; nulo si no hay.
        lastMarkAt:
          type: [string, "null"]
          format: date-time
          description: Hora del último marcaje de hoy; nulo si no hay.
    AttendanceWeekRow:
      type: object
      additionalProperties: false
      required: [employeeId, externalId, displayName, siteId, scheduleId, ruleSet, totals, alerts, openIncidents, closure, today, workedDays, overtimeDays]
      properties:
        employeeId:
          type: string
          format: uuid
        externalId:
          type: string
        displayName:
          type: string
        siteId:
          type: [string, "null"]
          format: uuid
        scheduleId:
          type: [string, "null"]
          format: uuid
          description: Horario vigente hoy si la semana lo contiene; si no, el de su último día.
        ruleSet:
          $ref: "#/components/schemas/RuleSetRef"
        totals:
          $ref: "#/components/schemas/WeekTotals"
        alerts:
          type: array
          items:
            $ref: "#/components/schemas/AttendanceAlert"
        openIncidents:
          type: array
          description: Incidencias abiertas cuyo marcaje cae en la semana.
          items:
            type: object
            additionalProperties: false
            required: [id, type]
            properties:
              id:
                type: string
                format: uuid
              type:
                $ref: "#/components/schemas/IncidentType"
        closure:
          oneOf:
            - type: object
              additionalProperties: false
              required: [id, version, status]
              properties:
                id:
                  type: string
                  format: uuid
                version:
                  type: integer
                status:
                  $ref: "#/components/schemas/WeekClosureStatus"
            - type: "null"
        today:
          oneOf:
            - $ref: "#/components/schemas/AttendanceToday"
            - type: "null"
        workedDays:
          type: [integer, "null"]
          description: Días de la semana con tiempo trabajado; nulo en un cierre anterior a 0.26.0.
        overtimeDays:
          type: [integer, "null"]
          description: >-
            Días con tiempo extraordinario, el número que limita
            `overtimeMaxDays` de las reglas; nulo en un cierre anterior a 0.26.0.
    AttendanceWeekList:
      type: object
      additionalProperties: false
      required: [weekStart, timeZone, items, nextCursor]
      properties:
        weekStart:
          type: string
          format: date
        timeZone:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/AttendanceWeekRow"
        nextCursor:
          $ref: "#/components/schemas/NextCursor"
    AttendanceSummary:
      type: object
      additionalProperties: false
      required: [date, weekStart, timeZone, siteId, people, day, week, incidents, previousWeek, devices, mostHours]
      properties:
        date:
          type: string
          format: date
        weekStart:
          type: string
          format: date
        timeZone:
          type: string
        siteId:
          type: [string, "null"]
          format: uuid
        people:
          type: integer
          description: Personas que entran a la semana, las mismas filas de `listAttendanceWeeks`.
        day:
          type: object
          additionalProperties: false
          required: [marked, attendanceEvents, onShift, noEntry, foreignSite]
          properties:
            marked:
              type: integer
              description: Personas con al menos un marcaje ese día.
            attendanceEvents:
              type: integer
              description: Marcajes de esas personas ese día.
            onShift:
              type: [integer, "null"]
            noEntry:
              type: [integer, "null"]
            foreignSite:
              type: integer
        week:
          type: object
          additionalProperties: false
          required: [ordinaryMinutes, overtimeMinutes, withOvertime, withAttention, missingExit]
          properties:
            ordinaryMinutes:
              type: integer
            overtimeMinutes:
              type: integer
            withOvertime:
              type: integer
            withAttention:
              type: integer
              description: Personas que filtra `attention=alerts`.
            missingExit:
              type: integer
        incidents:
          type: object
          additionalProperties: false
          required: [open, highSeverity, unassigned]
          description: Incidencias abiertas de cualquier semana, con el alcance de `listIncidents`.
          properties:
            open:
              type: integer
            highSeverity:
              type: integer
            unassigned:
              type: integer
        previousWeek:
          type: object
          additionalProperties: false
          required: [weekStart, people, closed, agreed, objected]
          properties:
            weekStart:
              type: string
              format: date
            people:
              type: integer
            closed:
              type: integer
              description: Personas con un cierre vigente de esa semana.
            agreed:
              type: integer
            objected:
              type: integer
              description: Los cierres sin acuse son `closed - agreed - objected`.
        devices:
          oneOf:
            - type: object
              additionalProperties: false
              required: [active, silent]
              properties:
                active:
                  type: integer
                silent:
                  type: integer
            - type: "null"
        mostHours:
          type: array
          maxItems: 5
          description: Quienes más horas llevan en la semana, de más a menos.
          items:
            type: object
            additionalProperties: false
            required: [employeeId, displayName, siteId, ordinaryMinutes, overtimeMinutes]
            properties:
              employeeId:
                type: string
                format: uuid
              displayName:
                type: string
              siteId:
                type: [string, "null"]
                format: uuid
              ordinaryMinutes:
                type: integer
              overtimeMinutes:
                type: integer

    IncidentType:
      type: string
      enum:
        - duplicate
        - missing_pair
        - outside_window
        - location_inconclusive
        - clock_anomaly
        - foreign_site
        - late_sync
    IncidentStatus:
      type: string
      enum: [open, resolved]
    Adjustment:
      type: object
      additionalProperties: false
      required: [kind]
      description: Intención de corrección. No reemplaza el marcaje original.
      properties:
        kind:
          type: string
          enum: [add_event, exclude_event, retype_event]
        eventId:
          type: string
          format: uuid
          description: Marcaje afectado, en `exclude_event` y `retype_event`.
        eventType:
          $ref: "#/components/schemas/EventType"
        occurredAt:
          type: string
          format: date-time
          description: Hora del marcaje que se agrega, en `add_event`.
    IncidentResolutionInput:
      type: object
      additionalProperties: false
      required: [decision, reason]
      properties:
        decision:
          type: string
          enum: [justified, confirmed, adjusted]
        reason:
          type: string
          minLength: 10
          maxLength: 500
        adjustment:
          $ref: "#/components/schemas/Adjustment"
    IncidentResolution:
      type: object
      required: [decision, reason, adjustment, resolvedBy, resolvedByName, resolvedAt]
      properties:
        resolvedByName:
          type: [string, "null"]
          description: Nombre de quien la resolvió; nulo si su cuenta no tiene nombre.
        decision:
          type: string
          enum: [justified, confirmed, adjusted]
        reason:
          type: string
        adjustment:
          oneOf:
            - $ref: "#/components/schemas/Adjustment"
            - type: "null"
        resolvedBy:
          type: string
          format: uuid
        resolvedAt:
          type: string
          format: date-time
    IncidentUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        assigneeUserId:
          type: [string, "null"]
          format: uuid
        resolution:
          $ref: "#/components/schemas/IncidentResolutionInput"
    Incident:
      type: object
      required:
        - id
        - type
        - severity
        - status
        - employeeId
        - employeeName
        - employeeExternalId
        - siteId
        - eventIds
        - occurredAt
        - openedAt
        - assigneeUserId
        - assigneeName
        - assignedAt
        - assignedBy
        - assignedByName
        - blocksClosure
        - resolution
      description: >-
        Los nombres viajan en la incidencia para que RH, Supervisión y
        Auditoría vean quién la atiende sin leer `/users`. Un nombre es nulo
        si esa cuenta no tiene nombre todavía.
      properties:
        id:
          type: string
          format: uuid
        type:
          $ref: "#/components/schemas/IncidentType"
        severity:
          type: string
          enum: [low, medium, high]
        status:
          $ref: "#/components/schemas/IncidentStatus"
        employeeId:
          type: [string, "null"]
          format: uuid
        employeeName:
          type: string
        employeeExternalId:
          type: string
          description: Número de la persona en el sistema de nómina de la empresa.
        siteId:
          type: [string, "null"]
          format: uuid
        eventIds:
          type: array
          items:
            type: string
            format: uuid
        occurredAt:
          type: string
          format: date-time
          description: Hora del marcaje que la abrió, como la registró el dispositivo.
        openedAt:
          type: string
          format: date-time
        assigneeUserId:
          type: [string, "null"]
          format: uuid
        assigneeName:
          type: [string, "null"]
        assignedAt:
          type: [string, "null"]
          format: date-time
          description: Cuándo se asignó a quien la tiene; nulo si no está asignada.
        assignedBy:
          type: [string, "null"]
          format: uuid
          description: Quién la asignó; nulo si no está asignada.
        assignedByName:
          type: [string, "null"]
        blocksClosure:
          type: boolean
          description: >-
            Abierta, de una semana ya terminada que esa persona no tiene
            cerrada: mientras siga así, su cierre queda bloqueado.
        resolution:
          oneOf:
            - $ref: "#/components/schemas/IncidentResolution"
            - type: "null"
    IncidentList:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Incident"
        nextCursor:
          $ref: "#/components/schemas/NextCursor"
    IncidentSummary:
      type: object
      additionalProperties: false
      required: [weekStart, open, resolved]
      properties:
        weekStart:
          type: string
          format: date
          description: Inicio de la semana en curso de la empresa, desde el que cuenta `resolved.thisWeek`.
        open:
          type: object
          additionalProperties: false
          required: [total, unassigned, mine, high, medium, low, blockingClosure]
          properties:
            total:
              type: integer
            unassigned:
              type: integer
            mine:
              type: integer
              description: Asignadas a quien llama.
            high:
              type: integer
            medium:
              type: integer
            low:
              type: integer
            blockingClosure:
              type: integer
              description: Abiertas con `blocksClosure` verdadero.
        resolved:
          type: object
          additionalProperties: false
          required: [total, thisWeek]
          properties:
            total:
              type: integer
            thisWeek:
              type: integer
    IncidentAssignee:
      type: object
      additionalProperties: false
      required: [id, displayName, roles]
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: [string, "null"]
          description: Nulo si la cuenta no tiene nombre todavía.
        roles:
          type: array
          items:
            $ref: "#/components/schemas/TenantRole"
    IncidentAssigneeList:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/IncidentAssignee"
        nextCursor:
          $ref: "#/components/schemas/NextCursor"

    WeekClosureStatus:
      type: string
      enum: [closed, reopened]
    WeekClosure:
      type: object
      required:
        - id
        - employeeId
        - employeeName
        - employeeExternalId
        - weekStart
        - version
        - status
        - ruleSet
        - totals
        - hash
        - closedAt
        - closedBy
        - closedByName
        - acknowledgement
      properties:
        id:
          type: string
          format: uuid
        employeeId:
          type: string
          format: uuid
        employeeName:
          type: string
        employeeExternalId:
          type: string
        closedByName:
          type: [string, "null"]
          description: Nombre de quien lo cerró; nulo si lo cerró el cierre programado o su cuenta no tiene nombre.
        weekStart:
          type: string
          format: date
        version:
          type: integer
        status:
          $ref: "#/components/schemas/WeekClosureStatus"
        ruleSet:
          $ref: "#/components/schemas/RuleSetRef"
        totals:
          $ref: "#/components/schemas/WeekTotals"
        hash:
          $ref: "#/components/schemas/Sha256Hex"
        closedAt:
          type: string
          format: date-time
        closedBy:
          type: [string, "null"]
          format: uuid
          description: Quien lo cerró; nulo si lo cerró el cierre programado.
        acknowledgement:
          oneOf:
            - $ref: "#/components/schemas/Acknowledgement"
            - type: "null"
    WeekClosureCreate:
      type: object
      additionalProperties: false
      required: [weekStart]
      properties:
        weekStart:
          type: string
          format: date
        siteId:
          type: string
          format: uuid
          description: Limita el cierre a una sede.
        employeeIds:
          type: array
          maxItems: 500
          items:
            type: string
            format: uuid
    WeekClosureResult:
      type: object
      required: [weekStart, closed, blocked]
      properties:
        weekStart:
          type: string
          format: date
        closed:
          type: array
          items:
            $ref: "#/components/schemas/WeekClosure"
        blocked:
          type: array
          items:
            $ref: "#/components/schemas/BlockedClosure"
    BlockedClosure:
      type: object
      description: Persona que no se pudo cerrar y por qué.
      required: [employeeId, reason, incidentIds]
      properties:
        employeeId:
          type: string
          format: uuid
        reason:
          type: string
          enum: [open_incidents, open_segment]
        incidentIds:
          type: array
          description: >-
            Con `open_incidents`, las incidencias abiertas de esa semana. Con
            `open_segment`, la que se acaba de abrir sobre el tramo sin
            cerrar; vacía si el tramo lo inició un ajuste.
          items:
            type: string
            format: uuid
    BlockedClosureList:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/BlockedClosure"
        nextCursor:
          $ref: "#/components/schemas/NextCursor"
    WeekClosureSummary:
      type: object
      additionalProperties: false
      required: [weekStart, closed, reopened, blocked, acknowledgements]
      properties:
        weekStart:
          type: string
          format: date
        closed:
          type: integer
        reopened:
          type: integer
        blocked:
          type: integer
          description: Personas con al menos una incidencia que bloquea su cierre.
        acknowledgements:
          type: object
          additionalProperties: false
          required: [agreed, objected, none]
          properties:
            agreed:
              type: integer
            objected:
              type: integer
            none:
              type: integer
    WeekClosureList:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/WeekClosure"
        nextCursor:
          $ref: "#/components/schemas/NextCursor"
    WeekClosureRunCreate:
      type: object
      additionalProperties: false
      required: [weekStart]
      properties:
        weekStart:
          type: string
          format: date
        siteId:
          type: string
          format: uuid
          description: Limita la corrida a una sede.
    WeekClosureRun:
      type: object
      required:
        - id
        - weekStart
        - siteId
        - origin
        - status
        - total
        - closed
        - blocked
        - requestedBy
        - requestedByName
        - failure
        - createdAt
        - startedAt
        - finishedAt
      properties:
        id:
          type: string
          format: uuid
        weekStart:
          type: string
          format: date
        siteId:
          type: [string, "null"]
          format: uuid
        origin:
          type: string
          enum: [requested, scheduled]
          description: >-
            `requested` si la pidió una persona; `scheduled` si la abrió el
            cierre programado.
        status:
          type: string
          enum: [queued, running, done, failed]
        total:
          type: [integer, "null"]
          description: Personas que entran a la corrida; nulo hasta que empieza.
        closed:
          type: integer
          description: Personas que quedaron con un cierre vigente, incluidas las que ya lo tenían.
        blocked:
          type: object
          description: Personas que no se cerraron, por motivo.
          required: [openIncidents, openSegment]
          properties:
            openIncidents:
              type: integer
            openSegment:
              type: integer
        requestedBy:
          type: [string, "null"]
          format: uuid
          description: Quien la pidió; nulo si la abrió el cierre programado.
        requestedByName:
          type: [string, "null"]
          description: Nombre de quien la pidió; nulo si la abrió el cierre programado o su cuenta no tiene nombre.
        failure:
          type: [string, "null"]
          description: Por qué no terminó; nulo si no falló.
        createdAt:
          type: string
          format: date-time
        startedAt:
          type: [string, "null"]
          format: date-time
        finishedAt:
          type: [string, "null"]
          format: date-time
    WeekClosureRunList:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/WeekClosureRun"
        nextCursor:
          $ref: "#/components/schemas/NextCursor"
    WeekClosureReopen:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 10
          maxLength: 500
    AcknowledgementCreate:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          type: string
          enum: [agreed, objected]
        note:
          type: string
          maxLength: 500
    Acknowledgement:
      type: object
      required: [id, closureId, type, note, at, evidenceHash]
      properties:
        id:
          type: string
          format: uuid
        closureId:
          type: string
          format: uuid
        type:
          type: string
          enum: [agreed, objected]
        note:
          type: [string, "null"]
        at:
          type: string
          format: date-time
        evidenceHash:
          $ref: "#/components/schemas/Sha256Hex"

    RuleSet:
      type: object
      required: [id, jurisdiction, version, validFrom, validTo, weeklyOrdinaryMaxMinutes, parameters, sources]
      properties:
        id:
          type: string
          format: uuid
        jurisdiction:
          type: string
        version:
          type: integer
        validFrom:
          type: string
          format: date
        validTo:
          type: [string, "null"]
          format: date
        weeklyOrdinaryMaxMinutes:
          type: integer
        parameters:
          type: object
          description: |
            Resto de los topes y bandas de esa vigencia, por nombre. Cada valor
            va como texto; el nombre dice su unidad.
          additionalProperties:
            type: string
        sources:
          type: array
          items:
            type: string
    RuleSetList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/RuleSet"

    ExportCreate:
      type: object
      additionalProperties: false
      required: [weekStart, format]
      properties:
        weekStart:
          type: string
          format: date
        siteId:
          type: string
          format: uuid
        format:
          type: string
          enum: [csv]
    Export:
      type: object
      required:
        - id
        - status
        - weekStart
        - siteId
        - format
        - timeZone
        - ruleSetVersion
        - rowCount
        - manifestHash
        - fileHash
        - downloadUrl
        - expiresAt
        - createdAt
        - requestedBy
        - requestedByName
        - downloadedAt
        - downloadedBy
        - downloadedByName
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [queued, ready, failed, expired]
          description: >-
            `queued` mientras se prepara, `ready` cuando se puede descargar,
            `expired` cuando ya se descargó o venció, y `failed` cuando no se
            pudo preparar.
        weekStart:
          type: string
          format: date
        siteId:
          type: [string, "null"]
          format: uuid
        format:
          type: string
          enum: [csv]
        timeZone:
          type: string
        ruleSetVersion:
          type: integer
          description: Versión de reglas vigente en esa semana; cada fila del archivo trae la de su cierre.
        rowCount:
          type: [integer, "null"]
          description: Cierres que entraron al archivo; nulo mientras no está preparado.
        manifestHash:
          oneOf:
            - $ref: "#/components/schemas/Sha256Hex"
            - type: "null"
        fileHash:
          oneOf:
            - $ref: "#/components/schemas/Sha256Hex"
            - type: "null"
        downloadUrl:
          type: [string, "null"]
          format: uri-reference
          description: >-
            Ruta de `downloadExport`, relativa al servidor del API. Nula si no
            hay nada que descargar.
        expiresAt:
          type: [string, "null"]
          format: date-time
          description: Hasta cuándo se puede descargar; nulo si no hay nada que descargar.
        createdAt:
          type: string
          format: date-time
        requestedBy:
          type: [string, "null"]
          format: uuid
          description: Persona de la empresa que lo pidió.
        requestedByName:
          type: [string, "null"]
        downloadedAt:
          type: [string, "null"]
          format: date-time
          description: Cuándo se descargó; nulo mientras no se descarga.
        downloadedBy:
          type: [string, "null"]
          format: uuid
        downloadedByName:
          type: [string, "null"]
    ExportList:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Export"
        nextCursor:
          $ref: "#/components/schemas/NextCursor"

    ExportManifest:
      type: object
      description: >-
        Lo que un exporte declara de sí mismo. Se guarda una vez, al preparar
        el archivo, y no cambia.
      required:
        - exportId
        - templateVersion
        - format
        - tenant
        - weekStart
        - timeZone
        - siteId
        - rowCount
        - fileSha256
        - closures
        - generatedAt
      properties:
        exportId:
          type: string
          format: uuid
        templateVersion:
          type: integer
          description: Versión de la plantilla del archivo.
        format:
          type: string
          enum: [csv]
        tenant:
          type: object
          required: [id, slug, name]
          properties:
            id:
              type: string
              format: uuid
            slug:
              type: string
            name:
              type: string
        weekStart:
          type: string
          format: date
        timeZone:
          type: string
        siteId:
          type: [string, "null"]
          format: uuid
        rowCount:
          type: integer
        fileSha256:
          $ref: "#/components/schemas/Sha256Hex"
          description: SHA-256 del archivo, byte por byte; el mismo valor que `fileHash` del exporte.
        closures:
          type: array
          description: Un elemento por fila del archivo, en el mismo orden.
          items:
            type: object
            required: [closureId, employeeId, version, ruleSetVersion, hash]
            properties:
              closureId:
                type: string
                format: uuid
              employeeId:
                type: string
                format: uuid
              version:
                type: integer
              ruleSetVersion:
                type: integer
              hash:
                $ref: "#/components/schemas/Sha256Hex"
        generatedAt:
          type: string
          format: date-time

    AuditEntry:
      type: object
      required: [id, at, actor, action, target, correlationId, metadata]
      properties:
        id:
          type: string
          format: uuid
        at:
          type: string
          format: date-time
        actor:
          type: object
          required: [type, id, displayName]
          properties:
            type:
              type: string
              enum: [user, device, system]
            id:
              type: [string, "null"]
              format: uuid
            displayName:
              type: [string, "null"]
              description: >-
                Nombre de la persona o etiqueta del dispositivo; nulo para el
                sistema, para quien opera el servicio o si no tiene nombre.
        action:
          type: string
        target:
          type: object
          required: [type, id, displayName]
          properties:
            type:
              type: string
            id:
              type: [string, "null"]
              format: uuid
            displayName:
              type: [string, "null"]
              description: >-
                Nombre de lo que se tocó: persona del padrón, usuario,
                tarjeta, dispositivo, sede u horario; una incidencia y un
                cierre, por la persona a la que pertenecen. Nulo para lo demás.
        correlationId:
          type: string
          format: uuid
        metadata:
          type: object
          description: Datos de contexto como texto, sin secretos ni cargas completas.
          additionalProperties:
            type: string
    AuditSummary:
      type: object
      additionalProperties: false
      required: [total, capped, cap]
      properties:
        total:
          type: integer
        capped:
          type: boolean
          description: Hay más de `total` acciones; la cuenta se detuvo en `cap`.
        cap:
          type: integer
    AuditEntryList:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AuditEntry"
        nextCursor:
          $ref: "#/components/schemas/NextCursor"

    IntegrationCheckpoint:
      type: object
      required: [sourceId, type, status, cursor, sourceVersion, updatedAt]
      properties:
        sourceId:
          type: string
          format: uuid
        type:
          type: string
          enum: [csv, api, connector]
        status:
          type: string
          enum: [active, paused, error]
        cursor:
          type: [string, "null"]
        sourceVersion:
          type: [string, "null"]
        updatedAt:
          type: string
          format: date-time
    IntegrationCheckpointList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/IntegrationCheckpoint"
