                id: a3c5e7b9-1d3f-4b5a-9c7e-1b3d5f7a9c1e
                email: rh@panificadora.example
                displayName: Persona de Recursos Humanos
                roles: [rh]
                status: invited
                createdAt: "2026-10-05T15:05:00Z"
                linkedAt: null
                employeeId: null
        "401":
