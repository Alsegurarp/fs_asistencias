      operationId: acknowledgeWeekClosure
      summary: Registra la conformidad o la objeción del trabajador con su cierre
      description: |
        Lo hace el propio trabajador, con su cuenta ligada al padrón o desde
        su dispositivo `personal`; una terminal no puede. Una vez por cierre:
        responde 409 con `code` `already_acknowledged` si ya tiene acuse, y con
        `closure_not_closed` si el cierre está reabierto. El cierre de otra
        persona responde 404.

        `evidenceHash` es el SHA-256 de la huella del cierre, el tipo, la
        nota, la hora y quién lo registró: liga el acuse con lo que se cerró.
      x-roles: [trabajador]
