        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /imports/csv:
    post:
      tags: [personas]
      operationId: importEmployeesCsv
      summary: Valida o aplica un archivo CSV del padrón
      description: |
        Con `dryRun` en verdadero sólo valida y devuelve qué filas entrarían.
        La importación es idempotente por origen e identificador externo:
        repetir el archivo no duplica a nadie y actualiza lo que cambió.

        Plantilla 1, con estos encabezados y en este orden:
        `external_id,display_name,employment_start,site_name`. La fecha va
        como AAAA-MM-DD. `site_name` puede ir vacío; si trae un nombre, debe
        ser el de una sola sede activa, sin distinguir mayúsculas.

        El archivo se procesa en la misma petición, hasta 1 MB y 5000 filas.
        La respuesta ya trae el resultado: `ready` si sólo se validó,
        `applied` si se aplicó, o `failed` si el archivo no es la plantilla o
        no está en UTF-8; en ese caso no entra ninguna fila. Las filas
        aceptadas se aplican aunque otras se rechacen. `row` es el número de
        línea del archivo, con los encabezados en la línea 1. `manifestHash`
        resume las filas aceptadas: coincide entre validar y aplicar el mismo
        archivo.

        La misma `Idempotency-Key` con el mismo archivo y el mismo `dryRun`
        devuelve el resultado anterior sin volver a aplicar. Con otro
        contenido responde 409 con `code` `idempotency_conflict`: aplicar
        después de validar lleva una clave nueva.

        Se guarda el nombre del archivo (`fileName`, sin ruta), nunca su
        contenido. Para aplicar una revisión anterior se vuelve a subir el
        archivo con `dryRun` en falso y `reviewedImportId`: el servidor sólo
        compara su huella con la de la revisión. Responde 409 con
        `review_mismatch` si el archivo no es el mismo, `review_already_applied`
        si esa revisión ya se aplicó y `review_not_applicable` si no es una
        revisión lista; 422 con `requires_apply` si llega con `dryRun` en
        verdadero o `import_not_found` si no existe.
      x-roles: [admin_empresa, rh]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: CSV en UTF-8 con los encabezados de la plantilla vigente.
                dryRun:
                  type: boolean
                  default: true
                reviewedImportId:
                  type: string
                  format: uuid
                  description: Revisión anterior que este archivo aplica.
      responses:
        "202":
          description: Importación aceptada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Import"
              example:
                id: b7d9f1a3-5c7e-4a9b-8d1f-3a5c7e9b1d3f
