                createdBy: a3c5e7b9-1d3f-4b5a-9c7e-1b3d5f7a9c1e
                createdByName: Rocío Navarro
                reviewedImportId: null
                appliedByImportId: null
                createdAt: "2026-10-05T15:40:00Z"
        "401":
