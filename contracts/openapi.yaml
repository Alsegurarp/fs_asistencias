    post:
      tags: [credenciales]
      operationId: assignCard
      summary: Asigna una tarjeta a una persona
      description: |
        Si la persona ya tiene una tarjeta, la operación cierra esa asignación,
        marca la tarjeta anterior como reemplazada y activa la nueva en la
        misma transacción. Una tarjeta revocada no vuelve a asignarse.

        Sólo se asigna una tarjeta en `inventory`: una que ya tuvo titular no
        pasa a otra persona. La tarjeta queda `active`; el estado `assigned`
        no se usa todavía. Responde 409 con `code` `card_not_assignable` si la
        tarjeta no está en inventario, o `employee_inactive` si la persona
        está dada de baja.
      x-roles: [admin_empresa, rh]
      requestBody:
        required: true
        content:
