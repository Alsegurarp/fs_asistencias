    patch:
      tags: [jornada]
      operationId: updateIncident
      summary: Asigna o resuelve una incidencia
      description: |
        Resolver exige una decisión y un motivo. Un ajuste no edita el marcaje:
        agrega una intención y produce una versión nueva del cálculo.

        `assigneeUserId` asigna la incidencia a una persona con acceso vigente
        a la empresa, y en nulo quita la asignación. `adjustment` sólo va con
        la decisión `adjusted`, y cada clase trae lo suyo y nada más:
        `add_event` lleva `eventType` y `occurredAt`; `exclude_event` lleva
        `eventId`; `retype_event` lleva `eventId` y `eventType`. El marcaje
        tiene que ser de la misma persona de la incidencia.

        Responde 409 con `code` `incident_already_resolved` si ya estaba
        resuelta: lo resuelto no se reasigna ni se vuelve a decidir. Responde
        409 con `code` `week_closed` si el ajuste cae en una semana cerrada de
        esa persona: primero se reabre.
      x-roles: [admin_empresa, rh, supervisor]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IncidentUpdate"
            example:
              resolution:
                decision: justified
                reason: El teléfono estuvo sin señal durante el turno.
      responses:
