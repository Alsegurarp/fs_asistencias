        id:
          type: string
          format: uuid
        name:
          type: string
        timeZone:
          type: string
        validFrom:
          type: string
          format: date
        validTo:
          type: [string, "null"]
          format: date
        days:
          type: array
          items:
            $ref: "#/components/schemas/ScheduleDay"
        createdAt:
          type: string
          format: date-time
    ScheduleCreate:
      type: object
      additionalProperties: false
      required: [name, timeZone, validFrom, days]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        timeZone:
          type: string
        validFrom:
          type: string
          format: date
        validTo:
          type: [string, "null"]
          format: date
        days:
          type: array
          minItems: 1
          maxItems: 7
          items:
            $ref: "#/components/schemas/ScheduleDay"
    ScheduleList:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Schedule"
        nextCursor:
          $ref: "#/components/schemas/NextCursor"
    ScheduleAssignment:
      type: object
      required: [id, employeeId, scheduleId, validFrom, validTo]
      properties:
        id:
          type: string
          format: uuid
        employeeId:
          type: string
          format: uuid
        scheduleId:
          type: string
          format: uuid
        validFrom:
          type: string
          format: date
        validTo:
          type: [string, "null"]
          format: date
    ScheduleAssignmentCreate:
      type: object
      additionalProperties: false
      required: [scheduleId, validFrom]
      properties:
        scheduleId:
          type: string
          format: uuid
        validFrom:
          type: string
          format: date

    EmployeeStatus:
