          schema:
            type: string
            format: date-time
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Página de marcajes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceEventList"
              example:
                items:
                  - id: 8b0d2f4a-6c8e-4a0c-9e2b-4d6f8a0c2e4b
                    employeeId: 5a7c9e1b-3d5f-4b6a-8c0e-2a4c6e8b0d12
                    siteId: 3b1f9a52-6c0d-4e7a-8f21-9d4c5b6a7e80
                    deviceId: 1c3e5a7b-9d0f-4a2c-8e4b-6d8f0a2c4e6b
                    deviceMode: personal
                    type: clock_in
                    outcome: accepted
                    observedAt: "2026-10-05T13:00:00Z"
                    receivedAt: "2026-10-05T13:00:01Z"
                    delaySeconds: 1
                    locationVerdict: inside
                    accuracyMeters: 12
                    incidentIds: []
                    payloadHash: 6f2c1d0e9b8a7f6e5d4c3b2a1f0e9d8c7b6a5f4e3d2c1b0a9f8e7d6c5b4a3f2e
                nextCursor: null
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Unprocessable"
    post:
      tags: [captura]
      operationId: submitAttendanceEvent
      summary: Registra un marcaje
      description: |
        El cuerpo lleva el sobre firmado por el dispositivo. La empresa, el
        dispositivo y la modalidad salen de la credencial, no del sobre.

        Responde 201 cuando el marcaje queda guardado y 200 cuando se repite
        una clave de idempotencia ya procesada o cuando la credencial se
        rechaza. Un rechazo viene con recibo y no se reintenta: no es un fallo
        de transporte.

        La cabecera `Idempotency-Key` debe ser la misma clave que va firmada
        en el sobre; si no coinciden responde 422. La misma clave con otro
        sobre responde 409 con `code` `idempotency_conflict`.

        Tipo de marcaje, mientras el equipo no decida otra cosa: sin
        `declaredType`, el servidor lo deduce de la marca anterior de la
        persona; un `declaredType` válido lo corrige. Una marca que no cuadra
        con la anterior se guarda con incidencia `missing_pair`, y dos
        lecturas de la misma persona en menos de un minuto son una sola, con
        incidencia `duplicate`. Pasadas 16 horas sin marcar, la siguiente
        abre una jornada nueva.

        Ubicación: una terminal se evalúa contra su sede y un teléfono
        personal contra la sede de su titular. Fuera de la geocerca abre
        `foreign_site`; una muestra menos precisa que el radio, simulada o
        ausente abre `location_inconclusive`. Quien marca en una terminal de
        otra sede abre `foreign_site`. Un marcaje que llega más de 24 horas
        después abre `late_sync`, y más de 72 horas después se rechaza con
        `too_old`. También abre `late_sync` el que llega cuando la semana de
        esa persona ya está cerrada: se guarda, pero el cierre no cambia solo.
        `card_revoked` cubre también a la persona dada de baja.
      security:
        - deviceToken: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttendanceEventSubmission"
            example:
              envelope: eyJhbGciOiJFUzI1NiIsImtpZCI6IjFjM2U1YTdiIn0.eyJpZGVtcG90ZW5jeUtleSI6ImVqZW1wbG8ifQ.ZmlybWEtZGUtZWplbXBsby1uby12YWxpZGE
      responses:
        "200":
          description: Marcaje repetido o rechazado, con su recibo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceReceipt"
              example:
                eventId: null
                idempotencyKey: 2d4f6a8c-0e2b-4d6f-8a0c-2e4b6d8f0a2c
                outcome: rejected
                type: null
                observedAt: "2026-10-05T13:00:00Z"
                receivedAt: "2026-10-05T13:00:01Z"
                employee: null
                site: null
                locationVerdict: not_evaluated
                incident: null
                rejection:
                  code: card_not_owner
                  message: La tarjeta no pertenece a quien tiene este dispositivo.
        "201":
          description: Marcaje guardado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceReceipt"
              example:
                eventId: 8b0d2f4a-6c8e-4a0c-9e2b-4d6f8a0c2e4b
                idempotencyKey: 2d4f6a8c-0e2b-4d6f-8a0c-2e4b6d8f0a2c
                outcome: accepted
                type: clock_in
                observedAt: "2026-10-05T13:00:00Z"
                receivedAt: "2026-10-05T13:00:01Z"
                employee:
                  displayName: Persona de Ejemplo Uno
                site:
                  id: 3b1f9a52-6c0d-4e7a-8f21-9d4c5b6a7e80
                  name: Sucursal Centro
                locationVerdict: inside
                incident: null
                rejection: null
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /attendance-events/batch:
    post:
      tags: [captura]
      operationId: submitAttendanceBatch
      summary: Envía los marcajes guardados sin conexión
      description: |
        Cada sobre se procesa por separado y devuelve su propio recibo, en el
        mismo orden. El servidor conserva la hora observada y agrega la de
        recepción; nunca mueve un marcaje en silencio.

        En un lote no hay 409: una clave repetida con otro contenido vuelve
        como rechazo `payload_invalid`. Un sobre que no se puede leer no trae
        clave que devolver: su recibo lleva la clave en ceros.
      security:
        - deviceToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttendanceBatchSubmission"
            example:
              envelopes:
                - eyJhbGciOiJFUzI1NiIsImtpZCI6IjFjM2U1YTdiIn0.eyJpZGVtcG90ZW5jeUtleSI6ImVqZW1wbG8ifQ.ZmlybWEtZGUtZWplbXBsby1uby12YWxpZGE
      responses:
        "200":
          description: Un recibo por sobre
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceBatchResult"
              example:
                receipts:
                  - eventId: 3c5e7a9c-1e3a-4c5e-9a1c-3e5a7c9e1a3c
                    idempotencyKey: 9a1c3e5a-7c9e-4a1c-8e3a-5c7e9a1c3e5a
                    outcome: accepted_with_incident
                    type: clock_out
                    observedAt: "2026-10-05T21:00:00Z"
                    receivedAt: "2026-10-06T12:55:03Z"
                    employee:
                      displayName: Persona de Ejemplo Uno
                    site:
                      id: 3b1f9a52-6c0d-4e7a-8f21-9d4c5b6a7e80
                      name: Sucursal Centro
                    locationVerdict: inconclusive
                    incident:
                      id: 6e8a0c2e-4b6d-4f8a-8c0e-2b4d6f8a0c2e
                      type: late_sync
                    rejection: null
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /me/attendance:
    get:
      tags: [jornada]
      operationId: getMyWeek
      summary: Devuelve la semana de quien consulta
      description: |
        La usa el trabajador en el portal o desde un dispositivo `personal`.
        Un dispositivo `terminal` no puede consultarla. En el portal, la
