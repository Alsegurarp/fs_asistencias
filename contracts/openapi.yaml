        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Unprocessable"
    post:
      tags: [exportes]
      operationId: createExport
      summary: Solicita el exporte de una semana cerrada
      description: |
        Sólo exporta cierres vigentes: quien no está cerrado esa semana no
        entra al archivo. Pedirlo lo deja en `queued`; lo prepara un trabajo y
        hay que consultar `getExport` hasta verlo en `ready` o en `failed`.

        `weekStart` admite cualquier fecha de la semana. `siteId` lo limita a
        las personas de una sede. Responde 422 con el error `no_closed_weeks`
        si esa semana, o esa sede, no tiene ningún cierre vigente.

        La misma `Idempotency-Key` devuelve el mismo exporte; con otro
        contenido responde 409 con `code` `idempotency_conflict`.

        Plantilla 1 del archivo: CSV en UTF-8 con marca de orden de bytes,
        para que una hoja de cálculo lea bien los acentos, y fin de línea
        CRLF. Una fila por cierre, ordenadas por identificador externo, con
        estas columnas: `tenant_slug`, `week_start`, `time_zone`,
        `rule_set_jurisdiction`, `rule_set_version`, `external_id`,
        `display_name`, `site_name`, `closure_version`, `worked_minutes`,
        `break_minutes`, `ordinary_minutes`, `overtime_minutes`,
        `acknowledgement`, `closed_at` y `closure_hash`. Cada fila declara así
        empresa, periodo, zona horaria, versión de reglas y la huella del
        cierre del que salió. El texto va entre comillas; a la celda que
        empieza con `=`, `+`, `-`, `@`, tabulador o salto de línea se le
        antepone un apóstrofo, para que una hoja de cálculo no la ejecute
        como fórmula.
