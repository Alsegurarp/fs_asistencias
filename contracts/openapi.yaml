                      version: 1
                    totals:
                      workedMinutes: 2400
                      breakMinutes: 150
                      ordinaryMinutes: 2400
                      overtimeMinutes: 0
                    hash: 1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a6b7c8d9e0f1a2b
                    closedAt: "2026-10-12T16:00:00Z"
                    closedBy: a3c5e7b9-1d3f-4b5a-9c7e-1b3d5f7a9c1e
                    acknowledgement: null
                blocked: []
        "401":
