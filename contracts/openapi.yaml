                effectiveOn: "2026-12-07"
                effectiveAt: "2026-12-07T06:00:00Z"
                reason: La empresa pidió dejar de registrar la comida desde la siguiente quincena.
                scheduledAt: "2026-11-10T17:00:00Z"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/BreakPolicyChangePending"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /tenants/{tenantId}/break-policy-changes/{changeId}/cancellation:
    parameters:
