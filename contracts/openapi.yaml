  /rule-sets:
    get:
      tags: [jornada]
      operationId: listRuleSets
      summary: Lista las versiones de reglas laborales con su vigencia
      description: |
        Los topes son filas con vigencia y fuente, no constantes. El ejemplo
        sólo ilustra la forma: los valores vigentes salen de la tabla. No son
        de una empresa: valen para todas, y sólo se leen.

        Sin `effectiveOn` devuelve todas, de la más antigua a la más reciente.
        Con `effectiveOn` devuelve la vigente en esa fecha, o ninguna si no
        hay reglas registradas para ella. La semana usa los parámetros
        `weeklyOvertimeMaxMinutes` y `dailyCombinedMaxMinutes` para sus
        alertas; los demás quedan registrados para cuando el cálculo distinga
        el tipo de jornada.
      x-roles: [admin_empresa, rh, supervisor, auditor]
      parameters:
        - name: effectiveOn
          in: query
          description: Devuelve sólo la versión vigente en esa fecha.
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Versiones de reglas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuleSetList"
              example:
                items:
                  - id: f9b1d3f5-7a9c-4e1b-8d3f-5a7c9e1b3d5f
                    jurisdiction: MX-LFT
                    version: 1
                    validFrom: "2026-01-01"
                    validTo: "2026-12-31"
                    weeklyOrdinaryMaxMinutes: 2880
                    parameters:
                      weeklyOvertimeMaxMinutes: "540"
                      dailyCombinedMaxMinutes: "720"
                    sources:
                      - Ley Federal del Trabajo, texto vigente
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
