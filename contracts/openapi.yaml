    post:
      tags: [captura]
      operationId: activateDevice
      summary: Canjea el código y registra la clave pública del dispositivo
      description: |
        No lleva credencial: la autoriza el código de un solo uso. `proof`
        demuestra que el dispositivo posee la clave privada. En `personal`,
        activar un dispositivo cierra el anterior de la misma persona.

        Un código que no existe, ya se usó o venció responde 410 con `code`
        `enrollment_gone`, sin decir cuál. Responde 422 si falta el bloqueo de
        pantalla (`screen_lock_required`), si la prueba no está firmada con
        esa clave o no corresponde al código (`invalid_proof`), o si la clave
        ya pertenece a otro dispositivo (`key_already_registered`). Tras
        varios intentos fallidos seguidos desde la misma dirección responde
        429.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceActivationRequest"
            example:
              enrollmentCode: K7M2-9QXD
              publicKey:
                kty: EC
                crv: P-256
                x: f83OJ3D2xF1Bg8vub9tLe1gHMzV76e8Tus9uPHvRVEU
                y: x_FEzRu9m36HLN_tue659LNpXW6pCyStikYjKIWI5a0
              proof: eyJhbGciOiJFUzI1NiJ9.eyJlbnJvbGxtZW50Q29kZSI6Iks3TTItOVFYRCJ9.ZmlybWEtZGUtZWplbXBsby1uby12YWxpZGE
              device:
