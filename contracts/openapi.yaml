  /audit-log:
    get:
      tags: [auditoria]
      operationId: listAuditEntries
      summary: Lista las acciones registradas en la bitácora
      description: |
        Lo más reciente primero. `actor.displayName` y `target.displayName`
        traen los nombres para mostrar, leídos en lote con la página. Toda
        incidencia que se abre queda como `incident.opened`: con actor
        `system` si la detectó la captura, o con quien cerró la semana si
        salió al cerrar.

        Los filtros se aplican en el servidor, antes de paginar. `group` agrupa
        las acciones por su prefijo: `closures` (`week.*`), `incidents`
        (`incident.*`), `directory` (`employee.*`, `schedule.*`, `import.*`),
        `devices` (`card.*`, `device.*`), `access` (`user.*` y los permisos de
        expediente), `settings` (`tenant.*`, `site.*`) y `exports`
        (`export.*` y lo demás de `dossier.*`). `actorId` filtra por una
        persona o dispositivo; `targetType` con `targetId`, por la persona u
        objeto que se tocó.
      x-roles: [admin_empresa, auditor]
      parameters:
        - $ref: "#/components/parameters/AuditAction"
        - $ref: "#/components/parameters/AuditGroup"
        - $ref: "#/components/parameters/AuditActorType"
        - $ref: "#/components/parameters/AuditActorId"
        - $ref: "#/components/parameters/AuditTargetType"
        - $ref: "#/components/parameters/AuditTargetId"
        - $ref: "#/components/parameters/AuditFrom"
        - $ref: "#/components/parameters/AuditTo"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
