  /tenants/{tenantId}/suspension:
    parameters:
      - $ref: "#/components/parameters/TenantId"
    post:
      tags: [empresa]
      operationId: suspendTenant
      summary: Suspende una empresa
      description: |
        Bloquea administración y cierres: sus personas dejan de tener roles
        de empresa y sus códigos de enrolamiento dejan de canjearse. Los
        dispositivos activos ya vinculados conservan sesiones y captura/
        sincronización; no consulta personal ni acuses durante la suspensión.
        El cierre programado
        deja de pasar y una corrida de cierre pendiente termina como fallida.
        No borra ni cambia nada más: al reactivarla, todo sigue como estaba.

        Es una de las tres operaciones que reciben la empresa en la dirección:
        las de quien opera el servicio, que no pertenece a ninguna. Queda en
        la bitácora de la empresa, con el motivo.

        Responde 409 con `code` `tenant_not_active` si ya está suspendida.
      x-roles: [operador_saas]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TenantStatusChange"
            example:
              reason: Falta de pago del periodo de octubre.
      responses:
        "200":
          description: Empresa suspendida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
              example:
                id: 7d0c2b7e-51f4-4a0e-9d5b-2f6a1c3e8b10
