  /week-closure-runs/{runId}/blocked:
    parameters:
      - $ref: "#/components/parameters/RunId"
    get:
      tags: [jornada]
      operationId: listWeekClosureRunBlocked
      summary: Lista las personas bloqueadas y sus causas en una corrida
      description: |
        Detalle registrado al intentar cerrar a cada persona, ordenado por
        fecha de registro e identificador. Incluye resultados de corridas
        parciales o fallidas. Un reintento de la misma corrida actualiza el
        motivo y retira a quien ya pudo cerrar. Los conteos de avance se
        actualizan por tandas, por lo que pueden retrasarse respecto al detalle.

        Al terminar la corrida el detalle se conserva aunque después se
        resuelvan sus incidencias o se cierre la semana en otra corrida.
        Las corridas anteriores a esta función no tienen detalle registrado;
        sus conteos se conservan y esta lista puede estar vacía.
      x-roles: [admin_empresa, rh, supervisor, auditor]
      parameters:
