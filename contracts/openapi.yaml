    post:
      tags: [jornada]
      operationId: closeWeek
      summary: Cierra una semana
      description: |
        Congela el cálculo de cada persona con la versión de reglas vigente.
        Quien tenga incidencias abiertas o un tramo sin cerrar no se cierra y
        aparece en `blocked`, con el motivo. A quien tiene un tramo sin cerrar
        y ninguna incidencia abierta se le abre una `missing_pair` sobre el
        marcaje que inició ese tramo, y `incidentIds` la trae: así hay algo
        que resolver, agregando la salida que faltó o excluyendo la entrada.

        `weekStart` admite cualquier fecha de la semana. Sin `siteId` ni
        `employeeIds` entran las personas activas de la empresa y las que
        marcaron esa semana; quien no marcó se cierra en ceros. Con más de 500
        personas hay que pedir una corrida con `requestWeekClosureRun`, o
        cerrar por sede o por lista.

        Es repetible: quien ya tiene un cierre vigente aparece en `closed` con
        ese mismo cierre y no se crea otro. `hash` es el SHA-256 del cálculo
        congelado, tal como quedó guardado.

        Responde 422 con el error `week_not_finished` si la semana todavía no
        termina en la zona horaria de la empresa.
      x-roles: [admin_empresa, rh]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WeekClosureCreate"
            example:
              weekStart: "2026-10-05"
      responses:
