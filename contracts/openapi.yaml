components:
  securitySchemes:
    userToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Token de acceso de una persona, emitido por el proveedor de identidad.
        La API deriva de él la empresa y los roles.
    deviceToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Aserción firmada por el propio dispositivo con su clave privada, ES256.
        `iss` y `sub` llevan el identificador del dispositivo, `aud` el valor
        de `audience` recibido al activar, y vive como máximo
        `tokenMaxAgeSeconds`. El servidor la verifica con la clave pública
        registrada al activar y deriva de ella empresa, dispositivo y
        modalidad.

  parameters:
    Cursor:
      name: cursor
      in: query
      description: Valor de `nextCursor` de la página anterior.
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Week:
      name: week
      in: query
      required: true
      description: Cualquier fecha de la semana. El servidor la ajusta al inicio de semana de la empresa.
      schema:
        type: string
        format: date
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: La misma clave nunca crea dos resultados.
      schema:
        type: string
        format: uuid
    SiteId:
      name: siteId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ScheduleId:
      name: scheduleId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    EmployeeId:
      name: employeeId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ImportId:
      name: importId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CardId:
      name: cardId
