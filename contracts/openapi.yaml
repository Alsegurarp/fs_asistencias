openapi: 3.1.0
info:
  title: Zenit API
  version: 0.2.0
  description: |
    Contrato del MVP de Zenit. Es la frontera entre el backend y sus canales:
    el portal web y la app Android. Describe el recorrido completo, aunque el
    backend todavía sólo implementa `/system/status`.

    Convenciones:

    - Identificadores UUID. Instantes en RFC 3339 y UTC; fechas locales como
      `date`; duraciones en minutos.
    - La empresa se deriva de la credencial, nunca del cuerpo ni de la ruta.
      Un recurso de otra empresa responde 404.
    - Errores en `application/problem+json` (RFC 9457) con `code` estable y
      `correlationId`.
    - Listas paginadas por cursor: `cursor` y `limit` en la consulta,
      `nextCursor` en la respuesta.
    - Los nombres de rol son los del producto: `operador-saas`,
      `admin-empresa`, `rh`, `supervisor`, `trabajador`, `auditor` y
      `conector`. Cada operación declara los suyos en `x-roles`.
    - Todos los ejemplos son ficticios.

    Fuera de esta versión: administración de usuarios y roles, que depende
    del proveedor de identidad; entrega del material de clave de las tarjetas
    al dispositivo, que depende de la prueba con tarjetas reales; y la
    sincronización por conector.
servers:
  - url: /api/v1
tags:
  - name: sistema
    description: Estado del servicio.
  - name: identidad
    description: Quién llama y con qué permisos.
  - name: empresa
    description: Empresa, sedes con su geocerca y horarios.
  - name: personas
    description: Padrón de personas, asignación de horario e importación.
  - name: credenciales
    description: Tarjetas, enrolamiento y dispositivos.
  - name: captura
    description: Operaciones que usa la app para marcar.
  - name: jornada
    description: Marcajes, jornada calculada, incidencias, cierres y reglas.
  - name: exportes
    description: Exportación de cierres.
  - name: auditoria
    description: Bitácora de acciones administrativas.
  - name: integraciones
    description: Estado de las fuentes del padrón.
security:
  - userToken: []
paths:
  /system/status:
    get:
      tags: [sistema]
      operationId: getSystemStatus
      summary: Informa el estado básico de la API
      security: []
      responses:
        "200":
          description: API disponible
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemStatus"
              example:
                service: zenit-backend
                status: ok
                version: 0.1.0
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /me:
    get:
      tags: [identidad]
      operationId: getCurrentUser
      summary: Devuelve la persona autenticada, su empresa y sus roles
      x-roles: [operador-saas, admin-empresa, rh, supervisor, trabajador, auditor]
      responses:
        "200":
          description: Sesión vigente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
              example:
                userId: a3c5e7b9-1d3f-4b5a-9c7e-1b3d5f7a9c1e
                displayName: Persona de Recursos Humanos
                roles: [rh]
                tenant:
                  id: 7d0c2b7e-51f4-4a0e-9d5b-2f6a1c3e8b10
                  name: Panificadora Ejemplo
                  timeZone: America/Mexico_City
                  weekStartsOn: monday
                employeeId: null
        "401":
          $ref: "#/components/responses/Unauthorized"

  /tenants:
    get:
      tags: [empresa]
      operationId: listTenants
      summary: Lista las empresas dadas de alta
      x-roles: [operador-saas]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Página de empresas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantList"
              example:
                items:
                  - id: 7d0c2b7e-51f4-4a0e-9d5b-2f6a1c3e8b10
                    name: Panificadora Ejemplo
                    slug: panificadora-ejemplo
                    timeZone: America/Mexico_City
                    weekStartsOn: monday
                    status: active
                    createdAt: "2026-10-05T15:00:00Z"
                nextCursor: null
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [empresa]
      operationId: createTenant
      summary: Da de alta una empresa
      x-roles: [operador-saas]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TenantCreate"
            example:
              name: Panificadora Ejemplo
              slug: panificadora-ejemplo
              timeZone: America/Mexico_City
              weekStartsOn: monday
      responses:
        "201":
          description: Empresa creada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
              example:
                id: 7d0c2b7e-51f4-4a0e-9d5b-2f6a1c3e8b10
                name: Panificadora Ejemplo
                slug: panificadora-ejemplo
                timeZone: America/Mexico_City
                weekStartsOn: monday
                status: active
                createdAt: "2026-10-05T15:00:00Z"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /tenant:
    get:
      tags: [empresa]
      operationId: getTenant
      summary: Devuelve la empresa de quien llama
      x-roles: [admin-empresa, rh, supervisor, auditor]
      responses:
        "200":
          description: Empresa actual
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
              example:
                id: 7d0c2b7e-51f4-4a0e-9d5b-2f6a1c3e8b10
                name: Panificadora Ejemplo
                slug: panificadora-ejemplo
                timeZone: America/Mexico_City
                weekStartsOn: monday
                status: active
                createdAt: "2026-10-05T15:00:00Z"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    patch:
      tags: [empresa]
      operationId: updateTenant
      summary: Cambia nombre, zona horaria o inicio de semana de la empresa
      x-roles: [admin-empresa]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TenantUpdate"
            example:
              weekStartsOn: sunday
      responses:
        "200":
          description: Empresa actualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
              example:
                id: 7d0c2b7e-51f4-4a0e-9d5b-2f6a1c3e8b10
                name: Panificadora Ejemplo
                slug: panificadora-ejemplo
                timeZone: America/Mexico_City
                weekStartsOn: sunday
                status: active
                createdAt: "2026-10-05T15:00:00Z"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /sites:
    get:
      tags: [empresa]
      operationId: listSites
      summary: Lista las sedes de la empresa
      x-roles: [admin-empresa, rh, supervisor, auditor]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Página de sedes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteList"
              example:
                items:
                  - id: 3b1f9a52-6c0d-4e7a-8f21-9d4c5b6a7e80
                    name: Sucursal Centro
                    timeZone: America/Mexico_City
                    latitude: 19.432608
                    longitude: -99.133209
                    radiusMeters: 80
                    status: active
                    createdAt: "2026-10-05T15:10:00Z"
                nextCursor: null
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [empresa]
      operationId: createSite
      summary: Crea una sede con su geocerca circular
      x-roles: [admin-empresa]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SiteCreate"
            example:
              name: Sucursal Centro
              timeZone: America/Mexico_City
              latitude: 19.432608
              longitude: -99.133209
              radiusMeters: 80
      responses:
        "201":
          description: Sede creada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Site"
              example:
                id: 3b1f9a52-6c0d-4e7a-8f21-9d4c5b6a7e80
                name: Sucursal Centro
                timeZone: America/Mexico_City
                latitude: 19.432608
                longitude: -99.133209
                radiusMeters: 80
                status: active
                createdAt: "2026-10-05T15:10:00Z"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /sites/{siteId}:
    parameters:
      - $ref: "#/components/parameters/SiteId"
    get:
      tags: [empresa]
      operationId: getSite
      summary: Devuelve una sede
      x-roles: [admin-empresa, rh, supervisor, auditor]
      responses:
        "200":
          description: Sede
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Site"
              example:
                id: 3b1f9a52-6c0d-4e7a-8f21-9d4c5b6a7e80
                name: Sucursal Centro
                timeZone: America/Mexico_City
                latitude: 19.432608
                longitude: -99.133209
                radiusMeters: 80
                status: active
                createdAt: "2026-10-05T15:10:00Z"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [empresa]
      operationId: updateSite
      summary: Cambia una sede o la desactiva
      x-roles: [admin-empresa]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SiteUpdate"
            example:
              radiusMeters: 120
      responses:
        "200":
          description: Sede actualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Site"
              example:
                id: 3b1f9a52-6c0d-4e7a-8f21-9d4c5b6a7e80
                name: Sucursal Centro
                timeZone: America/Mexico_City
                latitude: 19.432608
                longitude: -99.133209
                radiusMeters: 120
                status: active
                createdAt: "2026-10-05T15:10:00Z"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /schedules:
    get:
      tags: [empresa]
      operationId: listSchedules
      summary: Lista los horarios de la empresa
      x-roles: [admin-empresa, rh, supervisor, auditor]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Página de horarios
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleList"
              example:
                items:
                  - id: c2e4a6b8-1d3f-4a5c-9e7b-0f2d4c6e8a10
                    name: Turno matutino
                    timeZone: America/Mexico_City
                    validFrom: "2026-10-05"
                    validTo: null
                    days:
                      - dayOfWeek: monday
                        startTime: "07:00"
                        endTime: "15:00"
                        breakMinutes: 30
                    createdAt: "2026-10-05T15:20:00Z"
                nextCursor: null
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [empresa]
      operationId: createSchedule
      summary: Crea un horario con vigencia
      description: Un horario no se edita. Para cambiarlo se crea otro con una vigencia nueva.
      x-roles: [admin-empresa, rh]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduleCreate"
            example:
              name: Turno matutino
              timeZone: America/Mexico_City
              validFrom: "2026-10-05"
              days:
                - dayOfWeek: monday
                  startTime: "07:00"
                  endTime: "15:00"
                  breakMinutes: 30
      responses:
        "201":
          description: Horario creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Schedule"
              example:
                id: c2e4a6b8-1d3f-4a5c-9e7b-0f2d4c6e8a10
                name: Turno matutino
                timeZone: America/Mexico_City
                validFrom: "2026-10-05"
                validTo: null
                days:
                  - dayOfWeek: monday
                    startTime: "07:00"
                    endTime: "15:00"
                    breakMinutes: 30
                createdAt: "2026-10-05T15:20:00Z"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /schedules/{scheduleId}:
    parameters:
      - $ref: "#/components/parameters/ScheduleId"
    get:
      tags: [empresa]
      operationId: getSchedule
      summary: Devuelve un horario
      x-roles: [admin-empresa, rh, supervisor, auditor]
      responses:
        "200":
          description: Horario
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Schedule"
              example:
                id: c2e4a6b8-1d3f-4a5c-9e7b-0f2d4c6e8a10
                name: Turno matutino
                timeZone: America/Mexico_City
                validFrom: "2026-10-05"
                validTo: null
                days:
                  - dayOfWeek: monday
                    startTime: "07:00"
                    endTime: "15:00"
                    breakMinutes: 30
                createdAt: "2026-10-05T15:20:00Z"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /employees:
    get:
      tags: [personas]
      operationId: listEmployees
      summary: Lista el padrón de personas
      x-roles: [admin-empresa, rh, supervisor, auditor]
      parameters:
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/EmployeeStatus"
        - name: siteId
          in: query
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Página de personas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeList"
              example:
                items:
                  - id: 5a7c9e1b-3d5f-4b6a-8c0e-2a4c6e8b0d12
                    externalId: E-0001
                    displayName: Persona de Ejemplo Uno
                    status: active
                    siteId: 3b1f9a52-6c0d-4e7a-8f21-9d4c5b6a7e80
                    employmentStart: "2026-10-05"
                    employmentEnd: null
                    source: manual
                    currentScheduleId: c2e4a6b8-1d3f-4a5c-9e7b-0f2d4c6e8a10
                    activeCardId: 9e8d7c6b-5a4f-4e3d-8c2b-1a0f9e8d7c6b
                    createdAt: "2026-10-05T15:30:00Z"
                    updatedAt: "2026-10-05T15:30:00Z"
                nextCursor: null
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [personas]
      operationId: createEmployee
      summary: Da de alta una persona
      x-roles: [admin-empresa, rh]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmployeeCreate"
            example:
              externalId: E-0001
              displayName: Persona de Ejemplo Uno
              siteId: 3b1f9a52-6c0d-4e7a-8f21-9d4c5b6a7e80
              employmentStart: "2026-10-05"
      responses:
        "201":
          description: Persona creada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"
              example:
                id: 5a7c9e1b-3d5f-4b6a-8c0e-2a4c6e8b0d12
                externalId: E-0001
                displayName: Persona de Ejemplo Uno
                status: active
                siteId: 3b1f9a52-6c0d-4e7a-8f21-9d4c5b6a7e80
                employmentStart: "2026-10-05"
                employmentEnd: null
                source: manual
                currentScheduleId: null
                activeCardId: null
                createdAt: "2026-10-05T15:30:00Z"
                updatedAt: "2026-10-05T15:30:00Z"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /employees/{employeeId}:
    parameters:
      - $ref: "#/components/parameters/EmployeeId"
    get:
      tags: [personas]
      operationId: getEmployee
      summary: Devuelve una persona
      x-roles: [admin-empresa, rh, supervisor, auditor]
      responses:
        "200":
          description: Persona
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"
              example:
                id: 5a7c9e1b-3d5f-4b6a-8c0e-2a4c6e8b0d12
                externalId: E-0001
                displayName: Persona de Ejemplo Uno
                status: active
                siteId: 3b1f9a52-6c0d-4e7a-8f21-9d4c5b6a7e80
                employmentStart: "2026-10-05"
                employmentEnd: null
                source: manual
                currentScheduleId: c2e4a6b8-1d3f-4a5c-9e7b-0f2d4c6e8a10
                activeCardId: 9e8d7c6b-5a4f-4e3d-8c2b-1a0f9e8d7c6b
                createdAt: "2026-10-05T15:30:00Z"
                updatedAt: "2026-10-05T15:30:00Z"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [personas]
      operationId: updateEmployee
      summary: Cambia datos de una persona o registra su baja
      description: La baja es lógica. Nunca borra marcajes ni cierres.
      x-roles: [admin-empresa, rh]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmployeeUpdate"
            example:
              status: inactive
              employmentEnd: "2026-12-31"
      responses:
        "200":
          description: Persona actualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"
              example:
                id: 5a7c9e1b-3d5f-4b6a-8c0e-2a4c6e8b0d12
                externalId: E-0001
                displayName: Persona de Ejemplo Uno
                status: inactive
                siteId: 3b1f9a52-6c0d-4e7a-8f21-9d4c5b6a7e80
                employmentStart: "2026-10-05"
                employmentEnd: "2026-12-31"
                source: manual
                currentScheduleId: c2e4a6b8-1d3f-4a5c-9e7b-0f2d4c6e8a10
                activeCardId: null
                createdAt: "2026-10-05T15:30:00Z"
                updatedAt: "2026-12-31T23:00:00Z"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /employees/{employeeId}/schedule-assignments:
    parameters:
      - $ref: "#/components/parameters/EmployeeId"
    post:
      tags: [personas]
      operationId: assignSchedule
      summary: Asigna un horario a una persona desde una fecha
      description: Cierra la asignación anterior el día previo a `validFrom`.
      x-roles: [admin-empresa, rh]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduleAssignmentCreate"
            example:
              scheduleId: c2e4a6b8-1d3f-4a5c-9e7b-0f2d4c6e8a10
              validFrom: "2026-10-05"
      responses:
        "201":
          description: Asignación creada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleAssignment"
              example:
                id: 1f3b5d7f-9a1c-4e3b-8d5f-7a9c1e3b5d7f
                employeeId: 5a7c9e1b-3d5f-4b6a-8c0e-2a4c6e8b0d12
                scheduleId: c2e4a6b8-1d3f-4a5c-9e7b-0f2d4c6e8a10
                validFrom: "2026-10-05"
                validTo: null
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /employees/{employeeId}/attendance:
    parameters:
      - $ref: "#/components/parameters/EmployeeId"
    get:
      tags: [jornada]
      operationId: getEmployeeWeek
      summary: Devuelve la semana calculada de una persona
      x-roles: [admin-empresa, rh, supervisor, auditor]
      parameters:
        - $ref: "#/components/parameters/Week"
      responses:
        "200":
          description: Semana calculada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeekAttendance"
              example:
                employeeId: 5a7c9e1b-3d5f-4b6a-8c0e-2a4c6e8b0d12
                weekStart: "2026-10-05"
                timeZone: America/Mexico_City
                ruleSet:
                  id: f9b1d3f5-7a9c-4e1b-8d3f-5a7c9e1b3d5f
                  version: 1
                segments:
                  - id: 2a4c6e8a-0c2e-4a6c-8e0a-2c4e6a8c0e2a
                    kind: work
                    startAt: "2026-10-05T13:00:00Z"
                    endAt: "2026-10-05T21:00:00Z"
                    minutes: 480
                    startEventId: 8b0d2f4a-6c8e-4a0c-9e2b-4d6f8a0c2e4b
                    endEventId: 3c5e7a9c-1e3a-4c5e-9a1c-3e5a7c9e1a3c
