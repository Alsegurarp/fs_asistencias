  /users:
    get:
      tags: [identidad]
      operationId: listUsers
      summary: Lista las personas con acceso a la empresa
      description: |
        Los filtros se aplican en el servidor, antes de paginar. `q` busca por
        fragmento en el nombre y el correo, sin distinguir mayúsculas ni
        acentos. `dossierPermission=true` deja a quienes pueden descargar hoy
        el expediente de la empresa: el permiso vale para la cuenta con la que
        se concedió.
      x-roles: [admin_empresa]
      parameters:
        - $ref: "#/components/parameters/SearchText"
        - name: role
          in: query
          schema:
            $ref: "#/components/schemas/TenantRole"
        - name: status
          in: query
          schema:
            type: string
            enum: [invited, active, disabled]
        - name: dossierPermission
          in: query
          schema:
            type: boolean
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Página de personas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserList"
              example:
                items:
                  - id: a3c5e7b9-1d3f-4b5a-9c7e-1b3d5f7a9c1e
                    email: rh@panificadora.example
                    displayName: Persona de Recursos Humanos
                    roles: [rh]
                    status: active
                    createdAt: "2026-10-05T15:05:00Z"
                    linkedAt: "2026-10-05T16:20:00Z"
                    siteIds: []
                    dossierPermission: false
                    dossierPermissionSince: null
                    employeeId: null
                nextCursor: null
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Unprocessable"
    post:
      tags: [identidad]
      operationId: inviteUser
      summary: Invita a una persona por correo y le da roles
      description: |
        La persona queda `invited` hasta que entra por primera vez con ese
        correo verificado. Responde 409 con `code` `email_unavailable` si el
        correo ya pertenece a alguien; la respuesta no dice a qué empresa.

        `employeeId` liga la cuenta con una fila del padrón: es lo que deja a
        un `trabajador` ver su semana y acusar su cierre desde el portal. Una
        fila se liga a una sola cuenta: responde 409 con `code`
        `employee_already_linked` si ya lo está.
      x-roles: [admin_empresa]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserCreate"
            example:
              email: rh@panificadora.example
              displayName: Persona de Recursos Humanos
              roles: [rh]
      responses:
        "201":
          description: Persona invitada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
              example:
                id: a3c5e7b9-1d3f-4b5a-9c7e-1b3d5f7a9c1e
                email: rh@panificadora.example
                displayName: Persona de Recursos Humanos
                roles: [rh]
                status: invited
                createdAt: "2026-10-05T15:05:00Z"
                linkedAt: null
                siteIds: []
                dossierPermission: false
                dossierPermissionSince: null
                employeeId: null
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /users/summary:
    get:
      tags: [identidad]
      operationId: getUserSummary
      summary: Cuenta las personas con acceso por estado, rol y permiso
      description: |
        Con la misma búsqueda `q` que `listUsers`, sin filtrar por estado ni
