      responses:
        "200":
          description: Incidencia
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Incident"
              example:
                id: 6e8a0c2e-4b6d-4f8a-8c0e-2b4d6f8a0c2e
                type: late_sync
                severity: low
                status: open
                employeeId: 5a7c9e1b-3d5f-4b6a-8c0e-2a4c6e8b0d12
                employeeName: Ana Torres
                employeeExternalId: "0187"
                siteId: 3b1f9a52-6c0d-4e7a-8f21-9d4c5b6a7e80
                eventIds: [3c5e7a9c-1e3a-4c5e-9a1c-3e5a7c9e1a3c]
                occurredAt: "2026-10-06T12:50:00Z"
                openedAt: "2026-10-06T12:55:03Z"
                assigneeUserId: null
                assigneeName: null
                assignedAt: null
                assignedBy: null
                assignedByName: null
                blocksClosure: false
                resolution: null
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [jornada]
      operationId: updateIncident
      summary: Asigna o resuelve una incidencia
      description: |
        Resolver exige una decisión y un motivo. Un ajuste no edita el marcaje:
        agrega una intención y produce una versión nueva del cálculo.

        `assigneeUserId` asigna la incidencia a una persona que pueda
        resolverla, las mismas que da `listIncidentAssignees`, y en nulo quita
        la asignación. Asignar guarda quién y cuándo en `assignedBy` y
        `assignedAt`; quitarla los borra. Responde 422 con `user_not_found` si
        esa persona no tiene acceso vigente, y con `assignee_cannot_resolve`
        si lo tiene pero no puede resolver incidencias de esa sede.
        `adjustment` sólo va con
        la decisión `adjusted`, y cada clase trae lo suyo y nada más:
        `add_event` lleva `eventType` y `occurredAt`; `exclude_event` lleva
        `eventId`; `retype_event` lleva `eventId` y `eventType`. El marcaje
        tiene que ser de la misma persona de la incidencia.

        Responde 409 con `code` `incident_already_resolved` si ya estaba
        resuelta: lo resuelto no se reasigna ni se vuelve a decidir. Responde
        409 con `code` `week_closed` si el ajuste cae en una semana cerrada de
        esa persona: primero se reabre.
      x-roles: [admin_empresa, rh, supervisor]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IncidentUpdate"
            example:
              resolution:
                decision: justified
                reason: El teléfono estuvo sin señal durante el turno.
