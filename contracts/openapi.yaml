  /exports/{exportId}/manifest:
    parameters:
      - $ref: "#/components/parameters/ExportId"
    get:
      tags: [exportes]
      operationId: getExportManifest
      summary: Devuelve el manifiesto de un exporte
      description: |
        El manifiesto declara qué se exportó y de dónde salió: empresa,
        semana, zona horaria, la huella del archivo y, por cada fila, el
        cierre del que salió con su versión y su huella. Con él se comprueba
        que un archivo guardado es el que se generó, comparando `fileSha256`
        con el SHA-256 del archivo, y que cada fila corresponde a un cierre,
        comparando `closures[].hash` con el `hash` de ese cierre.

        Se entrega byte por byte como se guardó: el SHA-256 del cuerpo de
        esta respuesta es el `manifestHash` del exporte. Hay que calcularlo
        sobre el cuerpo tal como llega, sin volver a darle formato.

        Sigue disponible después de descargar el archivo o de que venza.
        Responde 409 con `code` `export_not_ready` mientras se prepara, y 410
        con `export_failed` si no se pudo preparar.
      x-roles: [admin_empresa, rh, auditor]
      responses:
        "200":
          description: Manifiesto del exporte
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExportManifest"
              example:
                exportId: e1c3a5b7-9d2f-4b4a-8c6e-0d2f4a6c8e0a
                templateVersion: 1
