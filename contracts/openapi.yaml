  /tenants/{tenantId}/administrators:
    parameters:
      - $ref: "#/components/parameters/TenantId"
    post:
      tags: [identidad]
      operationId: inviteTenantAdministrator
      summary: Invita a otra persona a administrar una empresa, desde la operación del servicio
      description: |
        Para cuando en la empresa nadie con el rol `admin_empresa` entró con
        su cuenta y conserva el acceso: después de soltar la liga de quien la
        administraba con `unlinkTenantAdministrator`, o cuando la invitación
        del alta llegó a un correo equivocado. La persona queda `invited` con
        el rol `admin_empresa` y entra con ese correo verificado, como en el
        alta.

        Si alguien ya administra la empresa con su cuenta, es esa persona
        quien invita a las demás con `inviteUser`: responde 409 con `code`
        `administrator_linked`. Pide un motivo, que queda en la bitácora de la
        empresa. La invitación anterior, si la hay, sigue como estaba.

        Responde 404 si la empresa no existe, y 409 con `code`
        `email_unavailable` si el correo es de quien opera el servicio o ya
        pertenece a alguien; la respuesta no dice a qué empresa.
      x-roles: [operador_saas]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdministratorInvite"
            example:
              email: direccion@panificadora.example
              reason: Quien administraba dejó la empresa y la dirección pidió tomarla.
      responses:
        "201":
          description: Persona invitada a administrar la empresa
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantAdministrator"
              example:
                email: direccion@panificadora.example
                status: invited
                invitedAt: "2026-11-07T18:00:00Z"
                linkedAt: null
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: La empresa ya tiene quien la administre con su cuenta, o el correo no está disponible
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                type: https://zenit.invalid/problems/conflict
                title: Conflicto con el estado actual
                status: 409
                code: administrator_linked
                detail: La empresa ya tiene quien la administre con su cuenta; esa persona invita a las demás.
                correlationId: 0b1c2d3e-4f5a-4b6c-8d7e-9f0a1b2c3d4e
        "422":
          $ref: "#/components/responses/Unprocessable"

  /tenants/{tenantId}/administrators/unlink:
    parameters:
      - $ref: "#/components/parameters/TenantId"
    post:
      tags: [identidad]
      operationId: unlinkTenantAdministrator
      summary: Suelta la liga de quien administra una empresa, desde la operación del servicio
      description: |
        Para cuando quien administra una empresa perdió su cuenta y nadie más
        de la empresa puede soltar su liga con `unlinkUser`. Hace lo mismo que
        esa operación: la persona vuelve a `invited`, conserva sus roles y
        queda ligada otra vez al entrar con ese correo verificado.

        Es lo único que quien opera el servicio hace sobre una persona de una
        empresa. Sólo vale para quien tiene el rol `admin_empresa`, pide un
        motivo, y queda en la bitácora de la empresa con ese motivo. No
        devuelve ningún dato de la persona.

        Responde 404 si la empresa no existe o si en ella no hay nadie que la
        administre con ese correo; la respuesta no distingue los dos casos.
        Responde 409 con `code` `user_not_linked` si esa persona no está
        ligada a ninguna cuenta.
      x-roles: [operador_saas]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdministratorUnlink"
            example:
              email: administracion@panificadora.example
              reason: Perdió su cuenta y es la única persona que administra la empresa.
      responses:
        "204":
          description: Liga soltada
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: La persona no está ligada a ninguna cuenta
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                type: https://zenit.invalid/problems/conflict
                title: Conflicto con el estado actual
                status: 409
                code: user_not_linked
                detail: Esa persona no está ligada a ninguna cuenta.
                correlationId: 0b1c2d3e-4f5a-4b6c-8d7e-9f0a1b2c3d4e
        "422":
          $ref: "#/components/responses/Unprocessable"

  /tenants/{tenantId}/usage:
    parameters:
      - $ref: "#/components/parameters/TenantId"
    get:
      tags: [empresa]
      operationId: getTenantUsage
      summary: Uso de una empresa en un mes, para facturar
      description: |
        Conteos del mes calendario en la zona horaria de la empresa, sin datos
        de personas. Cada uno sale de datos que conservan su historia: un mes
        terminado da siempre lo mismo, y el mes en curso va creciendo
        (`complete` es falso). Qué conteo se cobra lo decide el precio, no el
        servicio.

        - `employeesWithAttendance`: personas distintas con al menos un
          marcaje cuya hora cae en el mes.
        - `employeesInPeriod`: personas cuya relación laboral toca algún día
          del mes. Una baja sin fecha de fin cuenta como vigente.
        - `cardsAssigned`: tarjetas distintas que estuvieron asignadas a
          alguien en algún momento del mes.
        - `devicesActive`: teléfonos y terminales activados antes del fin del
          mes y no revocados ni reemplazados antes de su inicio.
        - `attendanceEvents`: marcajes cuya hora cae en el mes.

        Responde 422 con el error de `month` en `invalid_month` si el mes no
        tiene la forma `AAAA-MM`, y en `future_month` si todavía no empieza en
        la zona horaria de la empresa.
      x-roles: [operador_saas]
      parameters:
        - $ref: "#/components/parameters/UsageMonth"
      responses:
        "200":
          description: Uso de la empresa en el mes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantUsage"
              example:
                tenantId: 7d0c2b7e-51f4-4a0e-9d5b-2f6a1c3e8b10
                month: "2026-10"
                timeZone: America/Mexico_City
                from: "2026-10-01T06:00:00Z"
                to: "2026-11-01T06:00:00Z"
                complete: true
                employeesWithAttendance: 42
                employeesInPeriod: 45
                cardsAssigned: 44
                devicesActive: 3
                attendanceEvents: 3520
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
  /tenant:
    get:
      tags: [empresa]
      operationId: getTenant
      summary: Devuelve la empresa de quien llama
      x-roles: [admin_empresa, rh, supervisor, auditor]
      responses:
        "200":
          description: Empresa actual
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
              example:
                id: 7d0c2b7e-51f4-4a0e-9d5b-2f6a1c3e8b10
                name: Panificadora Ejemplo
                slug: panificadora-ejemplo
                timeZone: America/Mexico_City
                weekStartsOn: monday
                breakPolicy: not_considered
                status: active
                createdAt: "2026-10-05T15:00:00Z"
                autoCloseAfterHours: null
                captureMethods: [card_terminal, phone_tag]
                breakPolicyChange: null
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    patch:
      tags: [empresa]
      operationId: updateTenant
      summary: Cambia nombre, zona horaria, inicio de semana o cierre programado de la empresa
      description: |
        `autoCloseAfterHours` enciende el cierre programado: el sistema cierra
        cada semana ese número de horas después de que termina, en la zona
        horaria de la empresa. En nulo lo apaga, que es como nace; no mandarlo
        no cambia nada. Al encenderlo, la última semana terminada se cierra en
        la siguiente revisión si ya pasó ese plazo. Lo que hace está en
        `requestWeekClosureRun`.

        La política de comida no cambia aquí: se programa con
        `scheduleBreakPolicyChange`. Si la petición trae `breakPolicy`, responde
        422 con su error en `scheduled_change_required`. Mientras haya un cambio
        programado, cambiar `weekStartsOn` responde 409 con `code`
        `break_policy_change_pending`: el cambio entra en un inicio de semana.
      x-roles: [admin_empresa]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TenantUpdate"
            example:
              weekStartsOn: sunday
      responses:
        "200":
          description: Empresa actualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
              example:
                id: 7d0c2b7e-51f4-4a0e-9d5b-2f6a1c3e8b10
                name: Panificadora Ejemplo
                slug: panificadora-ejemplo
                timeZone: America/Mexico_City
                weekStartsOn: sunday
                breakPolicy: not_considered
                status: active
                createdAt: "2026-10-05T15:00:00Z"
                autoCloseAfterHours: null
                captureMethods: [card_terminal, phone_tag]
                breakPolicyChange: null
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Hay un cambio de la política de comida programado y se pidió cambiar el inicio de semana
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                type: https://zenit.invalid/problems/conflict
                title: Conflicto con el estado actual
                status: 409
                code: break_policy_change_pending
                detail: Hay un cambio de la política de comida programado; cancélalo antes de cambiar el inicio de semana.
                correlationId: 0b1c2d3e-4f5a-4b6c-8d7e-9f0a1b2c3d4e
        "422":
          $ref: "#/components/responses/Unprocessable"

  /tenant/break-policy-changes:
