        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [identidad]
      operationId: updateUser
      summary: Cambia el nombre, los roles o el acceso de una persona
      description: |
        `roles` sustituye la lista completa. `disabled` en verdadero quita el
        acceso sin borrar a la persona; en falso lo devuelve. Responde 409 con
        `code` `last_admin` si el cambio dejaría a la empresa sin nadie que la
        administre.

        `employeeId` liga la cuenta con una fila del padrón y en nulo la
        suelta; no mandarlo no cambia nada. Responde 409 con `code`
        `employee_already_linked` si esa fila ya está ligada a otra cuenta.
      x-roles: [admin_empresa]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
            example:
              roles: [rh, supervisor]
      responses:
        "200":
          description: Persona actualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
              example:
                id: a3c5e7b9-1d3f-4b5a-9c7e-1b3d5f7a9c1e
                email: rh@panificadora.example
                displayName: Persona de Recursos Humanos
                roles: [rh, supervisor]
                status: active
                createdAt: "2026-10-05T15:05:00Z"
                linkedAt: "2026-10-05T16:20:00Z"
                employeeId: null
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /users/{userId}/unlink:
    parameters:
      - $ref: "#/components/parameters/UserId"
    post:
      tags: [identidad]
      operationId: unlinkUser
      summary: Suelta la liga entre una persona y su cuenta
      description: |
        Para cuando la persona perdió su cuenta en el proveedor de identidad
        y tiene otra con el mismo correo: mientras la liga anterior exista, la
        cuenta nueva no entra. Al soltarla, la persona vuelve a `invited` y
        conserva sus roles y su fila del padrón; queda ligada otra vez la
        siguiente vez que entre con ese correo verificado. Quien estaba
        `disabled` sigue así.

        No quita el acceso: si la cuenta anterior todavía existe con ese
        correo verificado, vuelve a ligarse al entrar. Para quitar el acceso
        está `disabled`, en `updateUser`.

        Responde 409 con `code` `user_not_linked` si la persona no está
        ligada a ninguna cuenta.
      x-roles: [admin_empresa]
      responses:
        "200":
          description: Persona sin liga
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
              example:
                id: a3c5e7b9-1d3f-4b5a-9c7e-1b3d5f7a9c1e
                email: rh@panificadora.example
                displayName: Persona de Recursos Humanos
                roles: [rh]
                status: invited
                createdAt: "2026-10-05T15:05:00Z"
                linkedAt: null
                employeeId: null
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: La persona no está ligada a ninguna cuenta
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                type: https://zenit.invalid/problems/conflict
                title: Conflicto con el estado actual
                status: 409
                code: user_not_linked
                detail: Esa persona no está ligada a ninguna cuenta.
                correlationId: 0b1c2d3e-4f5a-4b6c-8d7e-9f0a1b2c3d4e

  /users/{userId}/password-change:
    parameters:
      - $ref: "#/components/parameters/UserId"
    post:
      tags: [identidad]
      operationId: requireUserPasswordChange
      summary: Exige contraseña nueva en el próximo ingreso de una cuenta vinculada
      description: |
        Sólo administración de la misma empresa. Requiere cuenta vinculada y
        activa; añade UPDATE_PASSWORD conservando OTP y las otras acciones
        requeridas del proveedor. No recibe ni cambia la contraseña, no envía
        correo ni recupera acceso perdido. No revoca sesiones ya existentes.
        La confirmación se registra en auditoría. Repetir la acción conserva
        el requisito sin duplicarlo. Ante 503 no se confirma el resultado;
        operación debe comprobar la integración antes de repetirla.
      x-roles: [admin_empresa]
      responses:
        "204":
          description: Cambio obligatorio confirmado por el proveedor de identidad
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Cuenta no vinculada o inactiva
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: Integración no configurada o resultado no confirmado
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

