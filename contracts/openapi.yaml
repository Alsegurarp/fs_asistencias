                  serverTime: "2026-10-05T16:05:00Z"
                  tokenMaxAgeSeconds: 300
                  locationReuseSeconds: 0
                  breakPolicy: not_considered
                  offlinePolicy:
                    maxAgeHours: 72
                    maxEvents: 1000
        "410":
          description: El código ya se usó o expiró
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                type: https://zenit.invalid/problems/enrollment-code-unusable
