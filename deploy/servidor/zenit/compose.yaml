# Zenit en el servidor compartido. Se aplica encima de compose.yaml, que sigue
# siendo la definición de imágenes, endurecimiento y redes internas:
#
#   docker compose --project-directory <árbol> \
#     -f <árbol>/compose.yaml -f <árbol>/deploy/servidor/zenit/compose.yaml \
#     --env-file <árbol>/deploy/servidor/zenit/servidor.env up -d --build
#
# Lo que cambia respecto del entorno local:
#   - las direcciones públicas salen de servidor.env;
#   - los secretos viven fuera del árbol, en ZENIT_SECRETOS, para que un
#     despliegue nuevo no los toque;
#   - backend y portal no publican puertos; portal e identidad se unen a la
#     red del borde con un alias propio;
#   - la identidad sólo publica, en la interfaz local, el puerto de su consola,
#     que se usa por túnel SSH;
#   - todo se reinicia solo y sus registros tienen tope.

x-servidor: &servidor
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  db:
    <<: *servidor

  migrate:
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  keycloak:
    <<: *servidor
    environment:
      # La consola no sale por el borde: se alcanza por túnel en esta dirección.
      KC_HOSTNAME_ADMIN: ${IDENTITY_CONSOLE_URL:?Defina IDENTITY_CONSOLE_URL}
      # Sólo le cree las cabeceras X-Forwarded-* al borde, que las sobrescribe.
      KC_PROXY_HEADERS: xforwarded
      KC_PROXY_TRUSTED_ADDRESSES: 172.30.88.0/24
    networks:
      datos:
      borde:
      entrada:
        aliases:
          - zenit-identidad

  backend:
    <<: *servidor
    ports: !reset []
    # El secreto del cliente técnico de contraseñas vive con los demás, fuera
    # del árbol que reemplaza cada despliegue; lo escribe el servicio identidad.
    volumes:
      - ${ZENIT_SECRETOS:?Defina ZENIT_SECRETOS}/identity-admin:/run/identity-admin:ro

  web:
    <<: *servidor
    ports: !reset []
    networks:
      borde:
      entrada:
        aliases:
          - zenit-portal

  secrets-init:
    volumes:
      - ${ZENIT_SECRETOS:?Defina ZENIT_SECRETOS}:/out

  # Keycloak no importa el realm versionado sobre uno que ya existe: este
  # servicio crea en el servidor los clientes y flujos que le falten, y el
  # cliente técnico de contraseñas, sin sobrescribir nada. Lo corre remoto.sh
  # en cada despliegue. Usa la imagen de Node con la que ya se construye el
  # portal, sólo la red interna y sólo los dos archivos de secretos que necesita.
  identidad:
    profiles: ["identidad"]
    image: node:24.21.0-alpine3.24@sha256:ebfe2f90462722a7a4de65e91990e97fe0d401c70e0e762c5b53302f905ec1c1
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Como secrets-init: escribe en la carpeta de secretos, que es de root.
    user: root
    read_only: true
    tmpfs:
      - /tmp
    command: ["node", "/trabajo/identidad.mjs"]
    environment:
      KEYCLOAK_URL: http://keycloak:8082
      PORTAL_URL: ${PORTAL_URL:?Defina PORTAL_URL}
      REALM_FILE: /realm/zenit-realm.json
      SECRETOS: /secretos
    volumes:
      - ./deploy/servidor/zenit/identidad.mjs:/trabajo/identidad.mjs:ro
      - ./infra/keycloak/realm:/realm:ro
      - ${ZENIT_SECRETOS}/keycloak_admin_password:/secretos/keycloak_admin_password:ro
      - ${ZENIT_SECRETOS}/identity-admin:/secretos/identity-admin
    depends_on:
      keycloak:
        condition: service_healthy
    networks:
      - datos

networks:
  entrada:
    external: true
    name: fastsolution-entrada

secrets:
  db_admin_password:
    file: ${ZENIT_SECRETOS}/db_admin_password
  db_migrator_password:
    file: ${ZENIT_SECRETOS}/db_migrator_password
  db_app_password:
    file: ${ZENIT_SECRETOS}/db_app_password
  db_backup_password:
    file: ${ZENIT_SECRETOS}/db_backup_password
  keycloak_db_password:
    file: ${ZENIT_SECRETOS}/keycloak_db_password
  keycloak_conf:
    file: ${ZENIT_SECRETOS}/keycloak.conf
  operator_emails:
    file: ${ZENIT_SECRETOS}/operator_emails
