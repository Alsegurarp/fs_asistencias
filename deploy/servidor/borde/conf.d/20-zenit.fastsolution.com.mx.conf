# Zenit: portal, API e identidad bajo un solo nombre.
#
#   /         portal (su nginx reenvía /api/ al backend)
#   /id/      proveedor de identidad, que adentro sirve en la raíz
#
# De la identidad sólo se publica lo que usan el portal y la app: los realms
# de aplicación y los recursos de sus páginas. La administración, el realm
# master, la salud y las métricas no salen por aquí; la consola se usa por
# túnel SSH en la interfaz local del servidor.

server {
    listen 8443 ssl proxy_protocol;
    http2 on;
    server_name zenit.fastsolution.com.mx;

    ssl_certificate     /etc/nginx/certificados/zenit.fastsolution.com.mx.crt;
    ssl_certificate_key /etc/nginx/certificados/zenit.fastsolution.com.mx.key;

    # El portal pone sus propias cabeceras; aquí sólo HSTS.
    add_header Strict-Transport-Security "max-age=15768000" always;

    limit_req zone=zenit burst=80 nodelay;

    # El proveedor de identidad confía en estas cabeceras sólo si vienen de
    # esta red; se sobrescriben siempre, nunca se agregan a las del visitante.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-Port  443;

    # Las respuestas de la identidad llevan cabeceras grandes (cookies).
    proxy_buffer_size 16k;
    proxy_buffers     8 16k;

    set $identidad zenit-identidad:8082;
    set $portal    zenit-portal:8080;

    location = /id/realms/master  { return 404; }
    location ^~ /id/realms/master/ { return 404; }

    # La identidad sirve en la raíz: se quita /id antes de reenviar. Las URL
    # que genera llevan /id porque su nombre público es la URL completa.
    location ^~ /id/realms/ {
        rewrite ^/id(/.*)$ $1 break;
        proxy_pass http://$identidad;
    }

    location ^~ /id/resources/ {
        rewrite ^/id(/.*)$ $1 break;
        proxy_pass http://$identidad;
    }

    # Lo demás de la identidad: administración, raíz y cualquier otra ruta.
    location ^~ /id/ {
        return 404;
    }

    location / {
        # La importación CSV del padrón acepta hasta 2 MB.
        client_max_body_size 2m;
        proxy_pass http://$portal;
    }
}
