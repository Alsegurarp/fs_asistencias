# Ajustes comunes a todos los servidores del borde. No define ningún server.

server_tokens off;

# La conexión llega con el protocolo PROXY desde el borde del anfitrión, que
# entra por la red fastsolution-entrada. Sólo a ella se le cree la dirección
# que trae; en el 80 no hay protocolo PROXY y la dirección queda como llegó.
set_real_ip_from 172.30.88.0/24;
real_ip_header   proxy_protocol;

# TLS: sólo 1.2 y 1.3, sin tickets de sesión.
ssl_protocols             TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_session_cache         shared:SSL:10m;
ssl_session_timeout       1d;
ssl_session_tickets       off;

proxy_http_version 1.1;

# Los destinos se nombran por su alias en la red y se resuelven en cada
# petición con el DNS de Docker: si un contenedor se recrea y cambia de
# dirección, el borde lo sigue sin recargar, y si aún no existe al arrancar,
# el borde arranca igual y responde 502 sólo en ese nombre.
resolver 127.0.0.11 valid=10s ipv6=off;

# Límites por dirección. El formulario de contacto envía correo con una cuenta
# real: pocos envíos por minuto bastan para una persona y cortan el abuso.
limit_req_zone $binary_remote_addr zone=contacto:1m  rate=5r/m;
limit_req_zone $binary_remote_addr zone=zenit:10m    rate=20r/s;
limit_req_status 429;
