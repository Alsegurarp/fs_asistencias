# Landing de Zenit (Next.js), en su propio nombre y con su propio certificado.
#
# El sitio es estático y sin formularios que lleguen al servidor: sólo se
# esperan lecturas. La aplicación pone sus propias cabeceras de seguridad
# (CSP, X-Frame-Options, nosniff, Referrer-Policy y Permissions-Policy); el
# borde decide HSTS, como en los demás nombres, y la de la aplicación se
# oculta para no mandar dos.

server {
    listen 8443 ssl proxy_protocol;
    http2 on;
    server_name zenitlanding.fastsolution.com.mx;

    ssl_certificate     /etc/nginx/certificados/zenitlanding.fastsolution.com.mx.crt;
    ssl_certificate_key /etc/nginx/certificados/zenitlanding.fastsolution.com.mx.key;

    add_header Strict-Transport-Security "max-age=15768000" always;
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header X-Powered-By;

    # Una página trae decenas de recursos (scripts, imágenes y videos por
    # rangos): la ráfaga los cubre y el ritmo corta la descarga en bucle.
    limit_req zone=zenit_landing burst=120 nodelay;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto https;

    set $zenit_landing zenit-landing:3000;

    location / {
        limit_except GET HEAD { deny all; }
        client_max_body_size 16k;
        proxy_pass http://$zenit_landing;
    }
}
