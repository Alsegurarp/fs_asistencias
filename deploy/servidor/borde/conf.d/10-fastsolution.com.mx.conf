# Landing de fastSolution. El nombre canónico es fastsolution.com.mx; www
# redirige a él. El certificado cubre los dos nombres.

server {
    listen 8443 ssl proxy_protocol;
    http2 on;
    server_name www.fastsolution.com.mx;

    ssl_certificate     /etc/nginx/certificados/fastsolution.com.mx.crt;
    ssl_certificate_key /etc/nginx/certificados/fastsolution.com.mx.key;

    add_header Strict-Transport-Security "max-age=15768000" always;

    return 301 https://fastsolution.com.mx$request_uri;
}

server {
    listen 8443 ssl proxy_protocol;
    http2 on;
    server_name fastsolution.com.mx;

    ssl_certificate     /etc/nginx/certificados/fastsolution.com.mx.crt;
    ssl_certificate_key /etc/nginx/certificados/fastsolution.com.mx.key;

    # El servidor de la landing no envía cabeceras de seguridad; se agregan
    # aquí. Ninguna location usa add_header, para que todas las hereden.
    add_header Strict-Transport-Security "max-age=15768000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto https;

    # Cada envío manda un correo con la cuenta de la landing: pocos por minuto
    # y por dirección, y un cuerpo pequeño (el servidor acepta hasta 8 KB).
    set $landing landing:3000;

    location = /api/contact {
        limit_req zone=contacto burst=2 nodelay;
        client_max_body_size 16k;
        proxy_pass http://$landing;
    }

    location / {
        client_max_body_size 16k;
        proxy_pass http://$landing;
    }
}
