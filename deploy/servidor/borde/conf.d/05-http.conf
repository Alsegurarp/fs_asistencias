# Puerto 80 de los nombres de fastSolution, reenviado por el borde del
# anfitrión. Sirve la validación de certificados y manda todo lo demás a HTTPS.
#
# Es el único archivo que se necesita antes de tener certificados: la primera
# emisión se hace con el borde levantado sólo con 00-comunes.conf y éste.

server {
    listen 8080 default_server;
    server_name fastsolution.com.mx www.fastsolution.com.mx zenit.fastsolution.com.mx;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
