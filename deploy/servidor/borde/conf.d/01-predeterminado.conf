# Servidor predeterminado del 443: atiende una petición cuyo Host no es uno
# de los nombres publicados, aunque el saludo TLS haya pedido uno que sí lo
# es. Sin él, nginx usaría el primer bloque cargado y respondería como si la
# petición fuera para ese sitio. 421 dice que la conexión no corresponde a
# ese nombre. El certificado sólo hace falta para completar el saludo.

server {
    listen 8443 ssl proxy_protocol default_server;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certificados/fastsolution.com.mx.crt;
    ssl_certificate_key /etc/nginx/certificados/fastsolution.com.mx.key;

    return 421;
}
