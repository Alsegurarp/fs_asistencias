spring:
  application:
    name: zenit-backend
  config:
    # Lee los secretos montados como archivo; el nombre del archivo es la propiedad.
    import: optional:configtree:/run/secrets/
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:zenit}
    username: ${DB_USER:zenit_app}
    # Sin valor por defecto: sin secreto la aplicación no arranca.
    password: ${DB_PASSWORD:${db_password}}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 1
  flyway:
    enabled: true
    locations: classpath:db/migration
  jooq:
    sql-dialect: postgres

zenit:
  identity:
    # Sin valor por defecto: sin proveedor de identidad la aplicación no arranca.
    issuer: ${IDENTITY_ISSUER}
    jwks-uri: ${IDENTITY_JWKS_URI}
    audience: ${IDENTITY_AUDIENCE:zenit-api}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

server:
  shutdown: graceful
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false
