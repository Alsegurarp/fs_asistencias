# Pantallas de acceso de Zenit. Hereda del tema de Keycloak su marco
# (template.ftl) y las páginas que el lienzo no dibuja. Las que sí dibuja
# tienen aquí su propia plantilla; al subir de versión Keycloak hay que
# compararlas con las suyas (ver docs/construir-el-portal.md).
parent=keycloak.v2
import=common/keycloak

styles=css/styles.css css/zenit.css
scripts=js/zenit.js
darkMode=false
meta=theme-color==#2257BB
