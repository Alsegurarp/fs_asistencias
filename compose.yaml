name: fastsolution-zenit

# Endurecimiento común: sin privilegios nuevos y sin capacidades de Linux.
x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  db:
    image: postgres:18.6-bookworm@sha256:afc7e2d441324c0388fa80c3d24f733b4194a4eb7f47dd8ee2b08eb1a24a647c
    <<: *hardening
    # Las que el arranque de la imagen necesita para preparar su directorio de
    # datos y bajar al usuario postgres.
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    read_only: true
    tmpfs:
      - /tmp
      - /var/run/postgresql
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zenit}
      POSTGRES_USER: ${POSTGRES_USER:-zenit_app}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
      - keycloak_db_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - zenit-db:/var/lib/postgresql
      # Crea la base del proveedor de identidad al inicializar el volumen.
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    # Sin puerto publicado y en una red sin salida: sólo la alcanzan el backend
    # y el proveedor de identidad.
    networks:
      - datos
    pids_limit: 256
    mem_limit: 512m

  # Proveedor de identidad: inicio de sesión y segundo factor de las personas.
  # Los dispositivos no lo usan.
  keycloak:
    build:
      context: infra/keycloak
      dockerfile: Dockerfile
    <<: *hardening
    read_only: true
    tmpfs:
      - /tmp
      - /opt/keycloak/data/tmp
      - /opt/keycloak/data/transaction-logs
    # Las contraseñas llegan en un archivo de configuración montado como
    # secreto; lo demás, por variables.
    command: ["--config-file=/run/secrets/keycloak.conf", "start", "--optimized", "--import-realm"]
    environment:
      KC_DB_URL: jdbc:postgresql://db:5432/keycloak
      KC_DB_USERNAME: keycloak_app
      KC_HOSTNAME: ${IDENTITY_URL:-http://localhost:8082}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_HTTP_PORT: "8082"
      # Cuenta temporal de arranque; se sustituye por cuentas personales.
      KC_BOOTSTRAP_ADMIN_USERNAME: arranque
      # Dirección del portal, que el realm usa en sus redirecciones permitidas.
      ZENIT_PORTAL_URL: ${PORTAL_URL:-http://localhost:8081}
    secrets:
      # Keycloak exige que el archivo termine en .conf.
      - source: keycloak_conf
        target: keycloak.conf
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"status\": \"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${KEYCLOAK_PORT:-8082}:8082"
    networks:
      - datos
      - borde
    pids_limit: 512
    mem_limit: 1400m

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    <<: *hardening
    read_only: true
    tmpfs:
      - /tmp
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-zenit}
      DB_USER: ${POSTGRES_USER:-zenit_app}
      # El emisor es la dirección pública; las claves se leen por la red interna.
      IDENTITY_ISSUER: ${IDENTITY_URL:-http://localhost:8082}/realms/zenit
      IDENTITY_JWKS_URI: http://keycloak:8082/realms/zenit/protocol/openid-connect/certs
    secrets:
      - db_password
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${BACKEND_PORT:-8080}:8080"
    networks:
      - datos
      - borde
    pids_limit: 256
    mem_limit: 768m

  web:
    build:
      context: web
      dockerfile: Dockerfile
    <<: *hardening
    read_only: true
    tmpfs:
      - /tmp
    depends_on:
      - backend
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-8081}:8080"
    networks:
      - borde
    pids_limit: 64
    mem_limit: 128m

  # Genera los secretos locales, una sola vez:
  #   docker compose --profile setup run --rm secrets-init
  secrets-init:
    image: postgres:18.6-bookworm@sha256:afc7e2d441324c0388fa80c3d24f733b4194a4eb7f47dd8ee2b08eb1a24a647c
    profiles: ["setup"]
    <<: *hardening
    cap_add:
      - DAC_OVERRIDE
      - FOWNER
    network_mode: none
    read_only: true
    user: root
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -eu
        umask 077
        generar() {
          # Si se levantó el entorno sin secreto, Docker dejó un directorio vacío.
          if [ -d "/out/$$1" ]; then
            rmdir "/out/$$1"
          fi
          if [ -f "/out/$$1" ] && [ -s "/out/$$1" ]; then
            echo "$$1: ya existe; no se cambia."
            return 0
          fi
          head -c 48 /dev/urandom | base64 | tr -d '=+/\n' > "/out/$$1"
          chmod 444 "/out/$$1"
          echo "$$1: generado."
        }
        generar db_password
        generar keycloak_db_password
        generar keycloak_admin_password
        # El proveedor de identidad lee sus contraseñas de un archivo de
        # configuración; se arma a partir de las dos anteriores.
        if [ -d /out/keycloak.conf ]; then
          rmdir /out/keycloak.conf
        fi
        printf 'db-password=%s\nbootstrap-admin-password=%s\n' \
          "$$(cat /out/keycloak_db_password)" "$$(cat /out/keycloak_admin_password)" \
          > /out/keycloak.conf
        chmod 444 /out/keycloak.conf
        chmod 700 /out
    volumes:
      - ./secrets:/out

  # Valida el contrato y sus ejemplos:
  #   docker compose --profile tools run --rm contract-lint
  contract-lint:
    image: redocly/cli:2.62.1@sha256:261f36d945b600fef03341316de1fde6921c3fefaf13b114a1fb4705428acd74
    profiles: ["tools"]
    <<: *hardening
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp
    environment:
      HOME: /tmp
      REDOCLY_TELEMETRY: "off"
    working_dir: /spec
    volumes:
      - ./contracts:/spec/contracts:ro
      - ./redocly.yaml:/spec/redocly.yaml:ro
    command: ["lint", "contracts/openapi.yaml"]

  # Busca secretos en todo el historial de Git:
  #   docker compose --profile tools run --rm secret-scan
  secret-scan:
    image: zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
    profiles: ["tools"]
    <<: *hardening
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - ./.git:/repo/.git:ro
    command: ["git", "/repo", "--redact", "--no-banner"]

networks:
  datos:
    internal: true
  borde:

secrets:
  db_password:
    file: ./secrets/db_password
  keycloak_db_password:
    file: ./secrets/keycloak_db_password
  keycloak_conf:
    file: ./secrets/keycloak.conf

volumes:
  zenit-db:
