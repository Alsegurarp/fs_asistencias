name: fastsolution-zenit

# Endurecimiento común: sin privilegios nuevos y sin capacidades de Linux.
x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  db:
    image: postgres:18.6-bookworm@sha256:afc7e2d441324c0388fa80c3d24f733b4194a4eb7f47dd8ee2b08eb1a24a647c
    <<: *hardening
    # Las que el arranque de la imagen necesita para preparar su directorio de
    # datos y bajar al usuario postgres.
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    read_only: true
    tmpfs:
      - /tmp
      - /var/run/postgresql
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zenit}
      POSTGRES_USER: ${POSTGRES_USER:-zenit_app}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - zenit-db:/var/lib/postgresql
    # Sin puerto publicado y en una red sin salida: sólo la alcanza el backend.
    networks:
      - datos
    pids_limit: 256
    mem_limit: 512m

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    <<: *hardening
    read_only: true
    tmpfs:
      - /tmp
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-zenit}
      DB_USER: ${POSTGRES_USER:-zenit_app}
    secrets:
      - db_password
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${BACKEND_PORT:-8080}:8080"
    networks:
      - datos
      - borde
    pids_limit: 256
    mem_limit: 768m

  web:
    build:
      context: web
      dockerfile: Dockerfile
    <<: *hardening
    read_only: true
    tmpfs:
      - /tmp
    depends_on:
      - backend
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-8081}:8080"
    networks:
      - borde
    pids_limit: 64
    mem_limit: 128m

  # Genera la contraseña local de la base, una sola vez:
  #   docker compose --profile setup run --rm secrets-init
  secrets-init:
    image: postgres:18.6-bookworm@sha256:afc7e2d441324c0388fa80c3d24f733b4194a4eb7f47dd8ee2b08eb1a24a647c
    profiles: ["setup"]
    <<: *hardening
    cap_add:
      - DAC_OVERRIDE
      - FOWNER
    network_mode: none
    read_only: true
    user: root
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -eu
        # Si se levantó el entorno sin secreto, Docker dejó un directorio vacío.
        if [ -d /out/db_password ]; then
          rmdir /out/db_password
        fi
        if [ -f /out/db_password ] && [ -s /out/db_password ]; then
          echo "El secreto ya existe; no se cambia."
          exit 0
        fi
        umask 077
        head -c 48 /dev/urandom | base64 | tr -d '=+/\n' > /out/db_password
        chmod 444 /out/db_password
        chmod 700 /out
        echo "Secreto generado en secrets/db_password."
    volumes:
      - ./secrets:/out

  # Valida el contrato y sus ejemplos:
  #   docker compose --profile tools run --rm contract-lint
  contract-lint:
    image: redocly/cli:2.62.1@sha256:261f36d945b600fef03341316de1fde6921c3fefaf13b114a1fb4705428acd74
    profiles: ["tools"]
    <<: *hardening
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp
    environment:
      HOME: /tmp
      REDOCLY_TELEMETRY: "off"
    working_dir: /spec
    volumes:
      - ./contracts:/spec/contracts:ro
      - ./redocly.yaml:/spec/redocly.yaml:ro
    command: ["lint", "contracts/openapi.yaml"]

  # Busca secretos en todo el historial de Git:
  #   docker compose --profile tools run --rm secret-scan
  secret-scan:
    image: zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
    profiles: ["tools"]
    <<: *hardening
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - ./.git:/repo/.git:ro
    command: ["git", "/repo", "--redact", "--no-banner"]

networks:
  datos:
    internal: true
  borde:

secrets:
  db_password:
    file: ./secrets/db_password

volumes:
  zenit-db:
