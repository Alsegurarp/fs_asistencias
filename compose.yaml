name: fastsolution-control-jornada

services:
  db:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jornada}
      POSTGRES_USER: ${POSTGRES_USER:-jornada_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-solo-desarrollo-local}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - jornada-db:/var/lib/postgresql

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-jornada}
      DB_USER: ${POSTGRES_USER:-jornada_app}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-solo-desarrollo-local}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8080}:8080"

  web:
    build:
      context: web
      dockerfile: Dockerfile
    depends_on:
      - backend
    ports:
      - "${WEB_PORT:-8081}:8080"

volumes:
  jornada-db:
