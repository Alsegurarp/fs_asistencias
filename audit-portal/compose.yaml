services:
  audit-php:
    build: .
    environment:
      ZENIT_ISSUER: ${ZENIT_ISSUER:?Define ZENIT_ISSUER}
      ZENIT_API_URL: ${ZENIT_API_URL:?Define ZENIT_API_URL}
      ZENIT_PORTAL_URL: ${ZENIT_PORTAL_URL:?Define ZENIT_PORTAL_URL}
      ZENIT_CLIENT_ID: zenit-audit-portal
  audit-nginx:
    image: nginxinc/nginx-unprivileged:alpine
    depends_on:
      - audit-php
    ports:
      - "127.0.0.1:9080:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/app/public:ro
