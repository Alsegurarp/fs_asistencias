server {
    listen 8080;
    server_name _;
    root /app/public;
    index index.php;

    location = / {
        access_log off;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /app/public/index.php;
        fastcgi_pass audit-php:9000;
        fastcgi_read_timeout 120s;
    }

    location = /portal.css {
        try_files $uri =404;
    }

    location = /invitation.js {
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}
